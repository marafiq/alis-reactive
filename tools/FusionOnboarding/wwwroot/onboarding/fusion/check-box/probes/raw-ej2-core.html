<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Fusion CheckBox Raw EJ2 API Probe</title>
    <link rel="stylesheet" href="/vendor/syncfusion/material.css" />
    <script src="/vendor/syncfusion/dist/ej2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        #host { border: 1px solid #d0d7de; padding: 16px; margin-bottom: 16px; }
        table { border-collapse: collapse; margin: 16px 0; width: 100%; }
        th, td { border: 1px solid #d0d7de; padding: 8px; text-align: left; vertical-align: top; }
        th { background: #f6f8fa; }
        pre { background: #111827; color: #e5e7eb; padding: 12px; overflow: auto; }
        button { margin-right: 8px; }
    </style>
</head>
<body>
    <h1>Fusion CheckBox Raw EJ2 API Probe</h1>
    <p>Use this page to discover the exact Syncfusion EJ2 JS object API before onboarding typed Fusion C# members.</p>
    <div id="host">
        <div id="checkbox-probe"></div>
    </div>

    <h2>Candidate Matrix</h2>
    <p>Every row must be proven here before it becomes typed Fusion API.</p>
    <table>
        <thead>
            <tr>
                <th>Candidate</th>
                <th>Kind</th>
                <th>Builder</th>
                <th>Args</th>
                <th>Return/Payload</th>
                <th>Proof</th>
                <th>Proposed C#</th>
                <th>Outcome</th>
            </tr>
        </thead>
        <tbody id="proposal-body"></tbody>
    </table>

    <button id="dump">Dump Keys</button>
    <button id="clear">Clear Trace</button>
    <pre id="trace"></pre>

    <script>
        const trace = [];
        const proposalRows = [];
        const target = document.getElementById("checkbox-probe");

        function safeJson(key, value) {
            if (value instanceof Element) return "[Element#" + (value.id || value.tagName) + "]";
            if (typeof value === "function") return "[Function]";
            return value;
        }

        function clean(value, seen, depth) {
            if (value === null || typeof value !== "object") return value;
            if (value instanceof Element) return "[Element#" + (value.id || value.tagName) + "]";
            if (depth > 4) return "[MaxDepth]";
            if (seen.has(value)) return "[Circular]";
            seen.add(value);
            if (Array.isArray(value)) return value.slice(0, 20).map(item => clean(item, seen, depth + 1));
            const output = {};
            Object.keys(value).slice(0, 80).forEach(key => {
                const item = value[key];
                output[key] = typeof item === "function" ? "[Function]" : clean(item, seen, depth + 1);
            });
            return output;
        }

        function functionNames(value) {
            const names = new Set();
            let current = value;
            while (current && current !== Object.prototype) {
                Object.getOwnPropertyNames(current).forEach(name => {
                    if (name !== "constructor" && typeof value[name] === "function") {
                        names.add(name);
                    }
                });
                current = Object.getPrototypeOf(current);
            }
            return Array.from(names).sort();
        }

        function describePayload(args) {
            if (args === null || args === undefined) {
                return {
                    ownKeys: [],
                    functions: [],
                    properties: {},
                    value: args === undefined ? "undefined" : null
                };
            }
            const own = Object.keys(args).sort();
            const properties = {};
            own.forEach(key => {
                const item = args[key];
                properties[key] = {
                    type: item === null ? "null" : Array.isArray(item) ? "array" : typeof item,
                    sample: clean(item, new WeakSet(), 0)
                };
            });
            return {
                ownKeys: own,
                functions: functionNames(args),
                properties
            };
        }

        function record(label, value) {
            trace.push({
                at: new Date().toISOString(),
                label,
                value: clean(value, new WeakSet(), 0)
            });
            renderTrace();
        }

        function renderTrace() {
            document.getElementById("trace").textContent =
                JSON.stringify(trace, safeJson, 2);
        }

        function renderProposal() {
            const body = document.getElementById("proposal-body");
            body.innerHTML = "";
            proposalRows.forEach(row => {
                const tr = document.createElement("tr");
                [
                    row.candidate,
                    row.kind,
                    row.builder,
                    row.args,
                    row.returnOrPayload,
                    row.proof,
                    row.csharp,
                    row.outcome
                ].forEach(value => {
                    const td = document.createElement("td");
                    td.textContent = value || "";
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
        }

        function proposal(row) {
            proposalRows.push(row);
            renderProposal();
            return row;
        }

        const probe = {
            target,
            trace,
            proposalRows,
            proposal,
            record,
            member: (label, read) => record(label, read()),
            call: (label, invoke) => record(label, invoke()),
            event: (label, args) => record(label, describePayload(args)),
            eventCall: (label, args, method, call) => {
                const before = describePayload(args);
                const result = call();
                record(label, {
                    method,
                    before,
                    result: clean(result, new WeakSet(), 0),
                    after: describePayload(args)
                });
            }
        };

        window.__fusionProbe = probe;

        const ej2 = new ej.buttons.CheckBox({
            label: "I accept the Residency Agreement",
            checked: false,
            change: args => probe.event("change", args)
        });
        ej2.appendTo(target);
        probe.ej2 = ej2;

        document.getElementById("dump").addEventListener("click", () => {
            record("own keys", Object.keys(ej2).sort());
            const proto = Object.getPrototypeOf(ej2);
            record("prototype methods", Object.getOwnPropertyNames(proto).sort());
        });

        document.getElementById("clear").addEventListener("click", () => {
            trace.length = 0;
            renderTrace();
        });

        record("ready", {
            component: "check-box",
            apiSet: "core",
            namespace: "ej.buttons",
            className: "CheckBox",
            id: "checkbox-probe",
            traceFile: "/Users/muhammadadnanrafiq/Documents/Code/alis-reactive-framework-1-0/Alis.Reactive/tools/FusionOnboarding/wwwroot/onboarding/fusion/check-box/traces/raw-ej2-core.trace.json"
        });

        // Exercise the accepted runtime surface so the saved trace carries real
        // payload keys, method returns, and visible-state evidence — not just the
        // static shell. Each step mirrors a typed FusionCheckBox member.
        probe.member("checked initial read", () => ej2.checked);

        // click() toggles the checked state and fires the change event; the change
        // handler above records the payload keys for this gesture.
        probe.call("click() method", () => { ej2.click(); return ej2.checked; });
        probe.member("checked after click", () => ej2.checked);

        // indeterminate is a property write flushed by dataBind(); the box then
        // shows the e-stop dash.
        ej2.indeterminate = true;
        probe.call("dataBind() after indeterminate set", () => { ej2.dataBind(); return null; });
        probe.member("indeterminate read", () => ej2.indeterminate);
        probe.member("frame class after indeterminate", () =>
            (document.querySelector(".e-checkbox-wrapper .e-frame") || {}).className || "");

        // disabled is a property write flushed by dataBind(); the wrapper then
        // carries e-checkbox-disabled.
        ej2.indeterminate = false;
        ej2.disabled = true;
        probe.call("dataBind() after disabled set", () => { ej2.dataBind(); return null; });
        probe.member("disabled read", () => ej2.disabled);
        probe.member("wrapper class after disabled", () =>
            (document.querySelector(".e-checkbox-wrapper") || {}).className || "");
        ej2.disabled = false;
        ej2.dataBind();

        // focusIn() moves focus into the checkbox; record the active element id.
        probe.call("focusIn() method", () => { ej2.focusIn(); return null; });
        probe.member("active element after focusIn", () => (document.activeElement || {}).id || "");

        proposal({
            candidate: "checked",
            kind: "prop-read + prop-write",
            builder: "not covered",
            args: "boolean",
            returnOrPayload: "boolean on the instance",
            proof: "checked initial read / after click; change payload checked key",
            csharp: "Checked() / SetChecked(bool)",
            outcome: "implement"
        });
        proposal({
            candidate: "change",
            kind: "event",
            builder: "covered (builder.Change)",
            args: "ChangeEventArgs",
            returnOrPayload: "checked: boolean, event: DOM Event, name: string",
            proof: "change payload recorded on click()",
            csharp: "FusionCheckBoxEvents.Changed + FusionCheckBoxChangeArgs.Checked",
            outcome: "implement (checked); exclude event/name"
        });
        proposal({
            candidate: "click",
            kind: "method",
            builder: "not covered",
            args: "none",
            returnOrPayload: "void; toggles checked",
            proof: "checked flips after click()",
            csharp: "Click()",
            outcome: "implement"
        });
        proposal({
            candidate: "focusIn",
            kind: "method",
            builder: "not covered",
            args: "none",
            returnOrPayload: "void; moves focus into the input",
            proof: "active element id after focusIn()",
            csharp: "FocusIn()",
            outcome: "implement"
        });
        proposal({
            candidate: "indeterminate",
            kind: "prop-read + prop-write",
            builder: "covered (builder.Indeterminate)",
            args: "boolean",
            returnOrPayload: "boolean; e-stop dash on the frame",
            proof: "indeterminate read; frame class after set + dataBind",
            csharp: "Indeterminate() / SetIndeterminate(bool)",
            outcome: "implement (post-render read/write)"
        });
        proposal({
            candidate: "disabled",
            kind: "prop-read + prop-write",
            builder: "covered (builder.Disabled)",
            args: "boolean",
            returnOrPayload: "boolean; e-checkbox-disabled on the wrapper",
            proof: "disabled read; wrapper class after set + dataBind",
            csharp: "Disabled() / SetDisabled(bool)",
            outcome: "implement (post-render read/write)"
        });
        proposal({
            candidate: "dataBind",
            kind: "method",
            builder: "not covered",
            args: "none",
            returnOrPayload: "void; flushes property writes to the DOM",
            proof: "frame/wrapper class change only appears after dataBind()",
            csharp: "internal repaint companion of Set* writes",
            outcome: "implement (internal)"
        });
    </script>
</body>
</html>
