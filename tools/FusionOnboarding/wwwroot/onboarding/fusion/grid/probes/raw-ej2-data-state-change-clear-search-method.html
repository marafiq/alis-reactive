<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FusionGrid dataStateChange Clear Search Method Raw EJ2 Probe</title>
    <link rel="stylesheet" href="/css/syncfusion.dev.css" />
    <script src="/vendor/syncfusion/dist/ej2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        #grid-host { border: 1px solid #d0d7de; padding: 16px; margin-bottom: 16px; }
        pre { background: #111827; color: #e5e7eb; padding: 12px; overflow: auto; }
    </style>
</head>
<body>
    <h1>FusionGrid dataStateChange Clear Search Method Raw EJ2 Probe</h1>
    <p>One method row: <code>search("")</code> after an active <code>search("Memory")</code>.</p>
    <div id="grid-host">
        <div id="grid"></div>
    </div>
    <pre id="trace"></pre>

    <script>
        const trace = [];
        const rows = [
            { id: 1, name: "Alpha", careLevel: "Memory Care", wing: "North" },
            { id: 2, name: "Beta", careLevel: "Assisted Living", wing: "South" },
            { id: 3, name: "Gamma", careLevel: "Memory Care", wing: "East" },
            { id: 4, name: "Delta", careLevel: "Independent", wing: "West" },
            { id: 5, name: "Epsilon", careLevel: "Memory Care", wing: "North" }
        ];

        function clean(value, seen = new WeakSet(), depth = 0) {
            if (value === null || typeof value !== "object") return value;
            if (value instanceof Element) {
                return {
                    kind: "Element",
                    id: value.id || "",
                    tagName: value.tagName,
                    className: value.className || "",
                    text: (value.textContent || "").replace(/\s+/g, " ").trim()
                };
            }
            if (depth > 6) return "[MaxDepth]";
            if (seen.has(value)) return "[Circular]";
            seen.add(value);
            if (Array.isArray(value)) return value.map(item => clean(item, seen, depth + 1));
            const output = {};
            Object.keys(value).sort().forEach(key => {
                const item = value[key];
                output[key] = typeof item === "function" ? "[Function]" : clean(item, seen, depth + 1);
            });
            return output;
        }

        function summarizeSearch(value) {
            if (!value || typeof value !== "object") return value ?? null;
            return {
                fields: Array.isArray(value.fields) ? [...value.fields] : [],
                key: value.key,
                operator: value.operator,
                ignoreCase: value.ignoreCase,
                ignoreAccent: value.ignoreAccent
            };
        }

        function summarizeSearches(value) {
            if (!Array.isArray(value)) return [];
            return value.map(item => summarizeSearch(item));
        }

        function summarizeAction(action) {
            if (!action) return null;
            return {
                requestType: action.requestType,
                type: action.type,
                name: action.name,
                cancel: action.cancel,
                searchString: action.searchString
            };
        }

        function describePayload(args) {
            if (args === null || args === undefined) {
                return { ownKeys: [], properties: {}, value: args === undefined ? "undefined" : null };
            }
            const ownKeys = Object.keys(args).sort();
            const hasSearch = Object.prototype.hasOwnProperty.call(args, "search");
            const properties = {};
            ownKeys.forEach(key => {
                const item = args[key];
                properties[key] = {
                    type: item === null ? "null" : Array.isArray(item) ? "array" : item instanceof Element ? "element" : typeof item,
                    sample: key === "action"
                        ? summarizeAction(item)
                        : key === "search"
                            ? summarizeSearches(item)
                            : clean(item)
                };
            });
            return {
                ownKeys,
                properties,
                searchShape: {
                    hasTopLevelSearch: hasSearch,
                    search: hasSearch ? summarizeSearches(args.search) : "absent",
                    action: summarizeAction(args.action)
                },
                absentKeysChecked: ["search", "where", "group", "sorted"]
                    .filter(key => !Object.prototype.hasOwnProperty.call(args, key))
            };
        }

        function record(label, value) {
            trace.push({ at: new Date().toISOString(), label, value: clean(value) });
            document.getElementById("trace").textContent = JSON.stringify(trace, null, 2);
        }

        function applyState(state) {
            const skip = typeof state.skip === "number" ? state.skip : 0;
            const take = typeof state.take === "number" ? state.take : rows.length;
            const search = Array.isArray(state.search) ? state.search[0] : null;
            let filtered = rows.slice();
            if (search && search.key) {
                const fields = Array.isArray(search.fields) && search.fields.length > 0
                    ? search.fields
                    : ["name", "careLevel", "wing"];
                const needle = search.ignoreCase === false ? search.key : search.key.toLowerCase();
                filtered = filtered.filter(row => fields.some(field => {
                    const text = String(row[field] ?? "");
                    const haystack = search.ignoreCase === false ? text : text.toLowerCase();
                    return haystack.includes(needle);
                }));
            }
            return { result: filtered.slice(skip, skip + take), count: filtered.length };
        }

        window.__fusionProbe = { trace, record };

        const grid = new ej.grids.Grid({
            dataSource: applyState({ skip: 0, take: 2 }),
            columns: [
                { field: "id", headerText: "ID", width: 90, isPrimaryKey: true, textAlign: "Right" },
                { field: "name", headerText: "Name", width: 160 },
                { field: "careLevel", headerText: "Care Level", width: 160 },
                { field: "wing", headerText: "Wing", width: 120 }
            ],
            allowPaging: true,
            pageSettings: { pageSize: 2 },
            searchSettings: {
                fields: ["name", "careLevel", "wing"],
                operator: "contains",
                ignoreCase: true,
                ignoreAccent: false
            },
            dataStateChange: args => {
                const search = Array.isArray(args.search) && args.search[0] ? args.search[0] : null;
                const label = search && search.key ? "event:dataStateChange:searching-setup" : "event:dataStateChange:clear-search-method";
                record(label, describePayload(args));
                grid.dataSource = applyState(args);
            }
        });

        grid.appendTo(document.getElementById("grid"));
        window.__fusionProbe.ej2 = grid;

        async function nextFrame() {
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function run() {
            await nextFrame();
            record("ready", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                searchSettings: summarizeSearch(grid.searchSettings)
            });
            grid.search("Memory");
            await nextFrame();
            record("method:search", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                searchSettings: summarizeSearch(grid.searchSettings),
                firstRowCells: [...document.querySelectorAll("#grid .e-row:first-child .e-rowcell")].map(item => item.textContent.replace(/\s+/g, " ").trim())
            });
            grid.search("");
            await nextFrame();
            record("method:clearSearch", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                searchSettings: summarizeSearch(grid.searchSettings),
                firstRowCells: [...document.querySelectorAll("#grid .e-row:first-child .e-rowcell")].map(item => item.textContent.replace(/\s+/g, " ").trim())
            });
            record("complete", { traceRows: trace.length + 1 });
        }

        run().catch(error => record("error", { message: String(error), stack: error && error.stack }));
    </script>
</body>
</html>
