<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FusionGrid beginEdit Dialog Raw EJ2 Probe</title>
    <link rel="stylesheet" href="/css/syncfusion.dev.css" />
    <script src="/vendor/syncfusion/dist/ej2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        #grid-host { border: 1px solid #d0d7de; padding: 16px; margin-bottom: 16px; }
        pre { background: #111827; color: #e5e7eb; padding: 12px; overflow: auto; }
    </style>
</head>
<body>
    <h1>FusionGrid beginEdit Dialog Raw EJ2 Probe</h1>
    <p>Equivalence variant: <code>beginEdit</code> fired by starting <strong>dialog</strong> edit on an existing row.
       Proves the typed payload shape (rowData, rowIndex, type, cancel) matches the normal-mode variant per P001.</p>
    <div id="grid-host">
        <div id="read-grid"></div>
        <div id="cancel-grid"></div>
    </div>
    <pre id="trace"></pre>

    <script>
        const trace = [];
        const rows = [
            { id: 1, name: "Alpha", careLevel: "Memory Care", wing: "North", openTasks: 2 },
            { id: 2, name: "Beta", careLevel: "Assisted Living", wing: "South", openTasks: 3 },
            { id: 3, name: "Gamma", careLevel: "Memory Care", wing: "East", openTasks: 4 }
        ];

        function clean(value, seen = new WeakSet(), depth = 0) {
            if (value === undefined) return "[Undefined]";
            if (value === null || typeof value !== "object") return value;
            if (value instanceof Element) return summarizeElement(value);
            if (value instanceof Event) return summarizeEvent(value);
            if (value instanceof Promise) return "[Promise]";
            if (depth > 5) return "[MaxDepth]";
            if (seen.has(value)) return "[Circular]";
            seen.add(value);
            if (Array.isArray(value)) return value.map(item => clean(item, seen, depth + 1));
            const output = {};
            Object.keys(value).sort().forEach(key => {
                const item = value[key];
                output[key] = typeof item === "function" ? "[Function]" : clean(item, seen, depth + 1);
            });
            return output;
        }

        function summarizeElement(value) {
            return {
                kind: "Element",
                id: value.id || "",
                tagName: value.tagName,
                className: value.className || "",
                text: (value.textContent || "").replace(/\s+/g, " ").trim()
            };
        }

        function summarizeEvent(value) {
            return {
                kind: value.constructor && value.constructor.name ? value.constructor.name : "Event",
                type: value.type,
                target: value.target instanceof Element ? summarizeElement(value.target) : null
            };
        }

        function describePayload(args) {
            if (args === null || args === undefined) {
                return { ownKeys: [], properties: {}, value: args === undefined ? "[Undefined]" : null };
            }
            const ownKeys = Object.keys(args).sort();
            const properties = {};
            ownKeys.forEach(key => {
                const item = args[key];
                properties[key] = {
                    type: item === undefined ? "undefined" : item === null ? "null" : Array.isArray(item) ? "array" : item instanceof Element ? "element" : item instanceof Event ? "event" : typeof item,
                    sample: key === "row" ? summarizePayloadElement(item) : clean(item)
                };
            });
            return {
                ownKeys,
                beginEditShape: {
                    cancel: args.cancel,
                    foreignKeyData: clean(args.foreignKeyData),
                    isScroll: args.isScroll,
                    primaryKey: clean(args.primaryKey),
                    primaryKeyValue: clean(args.primaryKeyValue),
                    requestType: args.requestType,
                    row: summarizePayloadElement(args.row),
                    rowData: clean(args.rowData),
                    rowIndex: args.rowIndex,
                    target: clean(args.target),
                    type: args.type
                },
                properties
            };
        }

        function summarizePayloadElement(item) {
            return item instanceof Element ? summarizeElement(item) : clean(item);
        }

        function record(label, value) {
            trace.push({ at: new Date().toISOString(), label, value: clean(value) });
            document.getElementById("trace").textContent = JSON.stringify(trace, null, 2);
        }

        window.__fusionProbe = { trace, record };

        function createGrid(hostId, beginEdit) {
            const grid = new ej.grids.Grid({
                dataSource: rows.map(item => ({ ...item })),
                allowSelection: true,
                toolbar: ["Edit", "Update", "Cancel"],
                editSettings: {
                    allowEditing: true,
                    mode: "Dialog",
                    allowEditOnDblClick: false
                },
                columns: [
                    { field: "id", headerText: "ID", width: 90, isPrimaryKey: true, textAlign: "Right", allowEditing: false },
                    { field: "name", headerText: "Name", width: 160 },
                    { field: "careLevel", headerText: "Care Level", width: 160 },
                    { field: "wing", headerText: "Wing", width: 120 },
                    { field: "openTasks", headerText: "Tasks", width: 100, textAlign: "Right", editType: "numericedit" }
                ],
                beginEdit
            });
            grid.appendTo(document.getElementById(hostId));
            return grid;
        }

        const readGrid = createGrid("read-grid", args => {
            record("event:beginEdit:dialog", describePayload(args));
        });
        const cancelGrid = createGrid("cancel-grid", args => {
            const before = describePayload(args);
            args.cancel = true;
            record("event:beginEdit:cancel", {
                before,
                after: describePayload(args)
            });
        });
        window.__fusionProbe.ej2 = { readGrid, cancelGrid };

        async function nextFrame() {
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function waitForRows(hostId) {
            for (let attempt = 0; attempt < 60; attempt++) {
                const renderedRows = document.querySelectorAll(`#${hostId} .e-row`);
                if (renderedRows.length > 0) return renderedRows;
                await nextFrame();
            }
            throw new Error(`${hostId} rows did not render`);
        }

        async function waitForBeginEdit(label) {
            for (let attempt = 0; attempt < 60; attempt++) {
                if (trace.some(item => item.label === label)) return;
                await nextFrame();
            }
            throw new Error(`${label} event did not fire`);
        }

        async function run() {
            await waitForRows("read-grid");
            await waitForRows("cancel-grid");
            record("ready", {
                readRowCount: document.querySelectorAll("#read-grid .e-row").length,
                cancelRowCount: document.querySelectorAll("#cancel-grid .e-row").length,
                firstRowCells: [...document.querySelectorAll("#read-grid .e-row:first-child .e-rowcell")]
                    .map(item => item.textContent.replace(/\s+/g, " ").trim())
            });
            readGrid.selectRow(0);
            await nextFrame();
            readGrid.startEdit();
            await waitForBeginEdit("event:beginEdit:dialog");
            await nextFrame();
            record("edit-started", {
                hasEditDialog: !!document.querySelector(".e-edit-dialog, .e-dialog"),
                traceRows: trace.length + 1
            });

            cancelGrid.selectRow(0);
            await nextFrame();
            cancelGrid.startEdit();
            await waitForBeginEdit("event:beginEdit:cancel");
            await nextFrame();
            record("edit-cancelled", {
                hasEditDialog: !!document.querySelector("#cancel-grid .e-edit-dialog"),
                traceRows: trace.length + 1
            });
            record("complete", { traceRows: trace.length + 1 });
        }

        run().catch(error => record("error", { message: String(error), stack: error && error.stack }));
    </script>
</body>
</html>
