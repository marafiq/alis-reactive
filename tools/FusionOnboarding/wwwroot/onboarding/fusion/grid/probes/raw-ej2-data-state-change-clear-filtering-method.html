<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FusionGrid dataStateChange Clear Filtering Method Raw EJ2 Probe</title>
    <link rel="stylesheet" href="/css/syncfusion.dev.css" />
    <script src="/vendor/syncfusion/dist/ej2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        #grid-host { border: 1px solid #d0d7de; padding: 16px; margin-bottom: 16px; }
        pre { background: #111827; color: #e5e7eb; padding: 12px; overflow: auto; }
    </style>
</head>
<body>
    <h1>FusionGrid dataStateChange Clear Filtering Method Raw EJ2 Probe</h1>
    <p>One method row: <code>clearFiltering()</code> after an active <code>filterByColumn("status", "equal", "Open")</code>.</p>
    <div id="grid-host">
        <div id="grid"></div>
    </div>
    <pre id="trace"></pre>

    <script>
        const trace = [];
        const rows = [
            { id: 1, name: "Alpha", status: "Open", risk: "Low" },
            { id: 2, name: "Beta", status: "Closed", risk: "High" },
            { id: 3, name: "Gamma", status: "Open", risk: "Medium" },
            { id: 4, name: "Delta", status: "Closed", risk: "Low" },
            { id: 5, name: "Epsilon", status: "Open", risk: "High" }
        ];

        function clean(value, seen = new WeakSet(), depth = 0) {
            if (value === null || typeof value !== "object") return value;
            if (value instanceof Element) {
                return {
                    kind: "Element",
                    id: value.id || "",
                    tagName: value.tagName,
                    className: value.className || "",
                    text: (value.textContent || "").replace(/\s+/g, " ").trim()
                };
            }
            if (depth > 8) return "[MaxDepth]";
            if (seen.has(value)) return "[Circular]";
            seen.add(value);
            if (Array.isArray(value)) return value.map(item => clean(item, seen, depth + 1));
            const output = {};
            Object.keys(value).sort().forEach(key => {
                const item = value[key];
                output[key] = typeof item === "function" ? "[Function]" : clean(item, seen, depth + 1);
            });
            return output;
        }

        function summarizeFilter(value) {
            if (!value || typeof value !== "object") return value ?? null;
            const source = value.properties && typeof value.properties === "object"
                ? value.properties
                : value;
            return {
                field: source.field,
                operator: source.operator,
                value: source.value,
                predicate: source.predicate,
                matchCase: source.matchCase,
                ignoreAccent: source.ignoreAccent,
                actualFilterValue: clean(source.actualFilterValue),
                actualOperator: clean(source.actualOperator),
                type: source.type,
                uid: source.uid,
                isForeignKey: source.isForeignKey,
                condition: source.condition,
                ignoreCase: source.ignoreCase,
                isComplex: source.isComplex,
                predicates: Array.isArray(source.predicates)
                    ? source.predicates.map(item => summarizeFilter(item))
                    : []
            };
        }

        function summarizeFilters(value) {
            if (!Array.isArray(value)) return [];
            return value.map(item => summarizeFilter(item));
        }

        function summarizeFilterAction(action) {
            if (!action) return null;
            return {
                requestType: action.requestType,
                type: action.type,
                name: action.name,
                action: action.action,
                cancel: action.cancel,
                currentFilteringColumn: action.currentFilteringColumn,
                currentFilterObject: summarizeFilter(action.currentFilterObject),
                columns: summarizeFilters(action.columns)
            };
        }

        function describePayload(args) {
            if (args === null || args === undefined) {
                return { ownKeys: [], properties: {}, value: args === undefined ? "undefined" : null };
            }
            const ownKeys = Object.keys(args).sort();
            const hasWhere = Object.prototype.hasOwnProperty.call(args, "where");
            const properties = {};
            ownKeys.forEach(key => {
                const item = args[key];
                properties[key] = {
                    type: item === null ? "null" : Array.isArray(item) ? "array" : item instanceof Element ? "element" : typeof item,
                    sample: key === "action"
                        ? summarizeFilterAction(item)
                        : key === "where"
                            ? summarizeFilters(item)
                            : clean(item)
                };
            });
            return {
                ownKeys,
                properties,
                filterShape: {
                    hasTopLevelWhere: hasWhere,
                    where: hasWhere ? summarizeFilters(args.where) : "absent",
                    action: summarizeFilterAction(args.action)
                },
                absentKeysChecked: ["where", "search", "group", "sorted"]
                    .filter(key => !Object.prototype.hasOwnProperty.call(args, key))
            };
        }

        function record(label, value) {
            trace.push({ at: new Date().toISOString(), label, value: clean(value) });
            document.getElementById("trace").textContent = JSON.stringify(trace, null, 2);
        }

        function flattenFilters(filters, output = []) {
            filters.forEach(filter => {
                if (filter && Array.isArray(filter.predicates) && filter.predicates.length > 0) {
                    flattenFilters(filter.predicates, output);
                } else if (filter) {
                    output.push(filter);
                }
            });
            return output;
        }

        function applyState(state) {
            const skip = typeof state.skip === "number" ? state.skip : 0;
            const take = typeof state.take === "number" ? state.take : rows.length;
            const filters = flattenFilters(Array.isArray(state.where) ? state.where : []);
            let filtered = rows.slice();
            filters.forEach(filter => {
                if (filter.field === "status" && filter.operator === "equal") {
                    filtered = filtered.filter(row => row.status === filter.value);
                }
            });
            return { result: filtered.slice(skip, skip + take), count: filtered.length };
        }

        window.__fusionProbe = { trace, record };

        const grid = new ej.grids.Grid({
            dataSource: applyState({ skip: 0, take: 2 }),
            columns: [
                { field: "id", headerText: "ID", width: 90, isPrimaryKey: true, textAlign: "Right", allowFiltering: false },
                { field: "name", headerText: "Name", width: 160 },
                { field: "status", headerText: "Status", width: 140 },
                { field: "risk", headerText: "Risk", width: 120 }
            ],
            allowFiltering: true,
            allowPaging: true,
            pageSettings: { pageSize: 2 },
            filterSettings: { type: "FilterBar" },
            dataStateChange: args => {
                const hasWhere = Object.prototype.hasOwnProperty.call(args, "where");
                const label = hasWhere ? "event:dataStateChange:filtering-setup" : "event:dataStateChange:clear-filtering-method";
                record(label, describePayload(args));
                grid.dataSource = applyState(args);
            }
        });

        grid.appendTo(document.getElementById("grid"));
        window.__fusionProbe.ej2 = grid;

        async function nextFrame() {
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function run() {
            await nextFrame();
            record("ready", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                filterColumns: summarizeFilters(grid.filterSettings.columns)
            });
            grid.filterByColumn("status", "equal", "Open");
            await nextFrame();
            record("method:filterByColumn", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                filterColumns: summarizeFilters(grid.filterSettings.columns),
                firstRowCells: [...document.querySelectorAll("#grid .e-row:first-child .e-rowcell")].map(item => item.textContent.replace(/\s+/g, " ").trim())
            });
            grid.clearFiltering();
            await nextFrame();
            record("method:clearFiltering", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                filterColumns: summarizeFilters(grid.filterSettings.columns),
                firstRowCells: [...document.querySelectorAll("#grid .e-row:first-child .e-rowcell")].map(item => item.textContent.replace(/\s+/g, " ").trim())
            });
            record("complete", { traceRows: trace.length + 1 });
        }

        run().catch(error => record("error", { message: String(error), stack: error && error.stack }));
    </script>
</body>
</html>
