<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FusionGrid beforeBatchSave Add/Delete Raw EJ2 Probe</title>
    <link rel="stylesheet" href="/css/syncfusion.dev.css" />
    <script src="/vendor/syncfusion/dist/ej2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        #grid-host { border: 1px solid #d0d7de; padding: 16px; margin-bottom: 16px; }
        pre { background: #111827; color: #e5e7eb; padding: 12px; overflow: auto; }
    </style>
</head>
<body>
    <h1>FusionGrid beforeBatchSave Add/Delete Raw EJ2 Probe</h1>
    <p>Variant: <code>beforeBatchSave</code> fired after a batch <code>addRecord</code> and
       <code>deleteRecord</code>, proving <code>batchChanges.addedRecords</code> and
       <code>batchChanges.deletedRecords</code> populate.</p>
    <div id="grid-host">
        <div id="grid"></div>
    </div>
    <pre id="trace"></pre>

    <script>
        const trace = [];
        const rows = [
            { id: 1, name: "Alpha", careLevel: "Memory Care", wing: "North", openTasks: 2 },
            { id: 2, name: "Beta", careLevel: "Assisted Living", wing: "South", openTasks: 3 },
            { id: 3, name: "Gamma", careLevel: "Memory Care", wing: "East", openTasks: 4 }
        ];
        let beforeBatchSaveCount = 0;

        function clean(value, seen = new WeakSet(), depth = 0) {
            if (value === undefined) return "[Undefined]";
            if (value === null || typeof value !== "object") return value;
            if (value instanceof Element) return summarizeElement(value);
            if (value instanceof Promise) return "[Promise]";
            if (depth > 5) return "[MaxDepth]";
            if (seen.has(value)) return "[Circular]";
            seen.add(value);
            if (Array.isArray(value)) return value.map(item => clean(item, seen, depth + 1));
            const output = {};
            Object.keys(value).sort().forEach(key => {
                const item = value[key];
                output[key] = typeof item === "function" ? "[Function]" : clean(item, seen, depth + 1);
            });
            return output;
        }

        function summarizeElement(value) {
            return { kind: "Element", id: value.id || "", tagName: value.tagName };
        }

        function describePayload(args) {
            const bc = args.batchChanges || {};
            return {
                ownKeys: Object.keys(args).sort(),
                cancel: args.cancel,
                batchChanges: {
                    addedRecords: clean(bc.addedRecords),
                    changedRecords: clean(bc.changedRecords),
                    deletedRecords: clean(bc.deletedRecords)
                },
                counts: {
                    added: (bc.addedRecords || []).length,
                    changed: (bc.changedRecords || []).length,
                    deleted: (bc.deletedRecords || []).length
                }
            };
        }

        function record(label, value) {
            trace.push({ at: new Date().toISOString(), label, value: clean(value) });
            document.getElementById("trace").textContent = JSON.stringify(trace, null, 2);
        }

        window.__fusionProbe = { trace, record };

        const grid = new ej.grids.Grid({
            dataSource: rows.map(r => ({ ...r })),
            allowSelection: true,
            toolbar: ["Add", "Delete", "Update", "Cancel"],
            editSettings: {
                allowEditing: true,
                allowAdding: true,
                allowDeleting: true,
                mode: "Batch",
                allowEditOnDblClick: false,
                showConfirmDialog: false
            },
            columns: [
                { field: "id", headerText: "ID", width: 90, isPrimaryKey: true, textAlign: "Right", allowEditing: false },
                { field: "name", headerText: "Name", width: 160 },
                { field: "careLevel", headerText: "Care Level", width: 160 },
                { field: "wing", headerText: "Wing", width: 120 },
                { field: "openTasks", headerText: "Tasks", width: 100, textAlign: "Right", editType: "numericedit" }
            ],
            beforeBatchSave: args => {
                beforeBatchSaveCount += 1;
                record("event:beforeBatchSave:add-delete", describePayload(args));
            }
        });

        grid.appendTo(document.getElementById("grid"));
        window.__fusionProbe.ej2 = grid;

        async function nextFrame() {
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function waitForRows() {
            for (let attempt = 0; attempt < 60; attempt++) {
                if (document.querySelectorAll("#grid .e-row").length > 0) return;
                await nextFrame();
            }
            throw new Error("Grid rows did not render");
        }

        async function waitForBeforeBatchSave(count) {
            for (let attempt = 0; attempt < 60; attempt++) {
                if (beforeBatchSaveCount >= count) return;
                await nextFrame();
            }
            throw new Error("beforeBatchSave did not fire");
        }

        async function run() {
            await waitForRows();
            record("ready", {
                rowCount: document.querySelectorAll("#grid .e-row").length,
                publicMethods: {
                    addRecord: typeof grid.addRecord,
                    deleteRecord: typeof grid.deleteRecord,
                    endEdit: typeof grid.endEdit
                }
            });

            // Admit a new resident (pending batch add).
            grid.addRecord({ id: 99, name: "Zara Admitted", careLevel: "Assisted Living", wing: "North", openTasks: 1 });
            await nextFrame();

            // Discharge an existing resident (pending batch delete of Beta, id 2).
            grid.selectRow(1);
            await nextFrame();
            grid.deleteRecord();
            await nextFrame();

            record("pending-before-commit", { batchChanges: clean(grid.getBatchChanges()) });

            grid.endEdit();
            await waitForBeforeBatchSave(1);
            await nextFrame();
            record("complete", { traceRows: trace.length + 1 });
        }

        run().catch(error => record("error", { message: String(error), stack: error && error.stack }));
    </script>
</body>
</html>
