<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FusionGrid dataStateChange Clear Grouping Method Raw EJ2 Probe</title>
    <link rel="stylesheet" href="/css/syncfusion.dev.css" />
    <script src="/vendor/syncfusion/dist/ej2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        #grid-host { border: 1px solid #d0d7de; padding: 16px; margin-bottom: 16px; }
        pre { background: #111827; color: #e5e7eb; padding: 12px; overflow: auto; }
    </style>
</head>
<body>
    <h1>FusionGrid dataStateChange Clear Grouping Method Raw EJ2 Probe</h1>
    <p>One method row: <code>clearGrouping()</code> after active <code>groupColumn("careLevel")</code> and <code>groupColumn("wing")</code>.</p>
    <div id="grid-host">
        <div id="grid"></div>
    </div>
    <pre id="trace"></pre>

    <script>
        const trace = [];
        const rows = [
            { id: 1, name: "Alpha", careLevel: "Memory Care", wing: "North" },
            { id: 2, name: "Beta", careLevel: "Assisted Living", wing: "South" },
            { id: 3, name: "Gamma", careLevel: "Memory Care", wing: "East" },
            { id: 4, name: "Delta", careLevel: "Independent", wing: "West" },
            { id: 5, name: "Epsilon", careLevel: "Assisted Living", wing: "North" }
        ];

        function clean(value, seen = new WeakSet(), depth = 0) {
            if (value === null || typeof value !== "object") return value;
            if (value instanceof Element) {
                return {
                    kind: "Element",
                    id: value.id || "",
                    tagName: value.tagName,
                    className: value.className || "",
                    text: (value.textContent || "").replace(/\s+/g, " ").trim()
                };
            }
            if (depth > 6) return "[MaxDepth]";
            if (seen.has(value)) return "[Circular]";
            seen.add(value);
            if (Array.isArray(value)) return value.map(item => clean(item, seen, depth + 1));
            const output = {};
            Object.keys(value).sort().forEach(key => {
                const item = value[key];
                output[key] = typeof item === "function" ? "[Function]" : clean(item, seen, depth + 1);
            });
            return output;
        }

        function summarizeGroupAction(action) {
            if (!action) return null;
            return {
                requestType: action.requestType,
                type: action.type,
                name: action.name,
                cancel: action.cancel,
                columnName: action.columnName,
                preventFocusOnGroup: action.preventFocusOnGroup
            };
        }

        function summarizeGroups(value) {
            return Array.isArray(value) ? [...value] : [];
        }

        function describePayload(args) {
            if (args === null || args === undefined) {
                return { ownKeys: [], properties: {}, value: args === undefined ? "undefined" : null };
            }
            const ownKeys = Object.keys(args).sort();
            const hasGroup = Object.prototype.hasOwnProperty.call(args, "group");
            const properties = {};
            ownKeys.forEach(key => {
                const item = args[key];
                properties[key] = {
                    type: item === null ? "null" : Array.isArray(item) ? "array" : item instanceof Element ? "element" : typeof item,
                    sample: key === "action"
                        ? summarizeGroupAction(item)
                        : key === "group"
                            ? summarizeGroups(item)
                            : clean(item)
                };
            });
            return {
                ownKeys,
                properties,
                groupShape: {
                    hasTopLevelGroup: hasGroup,
                    group: hasGroup ? summarizeGroups(args.group) : "absent",
                    action: summarizeGroupAction(args.action)
                },
                absentKeysChecked: ["group", "groups", "where", "search", "sorted", "aggregates"]
                    .filter(key => !Object.prototype.hasOwnProperty.call(args, key))
            };
        }

        function record(label, value) {
            trace.push({ at: new Date().toISOString(), label, value: clean(value) });
            document.getElementById("trace").textContent = JSON.stringify(trace, null, 2);
        }

        function groupRows(sourceRows, groupFields, level = 0) {
            if (level >= groupFields.length) return sourceRows;
            const field = groupFields[level];
            const groups = new Map();
            sourceRows.forEach(row => {
                const key = String(row[field] ?? "");
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(row);
            });
            return [...groups.entries()]
                .sort(([left], [right]) => left.localeCompare(right))
                .map(([key, items]) => ({
                    key,
                    count: items.length,
                    field,
                    items: groupRows(items, groupFields, level + 1)
                }));
        }

        function applyState(state) {
            const skip = typeof state.skip === "number" ? state.skip : 0;
            const take = typeof state.take === "number" ? state.take : rows.length;
            const groups = Array.isArray(state.group) ? state.group : [];
            if (groups.length > 0) {
                const groupedRows = groupRows(rows, groups);
                return { result: groupedRows, count: rows.length };
            }
            return { result: rows.slice(skip, skip + take), count: rows.length };
        }

        let phase = "setup";
        let clearGroupingEventIndex = 0;

        window.__fusionProbe = { trace, record };

        const grid = new ej.grids.Grid({
            dataSource: applyState({ skip: 0, take: 2 }),
            columns: [
                { field: "id", headerText: "ID", width: 90, isPrimaryKey: true, textAlign: "Right" },
                { field: "name", headerText: "Name", width: 160 },
                { field: "careLevel", headerText: "Care Level", width: 160 },
                { field: "wing", headerText: "Wing", width: 120 }
            ],
            allowGrouping: true,
            allowPaging: true,
            pageSettings: { pageSize: 2 },
            groupSettings: { showDropArea: true },
            dataStateChange: args => {
                const requestType = args && args.action && args.action.requestType
                    ? args.action.requestType
                    : "unknown";
                let label = `event:dataStateChange:${requestType}-setup`;
                if (phase === "clearGrouping") {
                    clearGroupingEventIndex += 1;
                    label = `event:dataStateChange:clear-grouping-method:${clearGroupingEventIndex}`;
                }
                record(label, describePayload(args));
                grid.dataSource = applyState(args);
            }
        });

        grid.appendTo(document.getElementById("grid"));
        window.__fusionProbe.ej2 = grid;

        async function nextFrame() {
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function run() {
            await nextFrame();
            record("ready", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                groupSettings: { columns: summarizeGroups(grid.groupSettings.columns) }
            });
            phase = "grouping-setup";
            grid.groupColumn("careLevel");
            await nextFrame();
            grid.groupColumn("wing");
            await nextFrame();
            record("method:groupColumn:setup", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                groupSettings: { columns: summarizeGroups(grid.groupSettings.columns) },
                captionText: [...document.querySelectorAll(".e-groupcaption")].map(item => item.textContent.replace(/\s+/g, " ").trim())
            });
            phase = "clearGrouping";
            grid.clearGrouping();
            await nextFrame();
            record("method:clearGrouping", {
                currentPage: grid.pageSettings.currentPage,
                pageSize: grid.pageSettings.pageSize,
                clearGroupingEventCount: clearGroupingEventIndex,
                groupSettings: { columns: summarizeGroups(grid.groupSettings.columns) },
                captionText: [...document.querySelectorAll(".e-groupcaption")].map(item => item.textContent.replace(/\s+/g, " ").trim()),
                firstRowCells: [...document.querySelectorAll("#grid .e-row:first-child .e-rowcell")].map(item => item.textContent.replace(/\s+/g, " ").trim())
            });
            record("complete", { traceRows: trace.length + 1 });
        }

        run().catch(error => record("error", { message: String(error), stack: error && error.stack }));
    </script>
</body>
</html>
