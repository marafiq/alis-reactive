<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FusionGrid dataStateChange Sorting Raw EJ2 Probe</title>
    <link rel="stylesheet" href="/css/syncfusion.dev.css" />
    <script src="/vendor/syncfusion/dist/ej2.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; }
        #grid-host { border: 1px solid #d0d7de; padding: 16px; margin-bottom: 16px; }
        pre { background: #111827; color: #e5e7eb; padding: 12px; overflow: auto; }
    </style>
</head>
<body>
    <h1>FusionGrid dataStateChange Sorting Raw EJ2 Probe</h1>
    <p>One event row: <code>dataStateChange</code> fired by sorting.</p>
    <div id="grid-host">
        <div id="grid"></div>
    </div>
    <pre id="trace"></pre>

    <script>
        const trace = [];
        const rows = [
            { id: 1, name: "Alpha", status: "Open", risk: "Low" },
            { id: 2, name: "Beta", status: "Closed", risk: "High" },
            { id: 3, name: "Gamma", status: "Open", risk: "Medium" }
        ];

        function clean(value, seen = new WeakSet(), depth = 0) {
            if (value === null || typeof value !== "object") return value;
            if (value instanceof Element) return "[Element#" + (value.id || value.tagName) + "]";
            if (depth > 5) return "[MaxDepth]";
            if (seen.has(value)) return "[Circular]";
            seen.add(value);
            if (Array.isArray(value)) return value.map(item => clean(item, seen, depth + 1));
            const output = {};
            Object.keys(value).sort().forEach(key => {
                const item = value[key];
                output[key] = typeof item === "function" ? "[Function]" : clean(item, seen, depth + 1);
            });
            return output;
        }

        function describePayload(args) {
            if (args === null || args === undefined) {
                return { ownKeys: [], properties: {}, value: args === undefined ? "undefined" : null };
            }
            const ownKeys = Object.keys(args).sort();
            const properties = {};
            ownKeys.forEach(key => {
                const item = args[key];
                properties[key] = {
                    type: item === null ? "null" : Array.isArray(item) ? "array" : typeof item,
                    sample: clean(item)
                };
            });
            return {
                ownKeys,
                properties,
                absentKeysChecked: ["where", "search", "group", "requiresCounts"]
                    .filter(key => !Object.prototype.hasOwnProperty.call(args, key))
            };
        }

        function record(label, value) {
            trace.push({ at: new Date().toISOString(), label, value: clean(value) });
            document.getElementById("trace").textContent = JSON.stringify(trace, null, 2);
        }

        function applyState(state) {
            let output = rows.slice();
            if (Array.isArray(state.sorted)) {
                state.sorted.slice().reverse().forEach(sort => {
                    output.sort((left, right) => {
                        const leftValue = left[sort.name];
                        const rightValue = right[sort.name];
                        if (leftValue === rightValue) return 0;
                        const result = leftValue > rightValue ? 1 : -1;
                        return sort.direction === "descending" ? -result : result;
                    });
                });
            }
            const skip = typeof state.skip === "number" ? state.skip : 0;
            const take = typeof state.take === "number" ? state.take : output.length;
            return { result: output.slice(skip, skip + take), count: output.length };
        }

        window.__fusionProbe = { trace, record };

        const grid = new ej.grids.Grid({
            dataSource: applyState({ skip: 0, take: 2 }),
            columns: [
                { field: "id", headerText: "ID", width: 90, isPrimaryKey: true, textAlign: "Right" },
                { field: "name", headerText: "Name", width: 160 },
                { field: "status", headerText: "Status", width: 140 },
                { field: "risk", headerText: "Risk", width: 120 }
            ],
            allowSorting: true,
            allowPaging: true,
            pageSettings: { pageSize: 2 },
            dataStateChange: args => {
                record("event:dataStateChange:sorting", describePayload(args));
                grid.dataSource = applyState(args);
            }
        });

        grid.appendTo(document.getElementById("grid"));
        window.__fusionProbe.ej2 = grid;

        async function nextFrame() {
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        }

        async function run() {
            record("ready", {
                initialRows: Array.from(document.querySelectorAll("#grid .e-row"))
                    .map(row => row.textContent.replace(/\s+/g, " ").trim())
            });
            grid.sortColumn("name", "Descending", false);
            await nextFrame();
            record("method:sortColumn", {
                sortedColumns: grid.sortSettings.columns.map(column => ({
                    field: column.field,
                    direction: column.direction
                }))
            });
            record("complete", { traceRows: trace.length + 1 });
        }

        run().catch(error => record("error", { message: String(error), stack: error && error.stack }));
    </script>
</body>
</html>
