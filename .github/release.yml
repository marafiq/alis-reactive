changelog:
  exclude:
    labels:
      - skip-changelog
      - chore
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
        - critical
    - title: Refactoring and code quality
      labels:
        - refactor
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
