version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@syncfusion/*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    open-pull-requests-limit: 2
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Syncfusion.*"
      - dependency-name: "Microsoft.CodeAnalysis.*"
