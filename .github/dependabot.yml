# Weekly, grouped dependency updates for the three ecosystems this repo builds with. One PR per
# ecosystem per week for minor/patch bumps; majors arrive as their own PR so they get a real review.
# Dependabot keeps SHA-pinned actions current as long as the pin carries a "# vX.Y.Z" comment.
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    # The root package-lock.json covers the npm workspaces (Alis.Reactive.Assets, Alis.Reactive.SandboxApp).
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      docs-site-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Syncfusion EJ2 is pinned to the 32.x line on purpose (v33 is the upgrade-mode validation
      # case in high-quality-bar-tasks.md). Minor and patch updates within 32.x are welcome.
      - dependency-name: "Syncfusion.*"
        update-types: ["version-update:semver-major"]
