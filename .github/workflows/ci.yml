name: CI

# Verification for every pull request and for pushes to main / release/*. This workflow NEVER
# publishes — releasing is a pushed v* tag handled by nuget-publish.yml (docs/RELEASING.md), so
# merging to main can never accidentally ship a package. The gate itself is defined once, in
# gate.yml; this file only decides when it runs. Design and evidence: docs/CI.md.
on:
  push:
    branches: [main, 'release/*']
    paths:
      - 'Alis.Reactive/**'
      - 'Alis.Reactive.Assets/**'
      - 'Alis.Reactive.Native/**'
      - 'Alis.Reactive.DesignSystem/**'
      - 'Alis.Reactive.Fusion/**'
      - 'Alis.Reactive.FluentValidator/**'
      - 'Alis.Reactive.NativeTagHelpers/**'
      - 'Alis.Reactive.Analyzers/**'
      - 'Alis.Reactive.SandboxApp/**'
      - 'tests/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'global.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      # The behavioral coverage gate (0b) and the coverage maps it reads.
      - '.claude/skills/onboard-fusion-component/**'
      - 'tools/FusionOnboarding/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/gate.yml'
      - '.github/actions/**'
  # No path filter on pull requests: a required check must always report (docs/CI.md, "Gating").
  pull_request:
  workflow_dispatch:

# One live run per pull request: a new push supersedes the previous run, so a stale commit never
# keeps five browser shards busy. Pushes to main and release/* are never cancelled (each commit is
# a signal), and release tags have their own workflow with cancel-in-progress: false.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: gate
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
      checks: write
    with:
      configuration: Release
      playwright: true
      retry-failed: 1
    secrets:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
