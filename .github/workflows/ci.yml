name: CI

on:
  push:
    branches: [main, 'release/*']
    paths:
      - 'Alis.Reactive/**'
      - 'Alis.Reactive.Assets/**'
      - 'Alis.Reactive.Native/**'
      - 'Alis.Reactive.DesignSystem/**'
      - 'Alis.Reactive.Fusion/**'
      - 'Alis.Reactive.NativeTagHelpers/**'
      - 'Alis.Reactive.Analyzers/**'
      - 'Alis.Reactive.SandboxApp/**'
      - 'tests/**'
      - 'examples/resident-intake/**'
      - 'build/**'
      - 'Alis.Reactive.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/gate.yml'
      - '.github/actions/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: gate
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
      checks: write
    with:
      configuration: Release
      playwright: true
      retry-failed: 1
    secrets:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
