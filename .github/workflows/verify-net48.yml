# Verifies the multi-target libraries compile and pack on REAL .NET Framework 4.8
# (Windows), not just against the cross-platform reference assemblies used on macOS/Linux.
# This is the RC1 net48 gate the macOS dev box cannot provide.
name: verify-net48

on:
  workflow_dispatch:
  push:
    branches: ['tiny-safe-but-important-refactorings']

jobs:
  net48-windows:
    name: Build + pack net48 on real .NET Framework 4.8 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm deps
        run: npm ci

      - name: Build browser assets (generates runtime/types/plan.ts + bundles)
        run: npm run build:all

      - name: Build full solution in Release (net48 compiled against real .NET Framework 4.8)
        run: dotnet build Alis.Reactive.slnx -c Release

      - name: Explicit net48-only build of every multi-target library
        shell: bash
        run: |
          set -euo pipefail
          for proj in \
            Alis.Reactive/Alis.Reactive.csproj \
            Alis.Reactive.Native/Alis.Reactive.Native.csproj \
            Alis.Reactive.Fusion/Alis.Reactive.Fusion.csproj \
            Alis.Reactive.FluentValidator/Alis.Reactive.FluentValidator.csproj \
            Alis.Reactive.DesignSystem/Alis.Reactive.DesignSystem.csproj ; do
            echo "::group::net48 build $proj"
            dotnet build "$proj" -c Release -f net48
            echo "::endgroup::"
          done

      - name: Pack six NuGets on Windows
        shell: bash
        run: scripts/pack.sh 1.0.0-rc.1

      - name: List produced packages
        shell: bash
        run: ls -1 ./nupkgs/

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-net48-windows
          path: nupkgs/*.nupkg
          if-no-files-found: error

  net48-runtime-iis:
    name: net48 runtime boots under IIS Express (Playwright screenshot proof)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install npm deps
        run: npm ci

      - name: Build browser assets
        run: npm run build:all

      - name: Pack rc.1 packages (local feed for the MVC5 consumer)
        shell: bash
        run: scripts/pack.sh 1.0.0-rc.1

      - name: Restore + build the classic MVC5 net48 web app
        shell: pwsh
        run: msbuild examples/net48-mvc-smoke/Net48MvcSmoke.csproj /p:Configuration=Release /restore /t:Build

      - name: Confirm runtime assets landed in Content\alisreactive
        shell: pwsh
        run: |
          $dir = "examples/net48-mvc-smoke/Content/alisreactive"
          Get-ChildItem $dir
          if (-not (Test-Path "$dir/alis-reactive.1.0.0-rc.1.js")) { throw "runtime JS did not land in Content\alisreactive" }
          if (-not (Test-Path "$dir/design-system.1.0.0-rc.1.css")) { throw "design-system CSS did not land in Content\alisreactive" }

      - name: Generate web.config binding redirects from the built bin assemblies
        shell: pwsh
        # Classic net48 web apps do not auto-add binding redirects for PackageReference transitives
        # (the System.Text.Json 9 dependency chain). Rather than hand-guess versions, derive an exact
        # redirect for every strong-named assembly actually in bin\ and rewrite web.config's <runtime>.
        run: |
          $bin = "examples/net48-mvc-smoke/bin"
          $cfgPath = (Resolve-Path "examples/net48-mvc-smoke/Web.config").Path
          $ns = "urn:schemas-microsoft-com:asm.v1"
          [xml]$doc = Get-Content $cfgPath
          $runtime = $doc.configuration.runtime
          if (-not $runtime) { $runtime = $doc.CreateElement("runtime"); $doc.configuration.AppendChild($runtime) | Out-Null }
          $runtime.RemoveAll()
          $ab = $doc.CreateElement("assemblyBinding", $ns)
          $runtime.AppendChild($ab) | Out-Null
          Get-ChildItem "$bin\*.dll" | ForEach-Object {
            try {
              $an = [System.Reflection.AssemblyName]::GetAssemblyName($_.FullName)
              $tok = $an.GetPublicKeyToken()
              if (-not $tok -or $tok.Length -eq 0) { return }
              $token = ($tok | ForEach-Object { $_.ToString("x2") }) -join ""
              $v = $an.Version.ToString()
              $da = $doc.CreateElement("dependentAssembly", $ns)
              $id = $doc.CreateElement("assemblyIdentity", $ns)
              $id.SetAttribute("name", $an.Name); $id.SetAttribute("publicKeyToken", $token); $id.SetAttribute("culture", "neutral")
              $br = $doc.CreateElement("bindingRedirect", $ns)
              $br.SetAttribute("oldVersion", "0.0.0.0-$v"); $br.SetAttribute("newVersion", $v)
              $da.AppendChild($id) | Out-Null; $da.AppendChild($br) | Out-Null
              $ab.AppendChild($da) | Out-Null
              Write-Host "redirect: $($an.Name) -> $v"
            } catch { Write-Host "skip $($_.Name): $($_.Exception.Message)" }
          }
          $doc.Save($cfgPath)

      - name: Install Playwright (node) + chromium
        shell: bash
        run: |
          cd examples/net48-mvc-smoke/ci
          npm install
          npx playwright install chromium

      - name: Launch IIS Express and run the Playwright reactive proof
        shell: pwsh
        run: |
          $iis = "$env:ProgramFiles\IIS Express\iisexpress.exe"
          if (-not (Test-Path $iis)) { $iis = "${env:ProgramFiles(x86)}\IIS Express\iisexpress.exe" }
          $app = Join-Path $PWD "examples/net48-mvc-smoke"
          $log = Join-Path $PWD "iisexpress.out.log"
          $errlog = Join-Path $PWD "iisexpress.err.log"
          Write-Host "IIS Express: $iis"
          Write-Host "App path:    $app"
          $proc = Start-Process -FilePath $iis -ArgumentList "/path:$app","/port:5000","/systray:false" -PassThru -RedirectStandardOutput $log -RedirectStandardError $errlog
          try {
            $ready = $false; $resp = $null
            for ($i = 0; $i -lt 40; $i++) {
              try {
                # -SkipHttpErrorCheck: a 500 startup error still means the server is UP — we want to
                # SEE that body, not retry forever as if the port were dead.
                $resp = Invoke-WebRequest "http://localhost:5000/" -UseBasicParsing -TimeoutSec 4 -SkipHttpErrorCheck
                if ($resp.StatusCode -ge 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 2 }
            }
            Write-Host "=== IIS Express stdout ==="; if (Test-Path $log) { Get-Content $log }
            Write-Host "=== IIS Express stderr ==="; if (Test-Path $errlog) { Get-Content $errlog }
            if (-not $ready) { throw "IIS Express never responded on http://localhost:5000/ (port dead)." }
            Write-Host "HTTP status: $($resp.StatusCode)"
            if ($resp.StatusCode -ge 400) {
              Write-Host "=== response body (first 4000 chars) ==="
              Write-Host ($resp.Content.Substring(0, [Math]::Min(4000, $resp.Content.Length)))
              throw "App returned HTTP $($resp.StatusCode) on / — see the error body above."
            }
            $env:SMOKE_URL = "http://localhost:5000/"
            $env:SCREENSHOT = "$app\net48-smoke.png"
            node examples/net48-mvc-smoke/ci/verify.mjs
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Upload net48 runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net48-runtime-screenshot
          path: examples/net48-mvc-smoke/net48-smoke.png
          if-no-files-found: warn
