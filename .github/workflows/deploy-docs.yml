name: Deploy docs site to GitHub Pages

# Pushes to main build and deploy. Pull requests that touch the same inputs build only, so a docs
# change or a docs-site dependency bump (Dependabot) proves the site still builds before it merges.
# The framework gate never builds docs-site, so without this a docs-site PR's green proved nothing.
on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'Alis.Reactive/**'
      - 'Alis.Reactive.Native/**'
      - 'Alis.Reactive.DesignSystem/**'
      - 'Alis.Reactive.Fusion/**'
      - 'Alis.Reactive.FluentValidator/**'
      - 'Alis.Reactive.SandboxApp/wwwroot/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'Alis.Reactive/**'
      - 'Alis.Reactive.Native/**'
      - 'Alis.Reactive.DesignSystem/**'
      - 'Alis.Reactive.Fusion/**'
      - 'Alis.Reactive.FluentValidator/**'
      - 'Alis.Reactive.SandboxApp/wwwroot/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request builds in its own group, so it never cancels or waits on a Pages deploy.
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          overwrite: true   # a re-run of this job replaces the artifact instead of failing on the name
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
