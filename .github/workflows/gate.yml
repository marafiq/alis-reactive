name: gate

# The one verification gate. Every workflow that asks "is this commit good?" calls this file —
# ci.yml on pull requests and pushes, nightly.yml on a schedule, nuget-publish.yml on a release
# tag — so there is exactly one definition of the steps, the tool versions
# (.github/actions/setup-toolchain), the shard partition (scripts/playwright.sh --shard) and the
# timeouts. Locally the same gate is `scripts/test.sh`. In CI it is split into one deterministic
# job and five browser shards so the browser leg finishes in about 20 minutes instead of about 80.
# Design rationale, the evidence behind the numbers, and the change checklist: docs/CI.md.
on:
  workflow_call:
    inputs:
      configuration:
        description: .NET build configuration for the deterministic job. Release matches the publish gate.
        type: string
        default: Release
      playwright:
        description: Run the sharded browser suite.
        type: boolean
        default: true
      retry-failed:
        description: How many times scripts/playwright.sh re-runs only the tests that failed (0 = never).
        type: number
        default: 1
    secrets:
      SYNCFUSION_LICENSE_KEY:
        description: Registers EJ2 on the runner. Without it a trial modal intercepts every interaction.
        required: false

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30   # observed: about 2 minutes (docs/CI.md, "Facts")
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Deterministic gate (typecheck, assets, vitest, dotnet build, dotnet tests)
        run: CONFIGURATION=${{ inputs.configuration }} scripts/test.sh --no-e2e

  playwright:
    name: playwright (${{ matrix.shard }})
    if: ${{ inputs.playwright }}
    runs-on: ubuntu-latest
    # Observed: 14-18 minutes of tests per shard plus about 2 minutes of setup, single worker
    # (docs/CI.md, "Sharding"). 60 leaves 3x headroom for a slow runner and one re-run pass.
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write   # dorny/test-reporter writes the TRX summary as a check run
    strategy:
      fail-fast: false   # every shard reports; one red shard must not hide the others
      matrix:
        shard:
          - fusion-a-f-and-core
          - fusion-g-l-and-http
          - fusion-m-z
          - components-and-validation
          - conditions-patterns-and-rest
    env:
      # Without a registered license, EJ2 overlays a trial modal that intercepts every interaction:
      # the actual cause of the historical red legs (fixed in 2d5f9562).
      Syncfusion__LicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Build app and Playwright project
        run: scripts/build.sh

      - name: Install Playwright browsers
        # Deliberately not cached: Playwright's CI guide says restoring a browser cache takes about
        # as long as the download, and the OS dependencies are not cacheable (docs/CI.md).
        run: pwsh tests/Alis.Reactive.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run shard ${{ matrix.shard }}
        run: scripts/playwright.sh --no-build --shard "${{ matrix.shard }}" --retry-failed "${{ inputs.retry-failed }}"

      - name: Publish the TRX results to the job summary
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Playwright results (${{ matrix.shard }})
          path: tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.trx
          reporter: dotnet-trx
          use-actions-summary: true
          list-suites: failed
          list-tests: failed
          fail-on-error: false   # the test step already failed the job; this step only reports
          fail-on-empty: false

      - name: Upload failure artifacts (logs, TRX, diagnostics, traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.shard }}
          path: |
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.log
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.trx
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.diag.log
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/flaky-*.txt
            tests/Alis.Reactive.PlaywrightTests/bin/TestResults/playwright-traces/*
          retention-days: 14
          if-no-files-found: warn
