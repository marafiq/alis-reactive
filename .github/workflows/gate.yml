name: gate

on:
  workflow_call:
    inputs:
      configuration:
        description: .NET build configuration for the deterministic job. Release matches the publish gate.
        type: string
        default: Release
      playwright:
        description: Run the sharded browser suite.
        type: boolean
        default: true
      retry-failed:
        description: How many times scripts/playwright.sh re-runs only the tests that failed (0 = never).
        type: number
        default: 1
    secrets:
      SYNCFUSION_LICENSE_KEY:
        description: Registers EJ2 on the runner. Without it a trial modal intercepts every interaction.
        required: false

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Deterministic gate (typecheck, lint, assets, vitest, dotnet build, dotnet tests)
        run: CONFIGURATION=${{ inputs.configuration }} scripts/test.sh --no-e2e

  playwright:
    name: playwright (${{ matrix.shard }})
    if: ${{ inputs.playwright }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - framework
          - fusion-a-f
          - fusion-grid
          - fusion-h-r
          - fusion-s-z
          - http-core-and-patterns
          - components
          - validation
          - conditions-and-rest
          - class-names
    env:
      Syncfusion__LicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Build app and Playwright project
        run: scripts/build.sh

      - name: Install Playwright browsers
        run: pwsh -NoProfile -Command '$ErrorActionPreference = "Stop"; & tests/Alis.Reactive.Playwright.TestHost/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium; exit $LASTEXITCODE'

      - name: Run shard ${{ matrix.shard }}
        run: scripts/playwright.sh --no-build --shard "${{ matrix.shard }}" --retry-failed "${{ inputs.retry-failed }}"

      - name: Publish the TRX results to the job summary
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Playwright results (${{ matrix.shard }})
          path: tests/*/TestResults/observable/*.trx
          reporter: dotnet-trx
          use-actions-summary: true
          list-suites: failed
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false

      - name: Upload failure artifacts (logs, TRX, diagnostics, traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.shard }}
          overwrite: true
          path: |
            tests/*/TestResults/observable/*.log
            tests/*/TestResults/observable/*.trx
            tests/*/TestResults/observable/*.diag.log
            tests/*/TestResults/observable/flaky-*.txt
            tests/*/bin/TestResults/playwright-traces/*
          retention-days: 14
          if-no-files-found: warn
