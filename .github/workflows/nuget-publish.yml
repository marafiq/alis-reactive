name: Publish NuGet packages

# release/* → preview packages (1.0.0-preview.N)
# main      → stable packages  (1.0.0)
on:
  push:
    branches: [main, 'release/*']
    paths:
      - 'Alis.Reactive/**'
      - 'Alis.Reactive.Assets/**'
      - 'Alis.Reactive.Native/**'
      - 'Alis.Reactive.DesignSystem/**'
      - 'Alis.Reactive.Fusion/**'
      - 'Alis.Reactive.FluentValidator/**'
      - 'Alis.Reactive.NativeTagHelpers/**'
      - 'Alis.Reactive.Analyzers/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'global.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.sh'
      - 'scripts/test.sh'
      - 'scripts/playwright.sh'
      - 'scripts/pack.sh'
      - '.github/workflows/nuget-publish.yml'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run non-browser verification gate
        run: CONFIGURATION=Release scripts/test.sh --no-e2e
        # 'npm run lint' is intentionally NOT run here yet: the runtime has 10
        # pre-existing eslint errors. Add it once those are cleared.

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build app and Playwright project
        run: scripts/build.sh

      - name: Install Playwright browsers
        run: pwsh tests/Alis.Reactive.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run observable Playwright tests
        run: scripts/playwright.sh --no-build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.log
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.trx
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.diag.log
            tests/Alis.Reactive.PlaywrightTests/bin/TestResults/playwright-traces/*
          retention-days: 14

  pack-and-publish:
    needs: [test, playwright]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Determine package version
        id: version
        run: |
          VERSION_PREFIX=$(dotnet msbuild Alis.Reactive/Alis.Reactive.csproj -getProperty:VersionPrefix -v:q | tail -n 1)
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "package_version=${VERSION_PREFIX}-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "package_version=${VERSION_PREFIX}" >> "$GITHUB_OUTPUT"
            echo "is_preview=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack NuGet packages
        run: scripts/pack.sh "${{ steps.version.outputs.package_version }}"

      - name: Log package versions
        run: ls -1 ./nupkgs/

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.run_number }}
          path: ./nupkgs/*.nupkg
          retention-days: 30

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
