name: Publish NuGet packages

# Publishes to NuGet.org ONLY when an ANNOTATED version tag (v*) whose commit is on `main` (or on a
# `release/*` stabilization branch) is pushed. The tag is the single source of truth for what ships:
#   git tag -a v1.0.0-rc.1 -m "AlisReactive 1.0.0-rc.1" && git push origin v1.0.0-rc.1  ->  1.0.0-rc.1 (prerelease)
#   git tag -a v1.0.0      -m "AlisReactive 1.0.0"      && git push origin v1.0.0       ->  1.0.0 (stable / GA)
# NuGet flags any version with a '-' suffix as prerelease automatically. Merging to main does NOT
# publish anything (that is CI-only, in ci.yml) — releasing is a deliberate tag push.
#
# Gates, in order:
#   verify-tag  annotated tag, SemVer version, commit reachable from main or release/*  (seconds)
#   gate        the shared gate (gate.yml): deterministic suite + five browser shards — BLOCKING
#               (a red shard stops the release; re-run the failed jobs, publishing is idempotent)
#   pack-and-publish  six packages at the tagged version -> nuget.org -> GitHub Release
#                     (runs in the `nuget-release` environment; add a required reviewer there for
#                      a manual approval click before anything is pushed)
# Runbook: docs/RELEASING.md. Branch model and cutover: docs/BRANCHING.md.
on:
  push:
    tags: ['v*']
  # A manual run on a branch exercises the gates but never publishes: verify-tag is skipped for a
  # non-tag ref, and pack-and-publish needs it.
  workflow_dispatch:

# Least privilege by default; pack-and-publish widens to contents: write for the GitHub Release.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify-tag:
    name: Verify the release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the ancestry check needs the history between the tag and main

      - name: Re-fetch the tag object
        # actions/checkout fetches a tag as "+<commit-sha>:refs/tags/<tag>", which peels an annotated
        # tag down to the commit it points at (actions/checkout#290). Fetch the real ref so the type
        # check below sees the tag object.
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Verify the tag (annotated, SemVer, reachable from main or release/*)
        id: tag
        # The check is a script so it can be proven to bite locally, against good and bad tags,
        # without pushing anything (docs/RELEASING.md, "Prove the guard"). It reads local refs
        # only, hence the fetch of the branches it compares against. It writes the outputs
        # version, prerelease, commit and reachable_from, and the one-line release summary.
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
          scripts/verify-release-tag.sh "${GITHUB_REF_NAME}"

  gate:
    name: gate
    needs: [verify-tag]
    # Run after a verified tag, or on a manual branch run (verify-tag is skipped there). Never after
    # a rejected tag: a lightweight or off-main tag fails in seconds instead of after the suites.
    if: ${{ !cancelled() && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped') }}
    # The same gate pull requests and the nightly run use: one deterministic job plus five browser
    # shards, each re-running its failed tests once. BLOCKING at release time — the evidence and the
    # reasoning are in docs/CI.md ("Gating"). A red shard stops the release: read its summary and
    # artifacts, then fix or re-run the failed jobs (gh run rerun <id> --failed). Publishing is
    # idempotent, so a re-run never double-ships.
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
      checks: write
    with:
      configuration: Release
      playwright: true
      retry-failed: 1
    secrets:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}

  pack-and-publish:
    # Every gate must be green: the verified tag, the deterministic suite, and all browser shards.
    needs: [verify-tag, gate]
    # Only an actual version tag publishes. (needs already implies it: verify-tag is skipped on a
    # branch, so this job is skipped too. Stated explicitly so the intent survives edits above.)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: nuget-release
    # Serialize releases: never run two publishes at once, and never cancel an in-flight one.
    concurrency:
      group: nuget-release
      cancel-in-progress: false
    permissions:
      contents: write   # to create the GitHub Release; nuget.org publish uses the API key, not GH Packages
    env:
      PACKAGE_VERSION: ${{ needs.verify-tag.outputs.package_version }}
      PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json   # pin the exact SDK for a reproducible release build

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Fail early if the publish secret is missing
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set — cannot publish. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Pack NuGet packages
        # pack.sh runs npm ci + npm run build:all itself, then packs all six at -p:Version.
        run: scripts/pack.sh "${PACKAGE_VERSION}"

      - name: Verify the six packages were produced at the tagged version
        run: |
          EXPECTED=(AlisReactive AlisReactive.Native AlisReactive.Fusion AlisReactive.FluentValidator AlisReactive.DesignSystem AlisReactive.NativeTagHelpers)
          fail=0
          for id in "${EXPECTED[@]}"; do
            if [ ! -f "./nupkgs/${id}.${PACKAGE_VERSION}.nupkg" ]; then
              echo "::error::Missing expected package ./nupkgs/${id}.${PACKAGE_VERSION}.nupkg"; fail=1
            fi
          done
          count=$(ls -1 ./nupkgs/*.nupkg 2>/dev/null | wc -l)
          if [ "$count" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::Expected ${#EXPECTED[@]} .nupkg files, found ${count}. (If a package was added/removed, update this check.)"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then echo "Pack output:"; ls -1 ./nupkgs/ || true; exit 1; fi
          echo "All ${#EXPECTED[@]} packages present at ${PACKAGE_VERSION}."

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ env.PACKAGE_VERSION }}
          overwrite: true   # a re-run of this job replaces the artifact instead of failing on the name
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          retention-days: 30

      - name: Publish to NuGet.org
        run: |
          # --skip-duplicate makes re-runs idempotent: an already-published version is skipped, not an error.
          # Pushing *.nupkg auto-pushes the adjacent *.snupkg symbol packages.
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Create or update the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${PRERELEASE}" == "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — refreshing its package assets."
            gh release upload "${GITHUB_REF_NAME}" ./nupkgs/*.nupkg --clobber
          else
            # --generate-notes groups merged pull requests by label per .github/release.yml.
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              $PRERELEASE_FLAG \
              ./nupkgs/*.nupkg
          fi
          echo "Published ${PACKAGE_VERSION} (prerelease=${PRERELEASE}) from ${GITHUB_REF_NAME}: https://www.nuget.org/packages/AlisReactive/${PACKAGE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
