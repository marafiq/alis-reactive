name: Publish NuGet packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify-tag:
    name: verify the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag as its object, and the branches a release is cut from
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
      - name: The tag is annotated, a version, and on main or a release branch
        id: tag
        run: scripts/verify-release-tag.sh "${GITHUB_REF_NAME}"

  ci:
    name: ci
    needs: [verify-tag]
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.verify-tag.outputs.package_version }}
    secrets:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}

  publish:
    name: publish
    needs: [verify-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget-release
    concurrency:
      group: nuget-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGE_VERSION: ${{ needs.verify-tag.outputs.package_version }}
      PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The .NET SDK of global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: The packages ci packed and proved
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: nupkgs
      - name: A key of nuget.org for this run, by trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: madnan.rafiq
      - name: Push the packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: The GitHub release of the tag, with the packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" nupkgs/*.nupkg --clobber
          elif [ "${PRERELEASE}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes --prerelease nupkgs/*.nupkg
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes nupkgs/*.nupkg
          fi
