name: Publish NuGet packages

# Publishes to NuGet.org ONLY when a version tag (v*) is pushed. The published version is
# derived from the tag, so the tag is the single source of truth for what ships:
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1   ->  publishes 1.0.0-rc.1 (prerelease)
#   git tag v1.0.0      && git push origin v1.0.0         ->  publishes 1.0.0 (stable / GA)
# NuGet flags any version with a '-' suffix as prerelease automatically. Merging to main does
# NOT publish anything (that is CI-only, in ci.yml) — releasing is a deliberate tag push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run non-browser verification gate
        run: CONFIGURATION=Release scripts/test.sh --no-e2e

  playwright:
    runs-on: ubuntu-latest
    env:
      Syncfusion__LicenseKey: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
    # Non-blocking release signal while the license-secret fix proves itself on CI: the
    # historical red runs were the unlicensed EJ2 trial modal intercepting interactions.
    # Re-arm as a blocking gate (needs: [test, playwright]) after consecutive green runs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build app and Playwright project
        run: scripts/build.sh

      - name: Install Playwright browsers
        run: pwsh tests/Alis.Reactive.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run observable Playwright tests
        run: scripts/playwright.sh --no-build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.log
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.trx
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.diag.log
          retention-days: 14

  pack-and-publish:
    # Gate the publish on the DETERMINISTIC suite only. playwright runs (non-blocking) for signal.
    needs: [test]
    # Publish only for an actual version tag — a manual workflow_dispatch on a branch
    # runs the gates above but will not push packages.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget-release
    # Serialize releases: never run two publishes at once, and never cancel an in-flight one.
    concurrency:
      group: nuget-release
      cancel-in-progress: false
    permissions:
      contents: write   # to create the GitHub Release; nuget.org publish uses the API key, not GH Packages
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # pin the exact SDK for a reproducible release build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Fail early if the publish secret is missing
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set — cannot publish. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Derive and validate the version from the tag (SemVer)
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # SemVer 2.0: MAJOR.MINOR.PATCH with an optional -prerelease label (alpha/beta/rc/...).
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a SemVer version. Use vMAJOR.MINOR.PATCH[-prerelease] — e.g. v1.0.0-alpha.1, v1.0.0-rc.1, or v1.0.0."
            exit 1
          fi
          # NuGet flags any version with a '-' suffix as a prerelease automatically.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} (prerelease=${PRERELEASE}) from tag ${GITHUB_REF_NAME}"

      - name: Pack NuGet packages
        # pack.sh runs npm ci + npm run build:all itself, then packs all six at -p:Version.
        run: scripts/pack.sh "${{ steps.version.outputs.package_version }}"

      - name: Verify the six packages were produced at the tagged version
        run: |
          VERSION="${{ steps.version.outputs.package_version }}"
          EXPECTED=(AlisReactive AlisReactive.Native AlisReactive.Fusion AlisReactive.FluentValidator AlisReactive.DesignSystem AlisReactive.NativeTagHelpers)
          fail=0
          for id in "${EXPECTED[@]}"; do
            if [ ! -f "./nupkgs/${id}.${VERSION}.nupkg" ]; then
              echo "::error::Missing expected package ./nupkgs/${id}.${VERSION}.nupkg"; fail=1
            fi
          done
          count=$(ls -1 ./nupkgs/*.nupkg 2>/dev/null | wc -l)
          if [ "$count" -ne "${#EXPECTED[@]}" ]; then
            echo "::error::Expected ${#EXPECTED[@]} .nupkg files, found ${count}. (If a package was added/removed, update this check.)"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then echo "Pack output:"; ls -1 ./nupkgs/ || true; exit 1; fi
          echo "All ${#EXPECTED[@]} packages present at ${VERSION}."

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.package_version }}
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          retention-days: 30

      - name: Publish to NuGet.org
        run: |
          # --skip-duplicate makes re-runs idempotent: an already-published version is skipped, not an error.
          # Pushing *.nupkg auto-pushes the adjacent *.snupkg symbol packages.
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Create or update the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — refreshing its package assets."
            gh release upload "${GITHUB_REF_NAME}" ./nupkgs/*.nupkg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              $PRERELEASE_FLAG \
              ./nupkgs/*.nupkg
          fi
