name: Publish NuGet packages

# Publishes to NuGet.org ONLY when a version tag (v*) is pushed. The published version is
# derived from the tag, so the tag is the single source of truth for what ships:
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1   ->  publishes 1.0.0-rc.1 (prerelease)
#   git tag v1.0.0      && git push origin v1.0.0         ->  publishes 1.0.0 (stable / GA)
# NuGet flags any version with a '-' suffix as prerelease automatically. Merging to main does
# NOT publish anything (that is CI-only, in ci.yml) — releasing is a deliberate tag push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run non-browser verification gate
        run: CONFIGURATION=Release scripts/test.sh --no-e2e

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build app and Playwright project
        run: scripts/build.sh

      - name: Install Playwright browsers
        run: pwsh tests/Alis.Reactive.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run observable Playwright tests
        run: scripts/playwright.sh --no-build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.log
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.trx
            tests/Alis.Reactive.PlaywrightTests/TestResults/observable/*.diag.log
          retention-days: 14

  pack-and-publish:
    needs: [test, playwright]
    # Publish only for an actual version tag — a manual workflow_dispatch on a branch
    # runs the gates above but will not push packages.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: write   # to create the GitHub Release; nuget.org publish uses the API key, not GH Packages
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Derive and validate the version from the tag (SemVer)
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # SemVer 2.0: MAJOR.MINOR.PATCH with an optional -prerelease label (alpha/beta/rc/...).
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a SemVer version. Use vMAJOR.MINOR.PATCH[-prerelease] — e.g. v1.0.0-alpha.1, v1.0.0-rc.1, or v1.0.0."
            exit 1
          fi
          # NuGet flags any version with a '-' suffix as a prerelease automatically.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} (prerelease=${PRERELEASE}) from tag ${GITHUB_REF_NAME}"

      - name: Pack NuGet packages
        run: scripts/pack.sh "${{ steps.version.outputs.package_version }}"

      - name: Log package versions
        run: ls -1 ./nupkgs/

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.package_version }}
          path: ./nupkgs/*.nupkg
          retention-days: 30

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            ./nupkgs/*.nupkg
