name: Publish NuGet packages

# release/* → preview packages (1.0.0-preview.N)
# main      → stable packages  (1.0.0)
on:
  push:
    branches: [main, 'release/*']
    paths:
      - 'Alis.Reactive/**'
      - 'Alis.Reactive.Native/**'
      - 'Alis.Reactive.Fusion/**'
      - 'Alis.Reactive.FluentValidator/**'
      - 'Alis.Reactive.NativeTagHelpers/**'
      - 'Alis.Reactive.SandboxApp/Scripts/**'
      - 'Alis.Reactive.SandboxApp/Styles/**'
      - 'Directory.Build.props'
      - '.github/workflows/nuget-publish.yml'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build JS + CSS bundles
        run: npm run build:all

      - name: Build all C# projects
        run: dotnet build --configuration Release

      - name: Run unit tests
        run: |
          dotnet test tests/Alis.Reactive.UnitTests --configuration Release --no-build
          dotnet test tests/Alis.Reactive.Native.UnitTests --configuration Release --no-build
          dotnet test tests/Alis.Reactive.Fusion.UnitTests --configuration Release --no-build
          dotnet test tests/Alis.Reactive.FluentValidator.UnitTests --configuration Release --no-build

  playwright:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build JS + CSS bundles
        run: npm run build:all

      - name: Build all C# projects
        run: dotnet build

      - name: Install Playwright browsers
        run: pwsh tests/Alis.Reactive.PlaywrightTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Playwright tests (attempt 1)
        id: pw1
        run: |
          dotnet test tests/Alis.Reactive.PlaywrightTests \
            --no-build \
            --logger "html;LogFileName=playwright-report.html" \
            --logger "trx;LogFileName=playwright-results.trx" \
            --results-directory TestResults \
            -- NUnit.NumberOfTestWorkers=1
        continue-on-error: true

      - name: Retry failed tests (attempt 2)
        id: pw2
        if: steps.pw1.outcome == 'failure'
        run: |
          FAILED=$(grep 'outcome="Failed"' TestResults/playwright-results.trx \
            | sed 's/.*testName="//' | sed 's/".*//' | sort -u \
            | grep -v "ResultSummary" | paste -sd '|' -)
          if [ -n "$FAILED" ]; then
            echo "Retrying: $FAILED"
            dotnet test tests/Alis.Reactive.PlaywrightTests \
              --no-build --filter "$FAILED" \
              --logger "html;LogFileName=retry-2-report.html" \
              --logger "trx;LogFileName=retry-2-results.trx" \
              --results-directory TestResults \
              -- NUnit.NumberOfTestWorkers=1
          fi
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            TestResults/playwright-report.html
            TestResults/playwright-results.trx
            TestResults/retry-*-report.html
            TestResults/retry-*-results.trx
          retention-days: 14

  pack-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build JS + CSS bundles
        run: npm run build:all

      - name: Copy assets into Alis.Reactive package source
        run: |
          mkdir -p Alis.Reactive/assets/js Alis.Reactive/assets/css
          cp Alis.Reactive.SandboxApp/wwwroot/js/alis-reactive.js Alis.Reactive/assets/js/
          cp Alis.Reactive.SandboxApp/wwwroot/css/design-system.css Alis.Reactive/assets/css/

      - name: Build all C# projects
        run: dotnet build --configuration Release

      - name: Determine version suffix
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "suffix=preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "is_preview=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack NuGet packages
        run: |
          PACK_ARGS="--configuration Release --no-build --output ./nupkgs"
          if [ -n "${{ steps.version.outputs.suffix }}" ]; then
            PACK_ARGS="$PACK_ARGS --version-suffix ${{ steps.version.outputs.suffix }}"
          fi

          dotnet pack Alis.Reactive/Alis.Reactive.csproj $PACK_ARGS
          dotnet pack Alis.Reactive.Native/Alis.Reactive.Native.csproj $PACK_ARGS
          dotnet pack Alis.Reactive.Fusion/Alis.Reactive.Fusion.csproj $PACK_ARGS
          dotnet pack Alis.Reactive.FluentValidator/Alis.Reactive.FluentValidator.csproj $PACK_ARGS
          dotnet pack Alis.Reactive.NativeTagHelpers/Alis.Reactive.NativeTagHelpers.csproj $PACK_ARGS

      - name: Log package versions
        run: ls -1 ./nupkgs/

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.run_number }}
          path: ./nupkgs/*.nupkg
          retention-days: 30

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
