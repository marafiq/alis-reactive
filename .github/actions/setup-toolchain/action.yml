name: Set up the toolchain
description: >-
  The SDK global.json pins and the 10.0 runtime the net10 hosts run on, the Node and the Python their version files
  pin, the NuGet package cache keyed by the lock files, and node_modules as package-lock.json locks it.

runs:
  using: composite
  steps:
    - name: The .NET SDK of global.json, and the SDK that carries the 10.0 runtime
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
        dotnet-version: 10.0.404

    - name: The Node of .node-version, with the npm cache
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: package-lock.json

    - name: The Python of .python-version
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version

    - name: The NuGet packages the lock files name
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

    - name: node_modules as the lock holds it
      shell: bash
      run: npm ci
