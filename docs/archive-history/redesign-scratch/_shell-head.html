<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alis.Reactive — Whole DSL Playground</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#11161d; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#7ee787;
    --kw:#ff7b72; --str:#a5d6ff; --num:#79c0ff; --cmt:#8b949e; --type:#ffa657;
    --chip:#21262d; --chipon:#1f6feb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(#0d1117,#0d1117f0);border-bottom:1px solid var(--border);padding:14px 22px;backdrop-filter:blur(6px)}
  .titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:650}
  h1 .a{color:var(--accent)}
  .count{color:var(--muted);font-size:13px}
  .count b{color:var(--accent2)}
  .search{margin-top:10px;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--fg);padding:9px 12px;font-size:14px;outline:none}
  .search:focus{border-color:var(--accent)}
  nav#chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .chip{background:var(--chip);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;user-select:none;white-space:nowrap}
  .chip:hover{color:var(--fg)}
  .chip.on{background:var(--chipon);border-color:var(--chipon);color:#fff}
  main{padding:18px 22px 80px;max-width:1080px;margin:0 auto}
  .grouphd{position:sticky;top:118px;background:#0d1117e8;backdrop-filter:blur(4px);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border);padding:14px 2px 6px;margin:18px 0 10px}
  .subhd{color:var(--muted);font-size:12.5px;font-weight:600;margin:16px 0 4px;letter-spacing:.02em}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin:10px 0;position:relative}
  .card h3{margin:0 0 3px;font-size:14.5px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--accent2);font-weight:600}
  .card .area{position:absolute;top:12px;right:14px;font-size:10.5px;color:var(--muted);text-transform:lowercase;letter-spacing:.04em}
  .card p{margin:0 0 9px;color:var(--muted);font-size:13px;max-width:78ch}
  pre{margin:0;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;overflow-x:auto}
  code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.7px;line-height:1.55;white-space:pre;color:#c9d1d9;tab-size:4}
  pre + pre{margin-top:7px}
  .copy{position:absolute;bottom:13px;right:14px;background:var(--chip);border:1px solid var(--border);color:var(--muted);border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer;opacity:0;transition:opacity .12s}
  .card:hover .copy{opacity:1}
  .copy:hover{color:var(--fg);border-color:var(--accent)}
  .copy.done{color:var(--accent2);border-color:var(--accent2)}
  .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:15px}
  .tok-kw{color:var(--kw)} .tok-str{color:var(--str)} .tok-num{color:var(--num)} .tok-cmt{color:var(--cmt);font-style:italic} .tok-type{color:var(--type)}
  ::-webkit-scrollbar{height:9px;width:9px}::-webkit-scrollbar-thumb{background:#30363d;border-radius:9px}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1><span class="a">Alis.Reactive</span> — Whole DSL Playground</h1>
    <span class="count" id="count"></span>
  </div>
  <input class="search" id="search" placeholder="Search the whole DSL — feature, keyword, or code…" autocomplete="off" spellcheck="false">
  <nav id="chips"></nav>
</header>
<main id="cards"></main>
