new overloads — it plugs into `SetText`, `When`, and dispatch fields directly.
(Gather intake is typed to component/plugin sources, not the base source, so a
fold feeds `SetText`/`When`, not `Include`.)

### Fold feeding SetText

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("avg-rate")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Average(r => r.MonthlyRate)));
```

### Fold feeding a When condition

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p
            .From(p.Component<FusionGrid>("assessments").GetCurrentViewRecords().AsArraySource())
            .Count(a => !a.IsComplete))
        .Gt(0)
        .Then(s => s
            .Element("incomplete-warning")
            .Show()));
```

### Fold feeding a dispatch field

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .DispatchFrom<CensusEvent>("census-counted", o => o
            .Set(e => e.TotalResidents, p
                .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
                .Count())));
```

---

## WholeResponseBody — read the entire success body, not a member

`WholeResponseBody` (`kind:"whole-response-body"`, was the `responseBody` sentinel)
is the value-node for the **whole** success body — it carries no member. The HTTP
`Into(elementId)` reaction emits this kind, putting the full response body into an
element.

### Into — inject the whole response body into an element

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Get("/api/census/snapshot")
        .Response(r => r
            .OnSuccess(s => s
                .Into("census-panel"))));
```

### Whole body as a When operand

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Get("/api/flags/active")
        .Response(r => r
            .OnSuccess<string>((json, s) => s
                .When(json.Read(x => x))
                .NotEmpty()
                .Then(b => b
                    .Element("flag-row")
                    .Show()))));
```

---

## WholeElement — read the array element itself (identity, x => x)

`WholeElement` (`kind:"whole-element"`, was the `elementValue` sentinel) is the
value-node for the **current array element itself** — the identity projection
`x => x` over a primitive-element array. A distinct kind from `WholeResponseBody`
(different source); both carry no member.

### Sum a primitive-element array (identity projection)

For an `int[]`/`decimal[]`, the per-element selector is the element itself.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("score-total")
        .SetText(p
            .From(p.Plugin<int[]>("assessments", "scores").Value())
            .Sum(x => x)));
```

### Filter a string array on the element itself

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("memory-tag-count")
        .SetText(p
            .From(p.Component<FusionMultiSelect>(m => m.Tags).Value())
            .Where(x => x == "memory")
            .Count()));
```

### OrderBy a primitive-element array by identity

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionDropDownList>(m => m.Codes)
        .SetDataSource(p
            .From(p.Plugin<string[]>("codes", "all").Value())
            .OrderBy(x => x)
            .AsArraySource()));
```

---

## Notes on the closed op set and determinism

- **Closed transform set.** The array ops are a fixed switch
  (`count·filter·map·sum·min·max·average·any·all·find·orderBy·orderByDescending`),
  named explicitly as `ArrayOp` — not an open `IEnumerable` surface. LINQ
  extension methods cannot bind to `ReactiveArray<T>`.
- **Sync per-element lane.** Every per-element predicate is the **sync** condition
  subset (`compare`/`all`/`any`/`not`) — never `Confirm` — so element evaluation
  stays on the immediate lane.
- **Scalar sort keys only.** `OrderBy`/`OrderByDescending` keys must project to a
  comparable scalar; a non-scalar key throws at plan render time rather than
  mis-sorting in the browser.
- **Empty / null contract.** `FindFirst`, `Min`, `Max`, and `Average` return
  `null` on empty input; `Sum` returns 0; `Count` returns 0; `Any()` returns
  false; `All()` returns true (vacuous).
- **Boundary normalization.** The engine normalizes array-like and iterable
  browser values to a JS array at the input boundary (the same category as
  `getElementById` returning null) — not a plan validator or fallback. A
  non-iterable object (e.g. `DOMStringMap`) fails fast, keeping it in the plugin
  escape hatch's domain.
- **Deterministic ordering.** Sort keys compare numerically when both are finite
  numbers, else lexicographically; non-finite keys (NaN/Infinity from a missing
  field) sort last, deterministically — `NaN` is never fed to `Array.sort`.

</script>
<script type="text/markdown" data-area="http">
# http

The HTTP pipeline grammar for Alis.Reactive, catalogued exhaustively against the
source under `Alis.Reactive/Builders/Requests/` (HttpRequestBuilder, GatherBuilder,
GatherExtensions, ResponseBuilder, ParallelBuilder) plus `PipelineBuilder.Http.cs`,
`PipelineBuilder.Into`, and `ResponseBody<T>`.

Every request is a tall fluent chain inside a reaction pipeline: a verb
(`p.Get/Post/Put/Delete(url)`) opens the request, `.Gather(...)` collects values from
components, events, the URL, plugins, and constants into payload / headers / route
params, `.AsJson()`/`.AsFormData()` picks the body format, `.Response(...)` routes
success/error into scopes, `.Chained(...)` sequences a follow-up, `.WhileLoading(...)`
and `.OnSettled(...)` bracket the in-flight window, and `.Validate<TSource>(formId)`
gates the call on client validation. `p.Parallel(...)` fans out concurrently and
`.OnAllSettled(...)` joins. `.Into(elementId)` (a pipeline command used inside a
success route) injects the whole response body into a DOM element.

Names are the finalized green-field names from `09-dsl-naming-sheet.md` §3.4:
two renames apply — gather `Static → Literal`, and HTTP `Finally → OnSettled`.
Everything else keeps its current name. Senior-living domain throughout (residents,
care levels, facilities, billing, assessments).

> Form note: triggers use the finalized single-lambda attach `Html.On(plan, t => t.Trigger(...))`
> with finalized trigger names (`PageLoad`, `Event`). The HTTP chain is the body of
> the reaction lambda `p => ...`.

---

## Verbs

### Get
HTTP GET; gathered values are emitted as query-string parameters; the URL may carry `{placeholder}` route templates.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Get("/api/facilities/mystery-manor/residents")
        .Response(r => r
            .OnSuccess<ResidentRosterResponse>((json, s) => s
                .Component<FusionGrid>("resident-grid")
                    .SetDataSource(json, j => j.Residents))));
```

### Post
HTTP POST; gathered values become the request body.

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Resident admitted"))));
```

### Post (inline gather overload)
`Post(url, gather)` opens the request and configures the gather in one call.

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents", g => g
            .IncludeAll()
            .Literal("source", "intake-form"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Resident admitted"))));
```

### Put
HTTP PUT to replace a resource.

```csharp
Html.On(plan, t => t.Event("update-resident", e => e.Click()))
    .Then(p => p
        .Put("/api/residents/{id}")
        .Gather(g => g
            .RouteParam("id", m => m.ResidentId)
            .Include<FusionTextBox, ResidentModel>(m => m.FullName))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Resident updated"))));
```

### Put (inline gather overload)
`Put(url, gather)` opens the PUT and configures the gather in one call.

```csharp
Html.On(plan, t => t.Event("update-rate", e => e.Click()))
    .Then(p => p
        .Put("/api/billing/rate", g => g
            .Literal("careLevel", "memory-care")
            .Literal("monthlyRate", 7850))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Rate updated"))));
```

### Delete
HTTP DELETE to remove a resource; route templates fill from the gather.

```csharp
Html.On(plan, t => t.Event("discharge-resident", e => e.Click()))
    .Confirm("Discharge this resident?")
    .Then(p => p
        .Delete("/api/residents/{id}")
        .Gather(g => g
            .RouteParam("id", m => m.ResidentId))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Resident discharged"))));
```

---

## Gather

`.Gather(g => ...)` collects values into three target families: **payload** (`Include`,
`IncludeAll`, `Literal`, `FromEvent`, `FromUrl`, `Plugin`), **headers** (`Header`), and
**route params** (`RouteParam`). All read through the one `ValueExpression` value spine.

### Include — by model expression
Typed component value, identified by the model property; the property name becomes the HTTP parameter name. `TComponent` names the vendor/value member.

```csharp
Html.On(plan, t => t.Event("reload-roster", e => e.Click()))
    .Then(p => p
        .Get("/api/schedule/assignments")
        .Gather(g => g
            .Include<FusionDropDownList, ScheduleModel>(m => m.SelectedFacilityId))
        .Response(r => r
            .OnSuccess<ScheduleDataResponse>((json, s) => s
                .Component<FusionSchedule>("shift-schedule")
                    .SetDataSource(json, j => j.Assignments))));
```

### Include — by typed component member source
Reads a typed component member (property or method return) as the payload value; the member name becomes the parameter name.

```csharp
Html.On(plan, t => t.Event("reload-roster", e => e.Click()))
    .Then(p => p
        .Get("/api/schedule/assignments")
        .Gather(g => g
            .Include(p.Component<FusionSchedule>("shift-schedule").CurrentView()))
        .Response(r => r
            .OnSuccess<ScheduleDataResponse>((json, s) => s
                .Component<FusionSchedule>("shift-schedule")
                    .SetDataSource(json, j => j.Assignments))));
```

### Include — typed component source with explicit param name
Same as above, but renames the HTTP parameter when it differs from the member name.

```csharp
Html.On(plan, t => t.Event("reload-roster", e => e.Click()))
    .Then(p => p
        .Get("/api/schedule/assignments")
        .Gather(g => g
            .Include(p.Component<FusionSchedule>("shift-schedule").SelectedDate(), "currentDate")
            .Include(p.Component<FusionSchedule>("shift-schedule").GetEvents(), "events"))
        .Response(r => r
            .OnSuccess<ScheduleDataResponse>((json, s) => s
                .Element("count").SetText(json, j => j.Count))));
```

### Include — by explicit element id and property name
Reads a component's value by element id and named member; works for input and display components.

```csharp
Html.On(plan, t => t.Event("audit", e => e.Click()))
    .Then(p => p
        .Post("/api/schedule/events/audit")
        .Gather(g => g
            .Include<FusionGrid, ScheduleModel>("resident-grid", "selectedRowIndex"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Audited"))));
```

### IncludeAll
Includes every registered input component value in the payload.

```csharp
Html.On(plan, t => t.Event("submit-assessment", e => e.Click()))
    .Then(p => p
        .Post("/api/assessments")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Assessment submitted"))));
```

### Literal
Includes a constant key/value pair in the payload (renamed from `Static`).

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll()
            .Literal("source", "intake-form")
            .Literal("intakeStep", 4))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))));
```

### FromEvent
Includes a value pulled from the triggering event payload, with an explicit parameter name.

```csharp
Html.On(plan, t => t.Event<ScheduleActionPayload>("schedule:edit"))
    .Then((payload, p) => p
        .Get("/Sandbox/Components/Schedule/EditForm")
        .Gather(g => g
            .FromEvent(payload, x => x.Id, "assignmentId"))
        .Response(r => r
            .OnSuccess(s => s
                .Into("alis-drawer-content"))));
```

### FromUrl
Includes a URL query parameter; the parameter name is both the URL key read and the payload key.

```csharp
Html.On(plan, t => t.Event("apply-filter", e => e.Click()))
    .Then(p => p
        .Get("/api/residents")
        .Gather(g => g
            .FromUrl("tab")
            .FromUrl("facilityId"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Filtered"))));
```

### FromUrl — explicit payload name
Reads the URL param but emits it under a different HTTP parameter name.

```csharp
Html.On(plan, t => t.Event("apply-filter", e => e.Click()))
    .Then(p => p
        .Get("/api/residents")
        .Gather(g => g
            .FromUrl("facilityId", "facility"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Filtered"))));
```

### FromUrl<T> — typed
Reads the URL param with shape conversion (e.g. `int`); the param name is the payload key.

```csharp
Html.On(plan, t => t.Event("apply-filter", e => e.Click()))
    .Then(p => p
        .Get("/api/residents")
        .Gather(g => g
            .FromUrl<int>("page"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Page loaded"))));
```

### FromUrl<T> — typed with explicit payload name
Typed URL param with shape conversion and a renamed payload key.

```csharp
Html.On(plan, t => t.Event("apply-filter", e => e.Click()))
    .Then(p => p
        .Get("/api/residents")
        .Gather(g => g
            .FromUrl<int>("page", "pageNumber"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Page loaded"))));
```

### Plugin
Includes a typed plugin function result (which may carry args) as a payload value.

```csharp
Html.On(plan, t => t.Event("export", e => e.Click()))
    .Then(p => p
        .Post("/api/residents/export")
        .Gather(g => g
            .Plugin(p.Plugin<string>("csv", x => x.BuildFilename()), "filename"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Exported"))));
```

### Header — literal string
Adds a constant request header. Literal headers require a concrete value (null throws — use a typed/event overload for dynamic values).

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll()
            .Header("X-Api-Version", "2024-01-15")
            .Header("X-Tenant-Id", "facility-42"))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))));
```

### Header — typed source
Adds a header from a typed source (component / URL / plugin). Headers are scalar; arrays and objects are rejected at build time.

```csharp
Html.On(plan, t => t.Event("apply-filter", e => e.Click()))
    .Then(p => p
        .Get("/api/residents")
        .Gather(g => g
            .Header("X-Tab", p.FromUrl("tab"))
            .Header("X-Facility", p.Component<FusionDropDownList>("facility-picker").Value()))
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Filtered"))));
```

### Header — from event arg
Adds a header read from the triggering event payload.

```csharp
Html.On(plan, t => t.Event<ScheduleActionPayload>("schedule:edit"))
    .Then((payload, p) => p
        .Get("/api/schedule/assignment")
        .Gather(g => g
            .Header("X-Assignment-Id", payload, x => x.Id))
        .Response(r => r
            .OnSuccess(s => s
                .Into("alis-drawer-content"))));
```

### RouteParam — from model expression
Fills a `{placeholder}` in the URL template from a model-bound component value.

```csharp
Html.On(plan, t => t.Event("update-resident", e => e.Click()))
    .Then(p => p
        .Put("/api/residents/{id}")
        .Gather(g => g
            .RouteParam("id", m => m.ResidentId)
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Updated"))));
```

### RouteParam — static int
Fills a route placeholder with a constant int.

```csharp
Html.On(plan, t => t.Event("load-resident", e => e.Click()))
    .Then(p => p
        .Get("/api/residents/{id}")
        .Gather(g => g
            .RouteParam("id", 42))
        .Response(r => r
            .OnSuccess<ResidentResponse>((json, s) => s
                .Element("name").SetText(json, x => x.FullName))));
```

### RouteParam — static long
Fills a route placeholder with a constant long.

```csharp
Html.On(plan, t => t.Event("load-billing", e => e.Click()))
    .Then(p => p
        .Get("/api/billing/{accountId}")
        .Gather(g => g
            .RouteParam("accountId", 90000000001L))
        .Response(r => r
            .OnSuccess<BillingResponse>((json, s) => s
                .Element("balance").SetText(json, x => x.Balance))));
```

### RouteParam — static string
Fills a route placeholder with a constant string (null throws — use a typed/event overload for dynamic values).

```csharp
Html.On(plan, t => t.Event("load-facility", e => e.Click()))
    .Then(p => p
        .Get("/api/facilities/{slug}")
        .Gather(g => g
            .RouteParam("slug", "mystery-manor"))
        .Response(r => r
            .OnSuccess<FacilityResponse>((json, s) => s
                .Element("facility-name").SetText(json, x => x.Name))));
```

### RouteParam — from typed source
Fills a route placeholder from a typed source (component / URL / plugin). Route params are scalar.

```csharp
Html.On(plan, t => t.Event("audit-view", e => e.Click()))
    .Then(p => p
        .Get("/api/schedule/view/{currentView}/echo")
        .Gather(g => g
            .RouteParam("currentView", p.Component<FusionSchedule>("shift-schedule").CurrentView()))
        .Response(r => r
            .OnSuccess<ScheduleViewRouteResponse>((json, s) => s
                .Element("route-view").SetText(json, x => x.CurrentView))));
```

### RouteParam — from typed URL source
Fills a route placeholder from a typed URL query parameter.

```csharp
Html.On(plan, t => t.Event("load-resident", e => e.Click()))
    .Then(p => p
        .Get("/api/residents/{id}")
        .Gather(g => g
            .RouteParam("id", p.FromUrl<int>("residentId")))
        .Response(r => r
            .OnSuccess<ResidentResponse>((json, s) => s
                .Element("name").SetText(json, x => x.FullName))));
```

### RouteParam — from event arg
Fills a route placeholder read from the triggering event payload.

```csharp
Html.On(plan, t => t.Event<ScheduleActionPayload>("schedule:edit"))
    .Then((payload, p) => p
        .Get("/api/schedule/{assignmentId}")
        .Gather(g => g
            .RouteParam("assignmentId", payload, x => x.Id))
        .Response(r => r
            .OnSuccess(s => s
                .Into("alis-drawer-content"))));
```

## Body format

### AsJson
Sends the request body as JSON (the default for POST/PUT — explicit when you want it stated).

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .AsJson()
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))));
```

### AsFormData
Sends the request body as form-data.

```csharp
Html.On(plan, t => t.Event("submit-intake", e => e.Click()))
    .Then(p => p
        .Post("/api/residents/intake")
        .Gather(g => g
            .Literal("FirstName", "John")
            .Literal("LastName", "Doe")
            .Literal("Email", "john@example.com"))
        .AsFormData()
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Intake submitted"))));
```

---

## Response routing

`.Response(r => ...)` opens success/error scopes. Inside a typed scope the first lambda
parameter (`json` / `err`) is a `ResponseBody<T>` for typed body reads.

### OnSuccess
Runs a reaction pipeline on a 2xx response (no typed body).

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Resident admitted")
                .Dispatch("roster:refresh"))));
```

### OnSuccess<TResponse> — typed body
Runs a reaction pipeline with a typed `ResponseBody<TResponse>` for reading body properties.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Get("/api/schedule/assignments")
        .Response(r => r
            .OnSuccess<ScheduleDataResponse>((json, s) => s
                .Component<FusionSchedule>("shift-schedule")
                    .SetDataSource(json, j => j.Assignments)
                .Element("unassigned-count").SetText(json, j => j.UnassignedCount))));
```

### OnError
Runs a reaction pipeline on any non-2xx response (no typed body).

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))
            .OnError(e => e
                .Element("status").SetText("Save failed"))));
```

### OnError(statusCode)
Routes a specific HTTP status code to its own reaction pipeline (first-match status routing).

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .Validate<ResidentValidator>("resident-form")
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))
            .OnError(400, e => e
                .ShowValidationErrors("resident-form"))
            .OnError(422, e => e
                .Element("status").SetText("Validation failed"))
            .OnError(500, e => e
                .Element("status").SetText("Server error"))));
```

### OnError<TError> — typed error body
Runs a reaction pipeline with a typed `ResponseBody<TError>` for reading error-body properties.

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))
            .OnError<ErrorDetailResponse>((err, e) => e
                .Element("status").SetText(err, x => x.Message))));
```

### OnError<TError>(statusCode) — typed error body for a status
Routes a specific status code to a reaction pipeline with a typed error body.

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))
            .OnError<ErrorDetailResponse>(409, (err, e) => e
                .Element("status").SetText(err, x => x.Conflict))));
```

### ResponseBody.Read
`json.Read(x => x.Prop)` yields a `TypedSource<TProp>` from the response body — usable in conditions, source-vs-source comparisons, route params of a chained request, and array sources.

```csharp
Html.On(plan, t => t.Event("approve", e => e.Click()))
    .Then(p => p
        .Post("/api/residents/screen")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess<ScreeningResponse>((json, s) => s
                .When(json.Read(x => x.Status)).Eq("approved")
                    .Then(t => t
                        .Element("status").SetText("Approved")))));
```

---

## Into

### Into
A pipeline command (used inside a success route) that injects the whole response body into a DOM element as HTML. Its whole-read lowers to the `WholeResponseBody` kind.

```csharp
Html.On(plan, t => t.Event<ScheduleActionPayload>("schedule:edit"))
    .Then((payload, p) => p
        .Get("/Sandbox/Components/Schedule/EditForm")
        .Gather(g => g
            .FromEvent(payload, x => x.Id, "assignmentId"))
        .Response(r => r
            .OnSuccess(s => s
                .Into("alis-drawer-content"))));
```

---

## Chained

### Chained
After the current response, runs a follow-up request. The chained request may gather from the previous success body via `json.Read(...)`.

```csharp
Html.On(plan, t => t.Event("audit-view", e => e.Click()))
    .Then(p => p
        .Get("/api/schedule/view/{currentView}/echo")
        .Gather(g => g
            .RouteParam("currentView", p.Component<FusionSchedule>("shift-schedule").CurrentView()))
        .Response(r => r
            .OnSuccess<ScheduleViewRouteResponse>((json, s) => s
                .Element("route-view").SetText(json, x => x.CurrentView))
            .Chained(c => c
                .Get("/api/schedule/view/{currentView}/summary")
                .Gather(g => g
                    .RouteParam("currentView", p.Component<FusionSchedule>("shift-schedule").CurrentView()))
                .Response(r2 => r2
                    .OnSuccess<ScheduleViewRouteResponse>((json2, s2) => s2
                        .Element("route-view-summary").SetText(json2, x => x.Summary))))));
```

### Chained — gather route param from the previous response body
The chained request reads `json.Read(...)` of the parent success body into its own route param.

```csharp
Html.On(plan, t => t.Event("create-then-load", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess<CreatedResidentResponse>((json, s) => s
                .Element("status").SetText("Created"))
            .Chained(c => c
                .Get("/api/facilities/{facilityId}/residents/{residentId}")
                .Gather(g => g
                    .RouteParam("facilityId", 3)
                    .RouteParam("residentId", json.Read(x => x.ResidentId)))
                .Response(r2 => r2
                    .OnSuccess<ResidentResponse>((json2, s2) => s2
                        .Element("loaded-name").SetText(json2, x => x.FullName))))));
```

---

## Parallel

### Parallel
Runs multiple HTTP requests concurrently. Each branch is its own request lambda passed as a `params` argument.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Parallel(
            b => b
                .Get("/api/residents")
                .Response(r => r
                    .OnSuccess<ResidentRosterResponse>((json, s) => s
                        .Component<FusionGrid>("resident-grid")
                            .SetDataSource(json, j => j.Residents))),
            b => b
                .Get("/api/facilities")
                .Response(r => r
                    .OnSuccess<FacilityListResponse>((json, s) => s
                        .Component<FusionDropDownList>("facility-picker")
                            .SetDataSource(json, j => j.Facilities)))));
```

### OnAllSettled
Runs a reaction pipeline after every parallel branch settles (success, error, or network failure) — borrows `Promise.allSettled` semantics.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Parallel(
            b => b
                .Get("/api/residents")
                .Response(r => r
                    .OnSuccess<ResidentRosterResponse>((json, s) => s
                        .Component<FusionGrid>("resident-grid")
                            .SetDataSource(json, j => j.Residents))),
            b => b
                .Get("/api/facilities")
                .Response(r => r
                    .OnSuccess<FacilityListResponse>((json, s) => s
                        .Component<FusionDropDownList>("facility-picker")
                            .SetDataSource(json, j => j.Facilities)))
        )
        .OnAllSettled(s => s
            .Element("dashboard-status").SetText("Dashboard ready")));
```

---

## Loading bracket

### WhileLoading
Runs a reaction pipeline before the request is sent / during the in-flight window (e.g. show a spinner).

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .WhileLoading(l => l
            .Element("save-spinner").Show())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))));
```

### OnSettled
Runs a cleanup reaction pipeline after the request settles, regardless of success, error, or network failure. No response body is available (renamed from `Finally`). Pairs with `WhileLoading` as the bracket.

```csharp
Html.On(plan, t => t.Event("save-resident", e => e.Click()))
    .Then(p => p
        .Post("/api/residents")
        .Gather(g => g
            .IncludeAll())
        .WhileLoading(l => l
            .Element("save-spinner").Show())
        .OnSettled(s => s
            .Element("save-spinner").Hide())
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Saved"))));
```

---

## Validate

### Validate<TValidationSource>(formId)
Gates the request on client-side validation passing; `TValidationSource` is the validator type, `formId` is the DOM container where errors display. Cross-area: the same `Validate` verb as the validation gate — pair with `OnError(400, e => e.ShowValidationErrors(formId))`.

```csharp
Html.On(plan, t => t.Event("submit-screening", e => e.Click()))
    .Then(p => p
        .Post("/api/residents/screen")
        .Gather(g => g
            .IncludeAll()
            .Literal("step", 4))
        .Validate<Step4Validator>("screening-form")
        .Response(r => r
            .OnSuccess(s => s
                .Element("status").SetText("Screening accepted"))
            .OnError(400, e => e
                .ShowValidationErrors("screening-form"))));
```

---

## Full assembled chain

Every section combined — the request as a developer actually writes it: validate, gather
from many sources, set headers and route params, pick body format, bracket with a loading
spinner, route success/error/status, then chain a dependent request reading the parent body.

```csharp
Html.On(plan, t => t.Event("admit-resident", e => e.Click()))
    .Confirm("Admit this resident to memory care?")
    .Then(p => p
        .Post("/api/facilities/{facilityId}/residents")
        .Gather(g => g
            .RouteParam("facilityId", m => m.SelectedFacilityId)
            .IncludeAll()
            .Include(p.Component<FusionDatePicker>("admit-date").Value(), "admittedOn")
            .FromUrl("referralSource", "referral")
            .Literal("careLevel", "memory-care")
            .Header("X-Api-Version", "2024-01-15"))
        .AsJson()
        .Validate<AdmissionValidator>("admission-form")
        .WhileLoading(l => l
            .Element("admit-spinner").Show())
        .OnSettled(s => s
            .Element("admit-spinner").Hide())
        .Response(r => r
            .OnSuccess<AdmissionResponse>((json, s) => s
                .Element("status").SetText("Resident admitted"))
            .OnError(400, e => e
                .ShowValidationErrors("admission-form"))
            .OnError<ErrorDetailResponse>(500, (err, e) => e
                .Element("status").SetText(err, x => x.Message))
            .Chained(c => c
                .Post("/api/billing/account")
                .Gather(g => g
                    .Literal("careLevel", "memory-care")
                    .Header("X-Resident-Id", "new"))
                .Response(r2 => r2
                    .OnSuccess<BillingResponse>((json2, s2) => s2
                        .Element("billing-status").SetText(json2, x => x.Balance))))));
```

<script type="text/markdown" data-area="components">
# components

How inputs and display elements are authored, bound to a model, wired to browser
events, mutated by reactions, and read as typed value sources. This is the
components area of the DSL: `Html.InputField`, the `Component<T>` pipeline
references, the `.Reactive()` event-wiring extensions, the `Fusion*` / `Native*`
component builders (textbox, dropdown, datepicker, numeric, checkbox, grid),
`TypedEvent<TArgs>`, `.SetValue` / `.Value`, `ElementBuilder`
(`Element` / `AddClass` / `RemoveClass` / `ToggleClass` / `Show` / `Hide` /
`SetText` / `SetHtml`), and component focus.

Every sample is a **tall** vertical fluent chain — one call per line, read
top-to-bottom. Domain: senior-living (residents, care levels, facilities,
billing, assessments).

Mental model:

- **`Html.InputField(plan, m => m.Prop)`** opens a model-bound field wrapper
  (label + validation slot). You finish it with **one** component factory —
  `.NativeTextBox(...)`, `.FusionDropDownList(...)`, etc. The factory registers
  the input contract, so gather and validation can find it.
- **Non-input components** (grid, accordion, chart) are created directly off the
  helper — `Html.FusionGrid<TModel, TRow>(plan, "grid-id", ...)` — no field
  wrapper, no validation slot.
- **`.Reactive(plan, e => e.SomeEvent, (args, p) => ...)`** wires a *browser
  event* on a rendered component into a reactive pipeline. `args` is typed.
- Inside a pipeline `p`, **`p.Component<TComponent>(m => m.Prop)`** returns a
  typed `ComponentRef` you mutate (`.SetValue(...)`, `.Focus()`) or read
  (`.Value()` -> a `TypedSource`).
- **`p.Element("id")`** targets any plain DOM element for text / HTML / class /
  visibility mutations.

---

## Html.InputField — open a model-bound field

`Html.InputField(plan, expr)` returns an `InputBoundField<TModel, TProp>`. It is
the only correct way to start an input: it allocates the deterministic element
id, captures the binding path, and reserves the registration slot the component
factory fills. You always chain exactly one component factory onto it.

### InputField(plan, expression)
Bind a typed model property to a field; chain the component factory to choose the control.

```csharp
Html.InputField(plan, m => m.Resident.FullName)
    .NativeTextBox(b => b
        .Placeholder("Resident full name"));
```

### InputField(plan, expression, configure) — label + required marker
The second overload configures the field wrapper: label text and the required `*` indicator.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name")
        .Required())
    .NativeTextBox(b => b
        .Placeholder("Resident full name"));
```

### InputFieldOptions.Label(text)
Sets the label rendered above the input.

```csharp
Html.InputField(plan, m => m.Resident.RoomNumber, o => o
        .Label("Room number"))
    .NativeTextBox(b => b
        .Type("number"));
```

### InputFieldOptions.Required()
Adds the required marker next to the label (display only; server validation stays authoritative).

```csharp
Html.InputField(plan, m => m.Assessment.CareLevel, o => o
        .Label("Care level")
        .Required())
    .FusionDropDownList(b => b
        .DataSource(careLevels)
        .Fields<CareLevelItem>(t => t.Name, v => v.Code));
```

---

## Native component builders — plain HTML inputs

Native builders implement the framework HTML-content type directly, so the
factory both renders and registers in one call. The pipeline finishes with
`.Reactive(...)` (no separate `.Render()`).

### NativeTextBox — `<input>` bound to a property
Renders a native text input; defaults to `type="text"`.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name")
        .Required())
    .NativeTextBox(b => b
        .Placeholder("Enter full name"));
```

### NativeTextBox.Type(type) — email / password / number / etc.
Overrides the HTML input `type` attribute.

```csharp
Html.InputField(plan, m => m.Resident.ContactEmail, o => o
        .Label("Contact email"))
    .NativeTextBox(b => b
        .Type("email")
        .Placeholder("name@example.com"));
```

### NativeTextBox.CssClass(css)
Adds CSS classes to the input element.

```csharp
Html.InputField(plan, m => m.Resident.RoomNumber, o => o
        .Label("Room number"))
    .NativeTextBox(b => b
        .Type("number")
        .CssClass("form-control room-input"));
```

### NativeTextBox.Placeholder(text)
Sets the placeholder shown when empty.

```csharp
Html.InputField(plan, m => m.Facility.Name, o => o
        .Label("Facility"))
    .NativeTextBox(b => b
        .Placeholder("Sunrise Senior Living"));
```

### NativeCheckBox — `<input type="checkbox">` bound to a bool
Factory is constrained to a `bool` property.

```csharp
Html.InputField(plan, m => m.Resident.IsVeteran, o => o
        .Label("Veteran"))
    .NativeCheckBox(b => b
        .CssClass("form-check-input"));
```

### NativeCheckBox.CssClass(css)
Adds CSS classes to the checkbox element.

```csharp
Html.InputField(plan, m => m.Consent.MediaRelease, o => o
        .Label("Media release on file"))
    .NativeCheckBox(b => b
        .CssClass("consent-toggle"));
```

---

## Fusion component builders — Syncfusion EJ2 inputs

Fusion input factories wrap a Syncfusion EJ2 MVC builder and render inside the
field wrapper. The `build` callback configures the Syncfusion control; the
factory wires the controlled id and binding name and registers the input
contract automatically.

### FusionTextBox — Syncfusion TextBox bound to a property
The `build` callback receives the raw `TextBoxBuilder`.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name")
        .Required())
    .FusionTextBox(b => b
        .Placeholder("Enter full name")
        .FloatLabelType(FloatLabelType.Auto));
```

### FusionDropDownList — Syncfusion DropDownList bound to a property
Configure data and field mappings inside `build`.

```csharp
Html.InputField(plan, m => m.Assessment.CareLevel, o => o
        .Label("Care level")
        .Required())
    .FusionDropDownList(b => b
        .DataSource(careLevels)
        .Fields<CareLevelItem>(t => t.Name, v => v.Code)
        .Placeholder("Select care level"));
```

### FusionDropDownList.Fields(text, value) — typed field mapping
Derives the camelCase text/value field names from the item type expressions.

```csharp
Html.InputField(plan, m => m.Resident.PrimaryFacilityId, o => o
        .Label("Facility"))
    .FusionDropDownList(b => b
        .DataSource(facilities)
        .Fields<FacilityItem>(t => t.Name, v => v.Id));
```

### FusionDropDownList.Fields(text, value, groupBy) — grouped popup
Adds a group-by expression so the popup groups items.

```csharp
Html.InputField(plan, m => m.Resident.PrimaryFacilityId, o => o
        .Label("Facility"))
    .FusionDropDownList(b => b
        .DataSource(facilities)
        .Fields<FacilityItem>(t => t.Name, v => v.Id, g => g.Region));
```

### FusionDatePicker — Syncfusion DatePicker bound to a DateTime
Binds a date property; value reads/writes use ISO `yyyy-MM-dd`.

```csharp
Html.InputField(plan, m => m.Resident.MoveInDate, o => o
        .Label("Move-in date")
        .Required())
    .FusionDatePicker(b => b
        .Format("MM/dd/yyyy")
        .Placeholder("Select date"));
```

### FusionNumericTextBox — Syncfusion NumericTextBox bound to a number
Binds a numeric property (decimal-shaped value).

```csharp
Html.InputField(plan, m => m.Billing.MonthlyRate, o => o
        .Label("Monthly rate")
        .Required())
    .FusionNumericTextBox(b => b
        .Format("c2")
        .Min(0)
        .Step(50));
```

---

## Non-input component builders — grid

Non-input components are created directly on the helper with an explicit element
id. There is **no** field wrapper and **no** input registration. The factory
returns a `FusionGridBuilder<TModel>` you finish with `.Reactive(...)`.

### Html.FusionGrid(plan, elementId, build) — bound to a row DTO
`TRow` is the row type; `build` configures columns, paging, sorting, editing.

```csharp
@(Html.FusionGrid<RosterModel, ResidentRow>(plan, "residents-grid", b => b
        .Columns(cols => cols
            .Add(c => c.Field("fullName").HeaderText("Resident"))
            .Add(c => c.Field("careLevel").HeaderText("Care level"))
            .Add(c => c.Field("monthlyRate").HeaderText("Rate").Format("C2")))
        .AllowPaging()
        .AllowSorting())
    .Reactive(e => e.RowSelected<ResidentRow>(), (args, p) => p
        .Set(m => m.SelectedResidentId, args.Data.Id)))
```

---

## .Reactive — wire a browser event into a pipeline

`.Reactive(plan, e => e.Event, (args, p) => ...)` is the last call in a builder
chain. The event selector picks a `TypedEvent<TArgs>` off the component's events
class; `args` is the typed event payload, `p` is the pipeline. Native inputs and
the grid omit the `plan` argument only when the builder already carries it (grid);
input builders take `plan` explicitly.

### Reactive — native input change event
`evt => evt.Changed` selects the change event; `args` is the typed change payload.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name"))
    .NativeTextBox(b => b
        .Placeholder("Enter full name")
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Element("name-echo")
            .SetText(args, x => x.Value)));
```

### Reactive — native checkbox change event
Branch on the checked state to drive other UI.

```csharp
Html.InputField(plan, m => m.Resident.IsVeteran, o => o
        .Label("Veteran"))
    .NativeCheckBox(b => b
        .Reactive(plan, e => e.Changed, (args, p) => p
            .When(args, x => x.Checked)
            .Then(p => p
                .Element("veteran-benefits")
                .Show())
            .Else(p => p
                .Element("veteran-benefits")
                .Hide())));
```

### Reactive — Fusion textbox input event (every keystroke)
`Input` fires on every keystroke; `Changed` fires on commit.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name"))
    .FusionTextBox(b => b
        .Reactive(plan, e => e.Input, (args, p) => p
            .Element("char-count")
            .SetText(args, x => x.Value)));
```

### Reactive — Fusion textbox change / focus / blur events
Four event lanes: `Input`, `Changed`, `Focus`, `Blur`.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name"))
    .FusionTextBox(b => b
        .Reactive(plan, e => e.Blur, (args, p) => p
            .Element("name-field")
            .RemoveClass("editing")));
```

### Reactive — Fusion dropdown change drives a billing recalculation
A change on care level dispatches a domain event other behaviors react to.

```csharp
Html.InputField(plan, m => m.Assessment.CareLevel, o => o
        .Label("Care level")
        .Required())
    .FusionDropDownList(b => b
        .DataSource(careLevels)
        .Fields<CareLevelItem>(t => t.Name, v => v.Code)
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Dispatch("care-level-changed")));
```

### Reactive — Fusion datepicker change event
Read the new date off `args` and echo it.

```csharp
Html.InputField(plan, m => m.Resident.MoveInDate, o => o
        .Label("Move-in date"))
    .FusionDatePicker(b => b
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Element("move-in-echo")
            .SetText(args, x => x.Value)));
```

### Reactive — Fusion numeric change event
React when the monthly rate is edited.

```csharp
Html.InputField(plan, m => m.Billing.MonthlyRate, o => o
        .Label("Monthly rate"))
    .FusionNumericTextBox(b => b
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Dispatch("rate-changed")));
```

### Reactive — grid DataStateChange (server-side data)
Fires on sort/page/filter in custom-binding mode; trigger a fetch.

```csharp
@(Html.FusionGrid<RosterModel, ResidentRow>(plan, "residents-grid", b => b
        .Columns(cols => cols
            .Add(c => c.Field("fullName").HeaderText("Resident"))))
    .Reactive(e => e.DataStateChange, (args, p) => p
        .Get("/api/residents")
        .Into("residents-grid")))
```

### Reactive — grid ToolbarClick, branch on the clicked button id
One toolbar event; branch on `args.Item.Id` to route per button.

```csharp
@(Html.FusionGrid<RosterModel, ResidentRow>(plan, "residents-grid", b => b
        .Toolbar(new[] { "Add", "ExportCsv" }))
    .Reactive(e => e.ToolbarClick, (args, p) => p
        .When(args, x => x.Item.Id)
        .Eq("ExportCsv")
        .Then(p => p
            .Get("/api/residents/export"))))
```

### Reactive — grid RecordClick with a typed row payload
`RecordClick<TRow>()` carries `args.RowData` typed to the row DTO.

```csharp
@(Html.FusionGrid<RosterModel, ResidentRow>(plan, "residents-grid", b => b
        .Columns(cols => cols
            .Add(c => c.Field("fullName").HeaderText("Resident"))))
    .Reactive(e => e.RecordClick<ResidentRow>(), (args, p) => p
        .Set(m => m.SelectedResidentId, args.RowData.Id)))
```

### Reactive — grid RowSelected
`RowSelected<TRow>()` carries the selected row's typed data.

```csharp
@(Html.FusionGrid<RosterModel, ResidentRow>(plan, "residents-grid", b => b
        .AllowSelection())
    .Reactive(e => e.RowSelected<ResidentRow>(), (args, p) => p
        .Element("selected-name")
        .SetText(args, x => x.Data.FullName)))
```

### Reactive — grid ActionBegin / ActionComplete edit lifecycle
Before/after edit, save, delete, sort, page, filter, group.

```csharp
@(Html.FusionGrid<RosterModel, ResidentRow>(plan, "residents-grid", b => b
        .EditSettings(s => s.AllowEditing()))
    .Reactive(e => e.ActionComplete<ResidentRow>(), (args, p) => p
        .Dispatch("roster-changed")))
```

---

## TypedEvent — the typed event payload

`TypedEvent<TArgs>` carries the JS event name plus a strongly-typed `args`
instance. The `.Reactive()` selector returns one; the pipeline reads payload
properties through `args` (used as a payload source by `Set`, `SetText`, `When`,
gather, and dispatch).

### args as a payload source in Set
Read a property off the event payload and assign it to the model.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name"))
    .NativeTextBox(b => b
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Set(m => m.Resident.FullNameUpper, args, x => x.Value)));
```

### args as a payload source in a condition
Guard the pipeline on a payload value.

```csharp
Html.InputField(plan, m => m.Billing.MonthlyRate, o => o
        .Label("Monthly rate"))
    .FusionNumericTextBox(b => b
        .Reactive(plan, e => e.Changed, (args, p) => p
            .When(args, x => x.Value)
            .Gt(10000m)
            .Then(p => p
                .Element("rate-warning")
                .Show())));
```

### args as a payload source in a dispatch
Carry payload fields into a domain event for other behaviors.

```csharp
@(Html.FusionGrid<RosterModel, ResidentRow>(plan, "residents-grid", b => b
        .Columns(cols => cols
            .Add(c => c.Field("fullName").HeaderText("Resident"))))
    .Reactive(e => e.RecordClick<ResidentRow>(), (args, p) => p
        .DispatchFrom<ResidentSelected>("resident-selected", d => d
            .Set(x => x.ResidentId, args.RowData.Id)
            .Set(x => x.Name, args.RowData.FullName))))
```

---

## Component<T> — typed component reference inside a pipeline

Inside a pipeline `p`, `p.Component<TComponent>(...)` returns a
`ComponentRef<TComponent, TModel>` you mutate or read. Four overloads identify
the component four ways.

### Component(m => m.Prop) — by model expression (same model)
The common case: the component is bound to a property on this view's model.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionTextBox>(m => m.Resident.FullName)
        .SetValue("New resident"));
```

### Component<TComponent, TOtherModel>(expr) — cross-model (partials)
Reference a component bound to a *different* model rendered by a partial.

```csharp
Html.On(plan, t => t.Event("facility-loaded"))
    .Then(p => p
        .Component<FusionDropDownList, FacilityModel>(m => m.SelectedFacilityId)
        .SetValue("FAC-001"));
```

### Component<TComponent>(refId) — by explicit id
Reference a component by a literal element id (non-model-bound id).

```csharp
Html.On(plan, t => t.Event("refresh"))
    .Then(p => p
        .Component<FusionGrid>("residents-grid")
        .Refresh());
```

### Component<TComponent>() — app-level singleton by default id
Reference a layout-owned app component (Toast, Confirm, Loader) by its fixed id.

```csharp
Html.On(plan, t => t.Event("saved"))
    .Then(p => p
        .Component<FusionToast>()
        .Show("Saved"));
```

---

## .SetValue / .Value — component mutation and reading

Every input `ComponentRef` exposes `.SetValue(...)` (write the control's value)
and `.Value()` (read it as a `TypedSource` for conditions, gather, or as a value
source in other mutations). The value type matches the control's semantic type.

### FusionTextBox.SetValue(string) — write + flush to the visible input
Sets the value and calls `dataBind` so the DOM updates immediately.

```csharp
Html.On(plan, t => t.Event("prefill"))
    .Then(p => p
        .Component<FusionTextBox>(m => m.Resident.FullName)
        .SetValue("Jane Doe"));
```

### FusionTextBox.Value() — read as a typed string source
Use the live value in a condition or as a gather source.

```csharp
Html.On(plan, t => t.Event("validate-name"))
    .When(p => p.Component<FusionTextBox>(m => m.Resident.FullName).Value())
    .IsEmpty()
    .Then(p => p
        .Element("name-error")
        .Show());
```

### FusionDropDownList.SetValue(string)
Selects an option by its value key.

```csharp
Html.On(plan, t => t.Event("reset-care-level"))
    .Then(p => p
        .Component<FusionDropDownList>(m => m.Assessment.CareLevel)
        .SetValue("ASSISTED"));
```

### FusionDropDownList.SetText(string)
Sets the displayed text directly.

```csharp
Html.On(plan, t => t.Event("show-placeholder"))
    .Then(p => p
        .Component<FusionDropDownList>(m => m.Assessment.CareLevel)
        .SetText("Choose a care level"));
```

### FusionDropDownList.SetDataSource — from an event payload
Rebind the popup from an event payload array.

```csharp
Html.On(plan, t => t.Event<FacilitiesLoaded>("facilities-loaded"))
    .Then(p => p
        .Component<FusionDropDownList>(m => m.Resident.PrimaryFacilityId)
        .SetDataSource(args, x => x.Facilities)
        .DataBind());
```

### FusionDropDownList.SetDataSource — from an HTTP response body
Rebind from a success response body array.

```csharp
Html.On(plan, t => t.Event("load-facilities"))
    .Get("/api/facilities")
    .OnSuccess<FacilityListResponse>((body, p) => p
        .Component<FusionDropDownList>(m => m.Resident.PrimaryFacilityId)
        .SetDataSource(body, x => x.Items)
        .DataBind());
```

### FusionDropDownList.Value() — read as a typed string source
Read the selected value key for a condition.

```csharp
Html.On(plan, t => t.Event("check-care-level"))
    .When(p => p.Component<FusionDropDownList>(m => m.Assessment.CareLevel).Value())
    .Eq("MEMORY")
    .Then(p => p
        .Element("memory-care-notice")
        .Show());
```

### FusionDatePicker.SetValue(DateTime)
Sets the selected date (serialized ISO).

```csharp
Html.On(plan, t => t.Event("default-move-in"))
    .Then(p => p
        .Component<FusionDatePicker>(m => m.Resident.MoveInDate)
        .SetValue(new DateTime(2026, 1, 1)));
```

### FusionDatePicker.Value() — read as a typed DateTime source
Read the live date for a condition guard.

```csharp
Html.On(plan, t => t.Event("require-move-in"))
    .When(p => p.Component<FusionDatePicker>(m => m.Resident.MoveInDate).Value())
    .IsNull()
    .Then(p => p
        .Element("move-in-error")
        .Show());
```

### FusionNumericTextBox.SetValue(decimal)
Sets the numeric value.

```csharp
Html.On(plan, t => t.Event("apply-base-rate"))
    .Then(p => p
        .Component<FusionNumericTextBox>(m => m.Billing.MonthlyRate)
        .SetValue(4200m));
```

### FusionNumericTextBox.SetMin(decimal)
Sets the control's minimum allowed value.

```csharp
Html.On(plan, t => t.Event("clamp-rate"))
    .Then(p => p
        .Component<FusionNumericTextBox>(m => m.Billing.MonthlyRate)
        .SetMin(1000m));
```

### FusionNumericTextBox.Value() — read as a typed decimal source
Use the live numeric value in a comparison.

```csharp
Html.On(plan, t => t.Event("check-rate"))
    .When(p => p.Component<FusionNumericTextBox>(m => m.Billing.MonthlyRate).Value())
    .Gt(0m)
    .Then(p => p
        .Element("rate-ok")
        .Show());
```

---

## Component methods — call control APIs

Beyond value get/set, each `ComponentRef` exposes the control's methods as typed
calls that emit `Call` reactions.

### FusionDropDownList.ShowPopup() / HidePopup()
Open or close the dropdown popup programmatically.

```csharp
Html.On(plan, t => t.Event("open-care-level"))
    .Then(p => p
        .Component<FusionDropDownList>(m => m.Assessment.CareLevel)
        .ShowPopup());
```

### FusionDropDownList.DataBind()
Flush pending property changes into the rendered control.

```csharp
Html.On(plan, t => t.Event("rebind-care-level"))
    .Then(p => p
        .Component<FusionDropDownList>(m => m.Assessment.CareLevel)
        .SetValue("ASSISTED")
        .DataBind());
```

### FusionNumericTextBox.Increment() / Decrement()
Step the numeric value up or down by one step.

```csharp
Html.On(plan, t => t.Event("bump-rate"))
    .Then(p => p
        .Component<FusionNumericTextBox>(m => m.Billing.MonthlyRate)
        .Increment());
```

### FusionTextBox.AddAppendIcon(cssClass)
Adds an append icon span via Syncfusion's `addIcon` API.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionTextBox>(m => m.Resident.ContactEmail)
        .AddAppendIcon("e-icons e-mail"));
```

---

## Component focus — FocusIn / FocusOut

Inputs expose focus as method calls on their `ComponentRef`. `FocusIn()` moves
focus into the control; `FocusOut()` removes it. (These are the finalized focus
verbs; they emit `Call` reactions like any other method.)

### FusionTextBox.Focus()
Move focus into the textbox after a reaction.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionTextBox>(m => m.Resident.FullName)
        .Focus());
```

### FusionTextBox.Blur()
Remove focus from the textbox.

```csharp
Html.On(plan, t => t.Event("dismiss"))
    .Then(p => p
        .Component<FusionTextBox>(m => m.Resident.FullName)
        .Blur());
```

### FusionDropDownList.Focus() — focus a different control after change
Chain focus onto the next field when care level changes.

```csharp
Html.InputField(plan, m => m.Assessment.CareLevel, o => o
        .Label("Care level"))
    .FusionDropDownList(b => b
        .DataSource(careLevels)
        .Fields<CareLevelItem>(t => t.Name, v => v.Code)
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Component<FusionNumericTextBox>(m => m.Billing.MonthlyRate)
            .Focus()));
```

### FusionDatePicker.Focus() / FocusOut()
Move focus into or out of the date picker.

```csharp
Html.On(plan, t => t.Event("edit-move-in"))
    .Then(p => p
        .Component<FusionDatePicker>(m => m.Resident.MoveInDate)
        .Focus());
```

### FusionNumericTextBox.Focus() / FocusOut()
Move focus into or out of the numeric input.

```csharp
Html.On(plan, t => t.Event("edit-rate"))
    .Then(p => p
        .Component<FusionNumericTextBox>(m => m.Billing.MonthlyRate)
        .Focus());
```

---

## ElementBuilder — mutate any DOM element

`p.Element("id")` returns an `ElementBuilder<TModel>` for non-input display
elements (banners, status spans, panels). It mutates text, inner HTML, CSS
classes, and visibility. Most methods return the pipeline for continued
chaining; the `TypedSource` overloads of `SetText` / `SetHtml` return the element
builder so element mutations can chain.

### Element(id) — target a DOM element by id
Open an element target; chain a mutation.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("welcome-banner")
        .SetText("Welcome to Sunrise"));
```

### SetText(literal)
Set the element's text content to a literal string.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("status")
        .SetText("Ready"));
```

### SetText(args, path) — from an event payload
Set text from a property on the event payload.

```csharp
Html.InputField(plan, m => m.Resident.FullName, o => o
        .Label("Full name"))
    .NativeTextBox(b => b
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Element("name-echo")
            .SetText(args, x => x.Value)));
```

### SetText(body, path) — from an HTTP response body
Set text from a property on a success/error response body.

```csharp
Html.On(plan, t => t.Event("load-summary"))
    .Get("/api/residents/summary")
    .OnSuccess<SummaryResponse>((body, p) => p
        .Element("resident-count")
        .SetText(body, x => x.TotalResidents));
```

### SetText(typedSource) — from a typed source
Set text from a component / plugin / URL value (returns the element builder).

```csharp
Html.On(plan, t => t.Event("echo-care-level"))
    .Then(p => p
        .Element("care-level-echo")
        .SetText(p.Component<FusionDropDownList>(m => m.Assessment.CareLevel).Value()));
```

### SetHtml(literal)
Set the element's inner HTML to a literal string.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("notice")
        .SetHtml("<strong>Annual review due</strong>"));
```

### SetHtml(args, path) — from an event payload
Set inner HTML from a property on the event payload.

```csharp
Html.On(plan, t => t.Event<NoticePushed>("notice-pushed"))
    .Then(p => p
        .Element("notice")
        .SetHtml(args, x => x.HtmlBody));
```

### SetHtml(typedSource) — from a typed source
Set inner HTML from a typed source (returns the element builder).

```csharp
Html.On(plan, t => t.Event("render-template"))
    .Then(p => p
        .Element("panel")
        .SetHtml(p.Plugin<string>("templates", "render")));
```

### AddClass(className)
Add a CSS class to the element.

```csharp
Html.On(plan, t => t.Event("mark-overdue"))
    .Then(p => p
        .Element("assessment-row")
        .AddClass("overdue"));
```

### RemoveClass(className)
Remove a CSS class from the element.

```csharp
Html.On(plan, t => t.Event("clear-overdue"))
    .Then(p => p
        .Element("assessment-row")
        .RemoveClass("overdue"));
```

### ToggleClass(className)
Toggle a CSS class on the element.

```csharp
Html.InputField(plan, m => m.Resident.IsVeteran, o => o
        .Label("Veteran"))
    .NativeCheckBox(b => b
        .Reactive(plan, e => e.Changed, (args, p) => p
            .Element("veteran-card")
            .ToggleClass("highlighted")));
```

### Show()
Show the element (removes the `hidden` attribute).

```csharp
Html.On(plan, t => t.Event("show-billing"))
    .Then(p => p
        .Element("billing-panel")
        .Show());
```

### Hide()
Hide the element (sets the `hidden` attribute).

```csharp
Html.On(plan, t => t.Event("hide-billing"))
    .Then(p => p
        .Element("billing-panel")
        .Hide());
```

### Chained element mutations across many elements
Each pipeline-returning mutation lets you open another `Element` target.

```csharp
Html.On(plan, t => t.Event("care-level-changed"))
    .Then(p => p
        .Element("care-level-badge")
        .AddClass("changed")
        .Element("billing-panel")
        .Show()
        .Element("save-hint")
        .SetText("Remember to save"));
```

---

## IComponent / IInputComponent / IAppLevelComponent — the component contracts

The marker interfaces every component slice implements. They are not authored
directly in views, but they shape what `Component<T>` accepts and what value
member gather and validation read.

### IComponent — vendor identity
Every component carries a `Vendor` used for DOM resolution (`"native"`, the
Fusion vendor token, etc.). `Component<TComponent>(...)` requires
`TComponent : IComponent, new()`.

```csharp
// A component slice declares its vendor:
internal sealed class FusionTextBox : IComponent
{
    public string Vendor => "fusion";
}
```

### IInputComponent — readable value member
Model-bound inputs add `ValueMember` — the JS member gather and validation read
and that `.Value()` / `.SetValue(...)` target.

```csharp
internal sealed class FusionDropDownList : IInputComponent
{
    public string Vendor => "fusion";
    public string ValueMember => "value";
}
```

### IAppLevelComponent — fixed default id
Layout-owned singletons (Toast, Confirm, Loader) add `DefaultId`; that is what the
parameterless `Component<TComponent>()` resolves.

```csharp
internal sealed class FusionToast : IAppLevelComponent
{
    public string Vendor => "fusion";
    public string DefaultId => "alis-toast";
}
```

<script type="text/markdown" data-area="fusion-template">
# fusion-template

The Fusion Template DSL builds typed, model-bound HTML fragments for Syncfusion
components that render content from a template string — grid column cells,
list-view items, tooltip bodies, dropdown rows, and similar. You author the
markup as a tall fluent chain of typed nodes; each node either emits a fixed
literal, binds to a `TModel` property, or branches on a typed predicate. The
chain terminates in `.Render()`, which produces the Syncfusion template **string**
(an SSR string with `${prop}` bindings and `${if(...)}` blocks), and you hand
that string to the column / list / tooltip template slot.

This is the **SSR-string lane**, not the runtime-mutation lane. The template
nodes append to a string at C# render time; they do not mutate live DOM. That is
why the class verb is `CssClass` (append to an SSR `class` string), **not**
`AddClass` (which mutates a live element), and why the conditional verb is
`WhenTemplate` (emits `${if(...)}`), **not** the runtime Conditions `When` (which
builds a `ConditionGraph`). See naming sheet §3.5 and §4.

Entry point: `FusionTemplate.Create<TModel>()` returns a
`FusionTemplateBuilder<TModel>`. Every builder method returns the builder for a
tall chain. The conditional methods (`WhenTemplate` / `ShowTemplateIf`) take
`then` / `@else` lambdas over a `FusionConditionalBuilder<TModel>` — the nested
body builder. The final `.Render()` (or implicit `ToString()`) yields the string.

> **Finalized names vs current source.** This catalog uses the finalized
> redesign names from `09-dsl-naming-sheet.md` §3.5. The current shipped source
> still spells five of them the old way — `CssClass` is `.Class`, `Attribute` is
> `.Attr`, `WhenTemplate` is `.When`, `ShowTemplateIf` is `.ShowIf`,
> `DispatchButton` is `.EventButton`. Each section names the current spelling so
> a dev reading today's code recognizes it. `Render` is the catalog name for the
> terminal `.Render()` call (it renders the chain to the SF template string).

Domain used throughout: a senior-living roster. Grid/list row models —
`ResidentDirectoryGridItem` (resident name, suite, care level, risk level,
photo, resident id, chart url), `ResidentBillingItem` (resident name, room,
billing status, balance), and `FacilityRosterItem` (facility name, occupancy,
region) — are the per-row `TModel` the Syncfusion component supplies.

---

## Create — open a typed template

### Create<TModel>
Opens a typed template builder bound to the per-row model the Syncfusion component supplies; the chain ends in `.Render()` to produce the template string.

```csharp
var residentNameTemplate = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Text(m => m.ResidentName)
    .Render();
```

---

## Render — terminate the chain into the SF template string

### Render
Renders the whole node chain (wrapped in a single root `<div>`) to the Syncfusion template string; this is the value you assign to a column / list / tooltip template slot. `ToString()` is an alias.

```csharp
var cellTemplate = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .CssClass("grid-resident-cell")
    .Div(d => d
        .CssClass("font-semibold text-slate-900")
        .Span(m => m.ResidentName))
    .Render();
```

```csharp
// ToString() is an alias for Render() — same string, implicit at interpolation.
string listItemTemplate = FusionTemplate.Create<FacilityRosterItem>()
    .Span(m => m.FacilityName)
    .ToString();
```

## Text — bound and literal text directly on the root

### Text<TProp> — bind a property as text
Emits the SF `${property}` binding inline (no wrapping element); the runtime substitutes the row value as text.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Text(m => m.ResidentName)
    .Render();
```

### Text<TProp> — nested-path binding
Dotted member paths bind to the camelCase nested path (`m.PrimaryContact.Name` → `${primaryContact.name}`).

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Text(m => m.PrimaryContact.Name)
    .Render();
```

### Text(string) — literal text
Emits a fixed literal string, independent of the row.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Text("Resident")
    .Render();
```

## Span — inline span node

`Span` has four overloads: bound / bound+css and literal / literal+css. Unlike
`Div`, `Span` does not take a nested builder lambda — its content is one bound
property or one literal string.

### Span<TProp> — bound span, no class
Emits `<span>${property}</span>`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span(m => m.ResidentName)
    .Render();
```

### Span<TProp>(css) — bound span with CSS class
Emits `<span class="...">${property}</span>`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span(m => m.CareLevel, "text-xs text-slate-600 font-medium")
    .Render();
```

### Span(string) — literal span, no class
Emits `<span>text</span>`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span(" | ")
    .Render();
```

### Span(string, css) — literal span with CSS class
Emits `<span class="...">text</span>`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span("Suite ", "font-medium")
    .Render();
```

### Span — composing a label-then-value run
Multiple span calls in a tall chain build a single inline run of static labels and bound values.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span("Suite ", "font-medium")
    .Span(m => m.Suite)
    .Span(" | ")
    .Span(m => m.CareLevel)
    .Render();
```

## Div — block container with nested children

### Div — nested builder lambda
Emits a `<div>` whose children come from a nested `FusionTemplateBuilder<TModel>` lambda; nest `Span`, `Text`, `CssClass`, more `Div`, etc.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Div(d => d
        .CssClass("font-semibold text-slate-900")
        .Span(m => m.ResidentName))
    .Render();
```

### Div — stacked rows (grid cell with two lines)
A realistic two-line grid cell: bold name line over a muted detail line.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .CssClass("grid-resident-template space-y-1")
    .Div(d => d
        .CssClass("font-semibold text-slate-900")
        .Span(m => m.ResidentName))
    .Div(d => d
        .CssClass("text-xs text-slate-600")
        .Span("Suite ", "font-medium")
        .Span(m => m.Suite)
        .Span(" | ")
        .Span(m => m.CareLevel))
    .Render();
```

### Div — deeper nesting
Divs nest arbitrarily; each nested lambda is a fresh `FusionTemplateBuilder<TModel>` over the same row model.

```csharp
var template = FusionTemplate.Create<ResidentBillingItem>()
    .Div(outer => outer
        .CssClass("billing-cell")
        .Div(line => line
            .CssClass("font-semibold")
            .Span(m => m.ResidentName))
        .Div(line => line
            .CssClass("text-xs text-slate-500")
            .Span("Room ", "font-medium")
            .Span(m => m.RoomNumber)))
    .Render();
```

+css+alt.

### Img<TProp> — bound src only
Emits `<img src="${property}" />`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Img(m => m.PhotoUrl)
    .Render();
```

### Img<TProp>(css) — bound src with CSS class
Emits `<img src="${property}" class="..." />`.

var template = FusionTemplate.Create<ResidentDirectoryGridItem>()

        .Img(m => m.PhotoUrl, "h-8 w-8 rounded-full object-cover", "Resident photo")

var template = FusionTemplate.Create<ResidentDirectoryGridItem>()

var template = FusionTemplate.Create<ResidentDirectoryGridItem>()

Emits a fixed-text badge with class `e-badge`.

```csharp
var template = FusionTemplate.Create<ResidentBillingItem>()
    .Badge("Overdue")
    .Render();
```

### Badge(string, css) — literal, explicit class
A fixed label with explicit styling.

```csharp
var template = FusionTemplate.Create<ResidentBillingItem>()
    .Badge("Overdue", "rounded bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-700")

## Icon — Syncfusion glyph

`Icon` emits `<span class="e-icons e-{name} ...">`. The builder prefixes
`e-icons e-` to the name you pass (pass `"warning"`, get `e-icons e-warning`).
Two overloads: bare and +css.

### Icon(name) — glyph only
Emits the SF icon span with the default `e-icons e-{name}` class.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Icon("warning")
    .Render();
```

### Icon(name, css) — glyph with extra class
Appends your CSS class after the base `e-icons e-{name}`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Icon("warning", "text-red-600 mr-1")
    .Render();
```

### Icon + Span — icon-prefixed label
A common cell: a status glyph followed by a bound value.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Div(d => d
        .CssClass("flex items-center")
        .Icon("warning", "text-red-600 mr-1")
        .Span(m => m.RiskLevel))
    .Render();
```

## Button — static-action button

`Button` emits `<button class="e-btn ..." onclick="...">text</button>`. The
`onClick` string is injected verbatim into the `onclick` attribute — it is a
trusted developer string, never user input. Two overloads: bare and +css.

### Button(text, onClick) — fixed onclick handler
Emits a button with the given inline `onclick`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Button("Print", "window.print()")
    .Render();
```

### Button(text, onClick, css) — with CSS class
Appends your CSS class after the base `e-btn`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Button("Print", "window.print()", "e-small e-flat")
    .Render();
```

## ButtonFor — button that calls a JS function with a bound row value

`ButtonFor<TProp>` emits `<button onclick="{onClickFn}(${property})">text</button>`
— it calls the named client function passing the bound row value as the argument.
Signature: `(text, idProperty, onClickFn[, css])`. Two overloads: bare and +css.

### ButtonFor<TProp> — call a function with the bound id
Emits a button whose onclick invokes `openChart(${residentId})`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .ButtonFor("Open chart", m => m.ResidentId, "openChart")
    .Render();
```

### ButtonFor<TProp>(css) — with CSS class
Same, with explicit styling appended after `e-btn`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .ButtonFor("Open chart", m => m.ResidentId, "openChart", "e-small e-primary")
    .Render();
```

## DispatchButton — button that dispatches a reactive event with the row value

`DispatchButton<TProp>` (current source: `EventButton`) emits a button whose
onclick dispatches a `CustomEvent(eventName, { detail: { id: ${property} } })` on
`document` — the exact event a `t.Event(name)` trigger (current: `CustomEvent`)
listens for. This is how a template cell hands a row id into the reactive plan.
Signature: `(text, eventName, idProperty[, css])`. Two overloads: bare and +css.

### DispatchButton<TProp> — dispatch with the bound row id
Clicking dispatches `grid:review-resident` carrying `{ id: ${residentId} }`.

```csharp
var actionTemplate = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .DispatchButton("Review", "grid:review-resident", m => m.ResidentId)
    .Render();
```

### DispatchButton<TProp>(css) — with CSS class
The shipped grid pattern: a small primary action button in an action column.

```csharp
var actionTemplate = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .CssClass("grid-action-template")
    .DispatchButton("Review", "grid:review-resident", m => m.ResidentId, "e-small e-primary")
    .Render();
```

### DispatchButton — the listening trigger (cross-area)
The dispatched event is consumed by a typed `Event` trigger in the same plan; the row id arrives on the payload.

```csharp
Html.On(plan, t => t.Event<GridTemplateActionPayload>("grid:review-resident", (payload, p) => p
    .Post("/Sandbox/Components/Grid/ReviewResident")
    .Gather(g => g
        .FromEvent(payload, x => x.Id, "id"))
    .Response(r => r
        .OnSuccess<ResidentDirectorySelectionResponse>((json, s) => s
            .Element("template-action-status")
            .SetText(json, x => x.Summary)))));
```

## Link — anchor with bound href and bound text

`Link<THref, TText>` emits `<a href="${hrefProperty}">${textProperty}</a>`. Both
the href and the text bind to properties. Two overloads: bare and +css.

### Link<THref, TText> — bound href and text
Emits an anchor whose href and label both come from the row.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Link(m => m.ChartUrl, m => m.ResidentName)
    .Render();
```

### Link<THref, TText>(css) — with CSS class
Same, with styling on the anchor.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Link(m => m.ChartUrl, m => m.ResidentName, "text-primary underline hover:no-underline")
    .Render();
```

## Raw — unescaped HTML escape hatch

### Raw
Emits a fixed raw HTML fragment verbatim, for markup the typed nodes cannot express. The string is trusted developer content, never user input.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span(m => m.ResidentName)
    .Raw("<hr class='my-1 border-slate-200' />")
    .Span(m => m.CareLevel, "text-xs text-slate-500")
    .Render();
```

## WhenTemplate — conditional SSR block (then / else)

`WhenTemplate` (current source: `When`) emits a Syncfusion `${if(condition)} ...
${else} ... ${/if}` block. The predicate is an `Expression<Func<TModel, bool>>`
translated to SF condition syntax: `m.RiskLevel == "High"` → `riskLevel === 'High'`,
`m.Balance > 0` → `balance > 0`, `!m.IsActive` → `!isActive`, `&&` → `&&`,
`||` → `||`. The `then` / `@else` lambdas configure a `FusionConditionalBuilder<TModel>`
(Span / Badge / Icon / Div / Img / Button / DispatchButton / Raw). Two overloads:
then-only and then+else.

### WhenTemplate — then-only (equality predicate)
Renders the `then` body only when the row matches; nothing otherwise.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .WhenTemplate(m => m.RiskLevel == "High",
        then: t => t
            .Badge(m => m.RiskLevel, "rounded bg-red-100 px-2 py-0.5 text-xs font-bold text-red-700"))
    .Render();
```

### WhenTemplate — then + else (the shipped risk badge)
The real grid pattern: a red badge for high risk, a neutral badge otherwise. Note the named `then:` / `@else:` arguments (`else` is a C# keyword, so it is escaped).

```csharp
var riskTemplate = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .WhenTemplate(m => m.RiskLevel == "High",
        then: t => t
            .Badge(m => m.RiskLevel, "rounded bg-red-100 px-2 py-0.5 text-xs font-bold text-red-700"),
        @else: e => e
            .Badge(m => m.RiskLevel, "rounded bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700"))
    .Render();
```

### WhenTemplate — numeric comparison predicate
`>` translates directly to the SF `>` operator; `then` / `else` style by balance.

```csharp
var template = FusionTemplate.Create<ResidentBillingItem>()
    .WhenTemplate(m => m.Balance > 0,
        then: t => t
            .Badge("Balance due", "rounded bg-red-100 px-2 py-0.5 text-xs font-bold text-red-700"),
        @else: e => e
            .Badge("Paid", "rounded bg-green-100 px-2 py-0.5 text-xs font-semibold text-green-700"))
    .Render();
```

### WhenTemplate — boolean property predicate
A bare boolean member reads as the SF truthiness of that field.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .WhenTemplate(m => m.AssessmentOverdue,
        then: t => t
            .Icon("warning", "text-red-600"))
    .Render();
```

### WhenTemplate — negated boolean predicate
`!member` translates to the SF `!field` negation.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .WhenTemplate(m => !m.IsActive,
        then: t => t
            .Badge("Discharged", "rounded bg-slate-200 px-2 py-0.5 text-xs text-slate-600"))
    .Render();
```

### WhenTemplate — compound predicate (&& / ||)
Logical `&&` / `||` lower to the matching SF operators; group with a nested div in the body.

```csharp
var template = FusionTemplate.Create<ResidentBillingItem>()
    .WhenTemplate(m => m.Balance > 0 && m.BillingStatus != "Paid",
        then: t => t
            .Div(d => d
                .CssClass("flex items-center")
                .Icon("warning", "text-amber-600 mr-1")
                .Span("Action required", "text-xs font-semibold text-amber-700")))
    .Render();
```

### WhenTemplate — else body with a different element kind
The `then` and `@else` bodies are independent; they need not emit the same element kind.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .WhenTemplate(m => m.RiskLevel == "High",
        then: t => t
            .Icon("warning", "text-red-600"),
        @else: e => e
            .Span(m => m.RiskLevel, "text-xs text-slate-500"))
    .Render();
```
