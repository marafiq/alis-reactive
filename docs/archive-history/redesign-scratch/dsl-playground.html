## ShowTemplateIf — conditional SSR block (then-only alias)

`ShowTemplateIf` (current source: `ShowIf`) is the thin then-only alias of
`WhenTemplate`: render the content only when the predicate holds, no else branch.
Same predicate translation as `WhenTemplate`.

### ShowTemplateIf — show only when true
Emits the body inside a `${if(...)}` block with no `${else}`.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .ShowTemplateIf(m => m.AssessmentOverdue,
        content: t => t
            .Icon("warning", "text-red-600 mr-1"))
    .Render();
```

### ShowTemplateIf — gate an action by row state
Only render the review button for high-risk residents.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .ShowTemplateIf(m => m.RiskLevel == "High",
        content: t => t
            .DispatchButton("Review", "grid:review-resident", m => m.ResidentId, "e-small e-primary"))
    .Render();
```

### Id
Sets the `id` attribute on the wrapping root `<div>` (the one `Render()` emits). A fixed string, not bound.

## CssClass — append a class to the root div

`CssClass` (current source: `Class`) appends a CSS class to the wrapping root
`<div>`. Call it more than once to accumulate classes (they are space-joined).
This is the SSR-string lane — it is **not** `AddClass` (runtime DOM mutation).

### CssClass — single class on the root
Adds one class to the template's root div.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .CssClass("grid-resident-template space-y-1")
    .Span(m => m.ResidentName)
    .Render();
```

### CssClass — accumulate multiple classes
Each call appends; the root div ends with all of them.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .CssClass("grid-resident-template")
    .CssClass("space-y-1")
    .Span(m => m.ResidentName)
    .Render();
```

## Attribute — arbitrary HTML attribute on the root div

`Attribute` (current source: `Attr`) sets an arbitrary `name="value"` attribute on
the wrapping root `<div>`. Re-setting the same name overwrites it.

### Attribute — data attribute on the root
Adds `data-resident="row"` to the template's root div.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Attribute("data-resident", "row")
    .Span(m => m.ResidentName)
    .Render();
```

### Attribute — multiple attributes
Stack several attribute calls in a tall chain.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Attribute("data-kind", "resident")
    .Attribute("role", "gridcell")
    .Span(m => m.ResidentName)
    .Render();
```

## Model-bound expression semantics (cross-cutting)

Every `TProp` expression lowers through `FusionTemplateExpression`, shared by all
bound nodes (`Text`, `Span`, `Img`, `Badge`, `Link`, `ButtonFor`,
`DispatchButton`). The rules below apply uniformly.

### Property binding — PascalCase C# → camelCase SF binding
`m => m.ResidentName` emits `${residentName}`, matching the global PascalCase→camelCase JSON serialization.

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span(m => m.ResidentName)   // → <span>${residentName}</span>
    .Render();
```

### Nested-path binding — dotted members
`m => m.PrimaryContact.Name` emits `${primaryContact.name}` (each segment camelCased, joined by dots).

```csharp
var template = FusionTemplate.Create<ResidentDirectoryGridItem>()
    .Span(m => m.PrimaryContact.Name)   // → <span>${primaryContact.name}</span>
    .Render();
```

### Condition binding — predicate operators
In `WhenTemplate` / `ShowTemplateIf`, the predicate maps C# operators to SF
condition tokens: `==` → `===`, `!=` → `!==`, `>`/`>=`/`<`/`<=` pass through,
`&&` → `&&`, `||` → `||`, `!x` → `!x`. String literals quote with single quotes
(`"High"` → `'High'`), booleans render `true`/`false`, numbers use invariant
culture.

```csharp
var template = FusionTemplate.Create<ResidentBillingItem>()
    .WhenTemplate(m => m.BillingStatus == "Paid",      // → billingStatus === 'Paid'
        then: t => t.Badge("Paid", "text-green-700"))
    .Render();
```

## Node availability — root vs conditional builder

The root `FusionTemplateBuilder<TModel>` and the nested
`FusionConditionalBuilder<TModel>` (the `then` / `@else` body) expose overlapping
but not identical surfaces. The conditional body is for the SSR `${if}` content,
so it omits root-only structural and link/button-binding members.

| Node | Root builder | Conditional body |
|---|---|---|
| `Text<TProp>` / `Text(string)` | yes | no |
| `Span` (4 overloads) | yes | yes |
| `Div(lambda)` | yes | yes |
| `Img` | yes (3 overloads: bare/+css/+css+alt) | yes (2 overloads: bare/+css) |
| `Badge` | yes | yes |
| `Icon` | yes | yes |
| `Button` | yes | yes |
| `ButtonFor<TProp>` | yes | no |
| `DispatchButton<TProp>` (`EventButton`) | yes | yes |
| `Link<THref,TText>` | yes | no |
| `Raw` | yes | yes |
| `WhenTemplate` / `ShowTemplateIf` | yes | no (no nested branching) |
| `Id` / `CssClass` / `Attribute` | yes (root div only) | no |
| `Render` / `ToString` | yes | (internal `Render` only) |

</script>
<script type="text/markdown" data-area="validation">
# validation

The validation DSL declares **browser** validation rules on a model by subclassing
`ReactiveValidator<T>` (which is itself a FluentValidation `AbstractValidator<T>`).
Every `ClientRule(...)` chain records two things at once: a server-side
FluentValidation rule (`RuleFor`) **and** a deterministic client-side rule that
lowers into the plan. FluentValidation stays the server authority; the reactive
validator mirrors a deterministic subset of it into the browser.

Rules are simple, deterministic, array- and object-capable, and bound by
controlled element IDs. Async / `MustAsync` / DB-touching rules stay server-only
via the FluentValidation `When`/`Unless` overrides — declaring a `ClientRule`
inside one of those throws.

Registration (once, at startup):

```csharp
builder.Services.AddReactiveFluentValidation(validation =>
    validation.AddFromAssemblyContaining<Program>());
```

`AddReactiveFluentValidation` also accepts `.Add<TValidator>()` and
`.AddFromAssembly(assembly)`. Each `ReactiveValidator<T>` it discovers is wired
both as the FluentValidation validator and as the client-metadata source the
plan reads.

This catalog is exhaustive for: `ReactiveValidator<T>`, `ClientRule` (scalar,
`ClientRuleEach`, nested `ClientRule(field, validator)`, `ClientRulesFrom`),
every rule verb, the `WhenField*` conditional family, `WhenFields` composition
(And / Or / Not), server-only `When`/`Unless`, the HTTP `Validate` gate, and
`ValidationErrors` (the `ShowValidationErrors` reaction).

Source: `Alis.Reactive.FluentValidator/` (authoring surface),
`Alis.Reactive/Validation/` (rule model), `Alis.Reactive/PlanModel/Validation/`
(plan lowering).

> Naming note. The task brief used informal names (`WhenFieldGreaterThan`,
> `WhenFieldNull`, `NotEqualTo`, `ShowValidationErrors`). The finalized C# names
> are: `WhenFieldGt` / `WhenFieldGte` / `WhenFieldLt` / `WhenFieldLte`,
> `WhenFieldNull` / `WhenFieldNotNull`, `WhenFieldEmpty` / `WhenFieldNotEmpty`,
> `WhenFieldIn` / `WhenFieldNotIn`, `WhenFieldBetween`; comparison verbs
> `GreaterThan` / `LessThan` / `EqualTo` / `NotEqual` / `NotEqualTo` /
> `GreaterThanOrEqualTo` / `LessThanOrEqualTo` / `Min` / `Max`; and the pipeline
> reaction `ValidationErrors(formId)` (lowers to a `ShowValidationErrors` plan
> node). This catalog uses the finalized names.

## ReactiveValidator<T>

### ReactiveValidator<T>
Subclass this to declare a model's validation. The constructor records rules; `RuleFor(...)` is server-only, `ClientRule(...)` records server + client together.

```csharp
public class ResidentIntakeValidator
    : ReactiveValidator<ResidentIntakeModel>
{
    public ResidentIntakeValidator()
    {
        ClientRule(m => m.ResidentName)
            .Required("'Resident Name' is required.");

        ClientRule(m => m.PrimaryDiagnosis)
            .Required("'Primary Diagnosis' is required.");

        ClientRule(m => m.Age)
            .GreaterThan(0m, "'Age' must be greater than 0.");
    }
}
```

### RuleFor (server-only, alongside ClientRule)
A plain FluentValidation `RuleFor` runs on the server only — it carries no browser rule. Pair it with `ClientRule` to mirror it client-side.

```csharp
public class FacilityValidator : ReactiveValidator<FacilityModel>
{
    public FacilityValidator()
    {
        RuleFor(m => m.LicenseNumber)
            .NotEmpty()
            .Must(BeOnFileWithState);

        ClientRule(m => m.FacilityName)
            .Required("'Facility Name' is required.");
    }
}
```

## ClientRule

### ClientRule (scalar)
Begins a rule chain for one scalar model property. The property expression drives the deterministic element ID; verbs chain on the returned builder.

```csharp
ClientRule(m => m.RoomNumber)
    .Required("'Room Number' is required.")
    .MaxLength(6, "'Room Number' cannot exceed 6 characters.");
```

### ClientRule (nested object)
`ClientRule(field, childValidator)` runs a child `ReactiveValidator<TChild>` against a nested object. It calls `SetValidator` on the server and prefixes the child's client rules with the property path.

```csharp
ClientRule(m => m.EmergencyContact, new EmergencyContactValidator());
```

```csharp
public class EmergencyContactValidator
    : ReactiveValidator<EmergencyContactModel>
{
    public EmergencyContactValidator()
    {
        ClientRule(c => c.FullName)
            .Required("Emergency contact name is required.");

        ClientRule(c => c.Phone)
            .Regex(@"^\d{3}-\d{3}-\d{4}$", "Use format 555-123-4567.");
    }
}
```

### ClientRuleEach (collection)
Validates each element of a collection with an item validator, then `.SetValidator(...)` attaches it. `.AtLeastOne(...)` requires a non-empty collection.

```csharp
ClientRuleEach(m => m.Medications)
    .SetValidator(new MedicationLineValidator());
```

```csharp
ClientRuleEach(m => m.CarePlanTasks)
    .AtLeastOne("Add at least one care-plan task.")
    .SetValidator(new CarePlanTaskValidator());
```

### ClientRulesFrom (share rules into this model)
Pulls another validator's client rules into the current model at the root path. The `ReactiveValidator<T>` overload also includes the server rules (`Include`); the `ReactiveValidator<TSource>` overload copies client rules only.

```csharp
public class CombinedSectionValidator
    : ReactiveValidator<CombinedSection>
{
    public CombinedSectionValidator()
    {
        ClientRulesFrom(new BasicSectionValidator());

        ClientRule(m => m.Phone)
            .Regex(@"^\d{3}-\d{3}-\d{4}$", "Phone must match 123-456-7890.");
    }
}
```

## Rule verbs

Each verb returns the same `ReactiveClientRuleBuilder<TModel, TValue>`, so verbs chain. Every verb takes a trailing user-facing `message`.

### Required
Value must be present (server `NotEmpty`).

```csharp
ClientRule(m => m.ResidentName)
    .Required("'Resident Name' is required.");
```

### Empty
Value must be absent (server `Empty`).

```csharp
ClientRule(m => m.MiddleName)
    .Empty("Leave 'Middle Name' blank for this facility.");
```

### Email
String must be a valid email (`string?` only).

```csharp
ClientRule(m => m.ContactEmail)
    .Email("Enter a valid email address.");
```

### Url
String must be empty or an http(s) URL (`string?` only).

```csharp
ClientRule(m => m.FacilityWebsite)
    .Url("Enter a valid website URL.");
```

### CreditCard
String must be a valid card number (`string?` only).

```csharp
ClientRule(m => m.BillingCardNumber)
    .CreditCard("Enter a valid card number.");
```

### AtLeastOne
Collection / multi-select must have at least one item (server `NotEmpty`).

```csharp
ClientRule(m => m.SelectedServices)
    .AtLeastOne("Select at least one service.");
```

### MinLength
Minimum string length (`string?` only).

```csharp
ClientRule(m => m.CarePlanNotes)
    .MinLength(20, "Care-plan notes need at least 20 characters.");
```

### MaxLength
Maximum string length (`string?` only).

```csharp
ClientRule(m => m.RoomNumber)
    .MaxLength(6, "'Room Number' cannot exceed 6 characters.");
```

### Regex
String must match a pattern (`string?` only).

```csharp
ClientRule(m => m.MedicaidId)
    .Regex(@"^[A-Z]{2}\d{7}$", "Medicaid ID must be 2 letters then 7 digits.");
```

### Range (inclusive)
Value inclusive-between bounds. Works on `TValue` and `TValue?` (`IComparable`).

```csharp
ClientRule(m => m.Age)
    .Range(0, 120, "Age must be between 0 and 120.");
```

```csharp
ClientRule(m => m.MonthlyBilling)
    .Range(0m, 25000m, "Billing must be between 0 and 25,000.");
```

### ExclusiveRange
Value strictly between bounds. Works on `TValue` and `TValue?`.

```csharp
ClientRule(m => m.AssessmentScore)
    .ExclusiveRange(0, 100, "Score must be strictly between 0 and 100.");
```

### Min
Value at or above a minimum (alias of `GreaterThanOrEqualTo`). `TValue` / `TValue?`.

```csharp
ClientRule(m => m.MobilityScore)
    .Min(1, "Mobility score must be at least 1.");
```

### Max
Value at or below a maximum (alias of `LessThanOrEqualTo`). `TValue` / `TValue?`.

```csharp
ClientRule(m => m.FallRiskScore)
    .Max(10, "Fall-risk score cannot exceed 10.");
```

### GreaterThanOrEqualTo (literal)
Value `>=` a constant. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.Salary)
    .GreaterThanOrEqualTo(0m, "Salary must be at least 0.");
```

### LessThanOrEqualTo (literal)
Value `<=` a constant. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.Salary)
    .LessThanOrEqualTo(500000m, "Salary must be at most 500,000.");
```

### GreaterThan (literal)
Value `>` a constant. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.PainLevel)
    .GreaterThan(0m, "'Pain Level' must be greater than 0.");
```

### LessThan (literal)
Value `<` a constant. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.CareHoursPerDay)
    .LessThan(24m, "Care hours per day must be under 24.");
```

### EqualTo (literal)
Value must equal a constant.

```csharp
ClientRule(m => m.AcknowledgedPolicy)
    .EqualTo(true, "You must acknowledge the facility policy.");
```

### NotEqual (literal)
Value must not equal a constant.

```csharp
ClientRule(m => m.CareLevel)
    .NotEqual("Unassigned", "Assign a real care level before saving.");
```

### Chaining multiple verbs on one field
Verbs stack on the same property; each adds a server rule and a client rule.

```csharp
ClientRule(m => m.FullName)
    .Required("Name is required.")
    .MaxLength(100, "Name must be at most 100 characters.");
```

```csharp
ClientRule(m => m.Salary)
    .GreaterThanOrEqualTo(0m, "Salary must be at least 0.")
    .LessThanOrEqualTo(500000m, "Salary must be at most 500,000.");
```

## Cross-property (peer-field) verbs

These verbs accept a peer-field expression instead of a literal, comparing one property against another on the same model.

### EqualTo (peer field)
Field must equal another field — confirm-style checks.

```csharp
ClientRule(m => m.ConfirmEmail)
    .EqualTo(m => m.Email, "Emails must match.");
```

### NotEqualTo (peer field)
Field must differ from another field.

```csharp
ClientRule(m => m.SecondaryContact)
    .NotEqualTo(m => m.PrimaryContact, "Contacts must be different people.");
```

### GreaterThan (peer field)
Field must be greater than another field. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.DischargeDate)
    .GreaterThan(m => m.AdmissionDate, "Discharge must be after admission.");
```

### GreaterThanOrEqualTo (peer field)
Field must be `>=` another field. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.ReviewDate)
    .GreaterThanOrEqualTo(m => m.AdmissionDate, "Review cannot precede admission.");
```

### LessThan (peer field)
Field must be less than another field. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.DepositAmount)
    .LessThan(m => m.MonthlyBilling, "Deposit must be less than monthly billing.");
```

### LessThanOrEqualTo (peer field)
Field must be `<=` another field. `TValue` / `TValue?`.

```csharp
ClientRule(m => m.CopayAmount)
    .LessThanOrEqualTo(m => m.MonthlyBilling, "Copay cannot exceed monthly billing.");
```

## WhenField (conditional rules)

`WhenField*` wraps a block of rules; the rules apply on the client only when the
named field's value satisfies the condition (server-side it lowers to
FluentValidation `When`). Inside the block, declare `RuleFor` + `ClientRule` as usual.

### WhenField (truthy bool)
Apply rules when a boolean field is true (or any value is truthy).

```csharp
WhenField(m => m.IsVeteran, () =>
{
    RuleFor(m => m.VaId).NotEmpty();
    ClientRule(m => m.VaId)
        .Required("'VA ID' is required.");
});
```

### WhenField (equals value)
Apply rules when a field equals a specific value.

```csharp
WhenField(m => m.CareLevel, "Hospice", () =>
{
    ClientRule(m => m.HospiceProvider)
        .Required("Hospice provider is required.");
});
```

### WhenFieldNot (falsy bool)
Apply rules when a boolean field is false (or value is falsy).

```csharp
WhenFieldNot(m => m.HasEmergencyContact, () =>
{
    ClientRule(m => m.AlternateContact)
        .Required("Provide an alternate contact.");
});
```

### WhenFieldNot (not-equals value)
Apply rules when a field does not equal a value.

```csharp
WhenFieldNot(m => m.CareLevel, "Independent", () =>
{
    ClientRule(m => m.CarePlanNotes)
        .Required("Care-plan notes are required for assisted residents.");
});
```

### WhenFieldGt
Apply rules when a numeric field is greater than a value.

```csharp
WhenFieldGt(m => m.CareHoursPerDay, 8m, () =>
{
    ClientRule(m => m.SecondaryCaregiver)
        .Required("A secondary caregiver is required.");
});
```

### WhenFieldGte
Apply rules when a numeric field is `>=` a value.

```csharp
WhenFieldGte(m => m.Age, 18, () =>
{
    ClientRule(m => m.JobTitle)
        .Required("Adults must provide a job title.");
});
```

### WhenFieldLt
Apply rules when a numeric field is less than a value.

```csharp
WhenFieldLt(m => m.Age, 18, () =>
{
    ClientRule(m => m.GuardianName)
        .Required("Guardian name required for minors.");
});
```

### WhenFieldLte
Apply rules when a numeric field is `<=` a value.

```csharp
WhenFieldLte(m => m.MobilityScore, 3, () =>
{
    ClientRule(m => m.MobilityNotes)
        .Required("Add mobility notes for low-mobility residents.");
});
```

### WhenFieldNull
Apply rules when a field is null.

```csharp
WhenFieldNull(m => m.DischargeDate, () =>
{
    ClientRule(m => m.ActiveCarePlan)
        .Required("An active care plan is required while the resident is admitted.");
});
```

### WhenFieldNotNull
Apply rules when a field is not null.

```csharp
WhenFieldNotNull(m => m.DischargeDate, () =>
{
    ClientRule(m => m.DischargeSummary)
        .Required("A discharge summary is required once a discharge date is set.");
});
```

### WhenFieldEmpty
Apply rules when a string field is empty (`string?`).

```csharp
WhenFieldEmpty(m => m.Email, () =>
{
    ClientRule(m => m.Phone)
        .Required("Provide a phone number when no email is on file.");
});
```

### WhenFieldNotEmpty
Apply rules when a string field is non-empty (`string?`).

```csharp
WhenFieldNotEmpty(m => m.Email, () =>
{
    ClientRule(m => m.FullName)
        .Required("Name is required when an email is provided.");
});
```

### WhenFieldIn
Apply rules when a field's value is in a set.

```csharp
WhenFieldIn(m => m.CareLevel, new[] { "memory-care", "skilled-nursing" }, () =>
{
    ClientRule(m => m.FallRiskPlan)
        .Required("A fall-risk plan is required for high-acuity care.");
});
```

### WhenFieldNotIn
Apply rules when a field's value is not in a set.

```csharp
WhenFieldNotIn(m => m.PaymentSource, new[] { "Medicaid", "Medicare" }, () =>
{
    ClientRule(m => m.SelfPayDetails)
        .Required("Self-pay details are required.");
});
```

### WhenFieldBetween
Apply rules when a numeric field is inclusive-between two bounds.

```csharp
WhenFieldBetween(m => m.Bmi, 30m, 40m, () =>
{
    ClientRule(m => m.DietitianReview)
        .Required("A dietitian review is required for this BMI range.");
});
```

### WhenFieldContains
Apply rules when a string field contains a substring (`string?`).

```csharp
WhenFieldContains(m => m.Notes, "urgent", () =>
{
    ClientRule(m => m.Phone)
        .Required("Phone is required for urgent cases.");
});
```

### WhenFieldStartsWith
Apply rules when a string field starts with a prefix (`string?`).

```csharp
WhenFieldStartsWith(m => m.RoomNumber, "ICU-", () =>
{
    ClientRule(m => m.CriticalCarePlan)
        .Required("A critical-care plan is required for ICU rooms.");
});
```

### WhenFieldEndsWith
Apply rules when a string field ends with a suffix (`string?`).

```csharp
WhenFieldEndsWith(m => m.ContactEmail, "@statehealth.gov", () =>
{
    ClientRule(m => m.CaseworkerId)
        .Required("A caseworker ID is required for state-managed residents.");
});
```

### WhenFieldMatches
Apply rules when a string field matches a regex (`string?`).

```csharp
WhenFieldMatches(m => m.MedicaidId, @"^TX", () =>
{
    ClientRule(m => m.TexasWaiverForm)
        .Required("Texas residents require the waiver form.");
});
```

### WhenFieldMinLength
Apply rules when a string field reaches a minimum length (`string?`).

```csharp
WhenFieldMinLength(m => m.CarePlanNotes, 1, () =>
{
    ClientRule(m => m.ReviewingNurse)
        .Required("A reviewing nurse is required once notes are entered.");
});
```

### WhenFieldArrayContains
Apply rules when a collection field contains a specific item.

```csharp
WhenFieldArrayContains(m => m.Allergies, "penicillin", () =>
{
    ClientRule(m => m.AlternateAntibiotic)
        .Required("Specify an alternate antibiotic for penicillin allergy.");
});
```

## WhenFields (composite guards)

`WhenFields` builds a guard from `fields.Field(...)` comparisons and composes
them with `.And(...)`, `.Or(...)`, `.Not()`. The leaf comparisons mirror the
`WhenField*` operators: `Truthy`/`Falsy`, `Eq`/`Neq`, `Gt`/`Gte`/`Lt`/`Lte`,
`IsNull`/`NotNull`, `IsEmpty`/`NotEmpty`, `In`/`NotIn`, `Between`, `Contains`/
`StartsWith`/`EndsWith`/`Matches`/`MinLength`, `ArrayContains`.

### WhenFields And
Apply rules only when all leaf conditions hold.

```csharp
WhenFields(fields => fields
    .Field(m => m.TakesPainMedication).Truthy()
    .And(fields.Field(m => m.PainLevel).Gt(7m)),
    () =>
    {
        RuleFor(m => m.PainLocation)
            .NotEmpty()
            .WithMessage("'Pain Location' is required for severe pain.");
        ClientRule(m => m.PainLocation)
            .Required("'Pain Location' is required for severe pain.");
    });
```

### WhenFields Or
Apply rules when any leaf condition holds.

```csharp
WhenFields(fields => fields
    .Field(m => m.HasGuardian).Truthy()
    .Or(fields.Field(m => m.Age).Lt(18)),
    () =>
    {
        ClientRule(m => m.GuardianSignature)
            .Required("A guardian signature is required.");
    });
```

### WhenFields Not
Apply rules when a leaf condition does not hold.

```csharp
WhenFields(fields => fields
    .Field(m => m.HasInsurance).Truthy().Not(),
    () =>
    {
        ClientRule(m => m.PrivatePayPlan)
            .Required("A private-pay plan is required.");
    });
```

### WhenFields In / Between leaf comparisons
Leaf operators take literals; `In`/`NotIn` are params arrays, `Between` takes two bounds.

```csharp
WhenFields(fields => fields
    .Field(m => m.CareLevel).In("memory-care", "skilled-nursing")
    .And(fields.Field(m => m.Bmi).Between(30m, 40m)),
    () =>
    {
        ClientRule(m => m.NutritionConsult)
            .Required("A nutrition consult is required.");
    });
```

## Server-only conditions

The FluentValidation `When`/`Unless`/`WhenAsync`/`UnlessAsync` are overridden so
their bodies stay server-only — declaring a `ClientRule` inside one throws. Use
these for async, DB-touching, or otherwise non-deterministic rules that must not
reach the browser. Use `WhenField*` instead when you want the condition mirrored
on the client.

### When (server-only)
Rules inside run on the server only, gated by a predicate.

```csharp
When(m => m.IsNewResident, () =>
{
    RuleFor(m => m.Ssn)
        .Must(BeUniqueInDatabase)
        .WithMessage("This SSN is already on file.");
});
```

### Unless (server-only)
Inverse of `When` — rules run unless the predicate holds.

```csharp
Unless(m => m.PaymentSource == "PrivatePay", () =>
{
    RuleFor(m => m.MedicaidId)
        .MustAsync(VerifyWithStateRegistry)
        .WithMessage("Medicaid ID could not be verified.");
});
```

### When + Otherwise (server-only)
The server-only `When` returns a condition builder whose `Otherwise` body also stays server-only.

```csharp
When(m => m.IsRespiteStay, () =>
{
    RuleFor(m => m.RespiteEndDate).NotNull();
})
.Otherwise(() =>
{
    RuleFor(m => m.LongTermCarePlanId).NotEmpty();
});
```

### WhenAsync / UnlessAsync (server-only)
Async predicates keep their rules server-only.

```csharp
WhenAsync(async (m, ct) => await HasOpenAssessmentAsync(m.ResidentId, ct), () =>
{
    RuleFor(m => m.AssessmentLockToken).NotEmpty();
});
```

## Validate gate (HTTP pipeline)

### Validate
HTTP-request gate: run the named validation source against the form before sending. The type argument is the validator/metadata source; `formId` is the form container's DOM ID used for error display.

```csharp
Html.On(plan, t => t.Event("submit-intake"))
    .Then(p => p
        .Post("/sandbox/admission/step1")
        .Validate<Step1Validator>("step1-form")
        .Gather(g => g
            .Include(m => m.ResidentName)
            .Include(m => m.PrimaryDiagnosis))
        .Response(r => r
            .OnSuccess(s => s.Dispatch("step1-saved"))
            .OnError(400, e => e.ValidationErrors("step1-form"))));
```

## ValidationErrors (ShowValidationErrors reaction)

### ValidationErrors
Reaction that renders accumulated validation errors into the form container. Typically wired on an `OnError(400, ...)` route so a server `400` validation response surfaces in the same summary slot as client rules.

```csharp
Html.On(plan, t => t.Event("submit-screening"))
    .Then(p => p
        .Post("/sandbox/admission/step4")
        .Validate<Step4Validator>("screening-form")
        .Gather(g => g
            .Include(m => m.EmergencyContact))
        .Response(r => r
            .OnSuccess(s => s.Dispatch("screening-saved"))
            .OnError(400, e => e
                .ValidationErrors("screening-form"))));
```

</script>
<script type="text/markdown" data-area="app-level">
# app-level

The page-wide service objects: **NativeDrawer**, **NativeLoader**, **FusionToast**,
**FusionConfirm**, and the per-link **NativeActionLink**. The first four are
*singletons* — one instance per page, each with a fixed well-known element id, so you
reference them with the **no-argument** `Component<T>()` overload (no model expression,
no id). `NativeActionLink` is a per-link component (its own generated id) rendered
through an `Html` factory, not a pipeline `Component<T>()` call.

These are ordinary browser objects: typed properties you set and methods you call, all
reached through `ComponentRef<TComponent, TModel>` inside a reactive pipeline. Every
verb below emits a **sync** reaction (a property `set` or a method `call`) — there is no
async lane here; the async lane belongs to the HTTP pipeline these services decorate.

Every workflow is attached the finalized way — **`Html.On(plan, t => t.Trigger(...))`**,
the single-lambda attach. The trigger carries its own pipeline (`t.PageLoad(p => ...)`,
`t.Event("name", p => ...)`); a guarded workflow uses the **flat** `.Confirm("...").Then(p => ...)`
form. All samples are TALL: one fluent call per line, read top-to-bottom.

Finalized names used throughout (from `09-dsl-naming-sheet.md`): drawer `SetSize` over the
`DrawerSize` enum (`DrawerPosition` is **deleted**); loader `SetAutoHide` (was `SetTimeout`);
toast `SetMessage` (was `SetContent`) and `SetDuration` (was `SetTimeout`), severities
`Success`/`Warning`/`Danger`/`Info` (the `ToastType`/`ToastPosition` enums are **deleted**);
confirm `SetMessage` (was `SetContent`) and the renderer `@Html.FusionConfirm()` (was
`FusionConfirmDialog`); action-link `CssClass`/`Attr`; the surface `Confirm` guard
(plan term `ConfirmGuard`, wire `kind:"confirm"`).

---

## Referencing an app-level service

### Component&lt;T&gt;() — the no-argument app-level overload

Resolves a layout-owned singleton (Drawer, Loader, Toast, Confirm) by its `DefaultId` —
no model expression, no explicit id. This is **the** way every chain below begins.

```csharp
Html.On(plan, t => t
    .Event("open-resident-drawer", p => p
        .Component<NativeDrawer>()
            .Open()));
```

It works from every pipeline scope — the page-load pipeline, an event pipeline, an HTTP
`WhileLoading` lane, and the `OnSuccess` / `OnError` response scopes:

```csharp
Html.On(plan, t => t
    .Event("save-resident", p => p
        .Post("/Sandbox/Residents/Create", g => g
            .IncludeAll())
        .WhileLoading(loading => loading
            .Component<NativeLoader>()
                .Show())
        .Response(r => r
            .OnSuccess(s => s
                .Component<NativeLoader>()
                    .Hide())
            .OnError(e => e
                .Component<NativeLoader>()
                    .Hide()))));
```

> The other `Component<T>(...)` overloads — `Component<T>(expr)`, `Component<T, TOtherModel>(expr)`,
> `Component<T>(id)` — identify *model-bound* components and are catalogued in the
> components area. App-level singletons use only the no-arg form.

---

## NativeDrawer

The slide-out side panel. One per page; render `@Html.NativeDrawer()` once in the
layout. Symmetric `Open` / `Close`, plus `SetSize`.

### Open

Makes the drawer visible (adds the visible class, clears `aria-hidden`).

```csharp
Html.On(plan, t => t
    .Event("admit-resident", p => p
        .Component<NativeDrawer>()
            .Open()));
```

### Close

Hides the panel.

```csharp
Html.On(plan, t => t
    .Event("cancel-admission", p => p
        .Component<NativeDrawer>()
            .Close()));
```

### SetSize

Sets the panel width to `Sm`, `Md`, or `Lg` (the `DrawerSize` enum). Chains naturally
before `Open` so the drawer is sized as it appears.

```csharp
Html.On(plan, t => t
    .Event("open-quick-note", p => p
        .Component<NativeDrawer>()
            .SetSize(DrawerSize.Sm)
            .Open()));
```

```csharp
Html.On(plan, t => t
    .Event("open-assessment", p => p
        .Component<NativeDrawer>()
            .SetSize(DrawerSize.Md)
            .Open()));
```

```csharp
Html.On(plan, t => t
    .Event("open-full-care-plan", p => p
        .Component<NativeDrawer>()
            .SetSize(DrawerSize.Lg)
            .Open()));
```

> `DrawerSize` variants: `Sm`, `Md` (default), `Lg`. The `DrawerPosition` enum is
> deleted in the rewrite — dead, no setter consumed it.

### Close from the drawer's own close button

The close button dispatches; a workflow listens and closes — symmetric with the
opener event.

```csharp
Html.On(plan, t => t
    .DispatchFrom("alis-drawer-close", p => p
        .Component<NativeDrawer>()
            .Close()));
```

### Drawer holding a posted form — full four-service composition

The drawer commonly holds an injected form partial that posts, shows the loader, then
toasts and closes the drawer on success — the canonical Drawer + Loader + Toast + Validate pattern.

```csharp
Html.On(plan, t => t
    .Event("save-resident", p => p
        .Post("/Sandbox/Components/Drawer/SubmitResident", g => g
            .IncludeAll())
        .Validate<DrawerResidentValidator>("drawer-resident-form")
        .WhileLoading(loading => loading
            .Component<NativeLoader>()
                .SetTarget("drawer-resident-form")
                .SetAutoHide(1000)
                .Show())
        .Response(r => r
            .OnSuccess(s => s
                .Component<NativeLoader>()
                    .Hide()
                .Component<FusionToast>()
                    .SetTitle("Admission")
                    .SetMessage("Resident saved successfully")
                    .Success()
                    .Show()
                .Component<NativeDrawer>()
                    .Close())
            .OnError(400, e => e
                .Component<NativeLoader>()
                    .Hide()
                .ShowValidationErrors("drawer-resident-form")))));
```

## NativeLoader

The loading overlay. One per page; render `@Html.NativeLoader()` once in the layout.
Covers the whole viewport by default, or a target container via `SetTarget`. Symmetric
`Show` / `Hide`, plus `SetTarget` and `SetAutoHide`.

### Show

Reveals the overlay (adds the visible class, clears `aria-hidden`).

```csharp
Html.On(plan, t => t
    .Event("refresh-roster", p => p
        .Component<NativeLoader>()
            .Show()));
```

### Hide

Hides the overlay (removes the visible class, sets `aria-hidden="true"`).

```csharp
Html.On(plan, t => t
    .Event("roster-loaded", p => p
        .Component<NativeLoader>()
            .Hide()));
```

### SetTarget

Moves the loader inside a container so it covers only that element. Without it, the
loader covers the entire viewport. Chains before `Show`.

```csharp
Html.On(plan, t => t
    .Event("recalculate-billing", p => p
        .Component<NativeLoader>()
            .SetTarget("billing-summary-panel")
            .Show()));
```

### SetAutoHide

Sets an auto-hide timeout (milliseconds) so the loader disappears on its own after the
duration — a safety net around a request. Renamed from `SetTimeout`, which collided with
JS `setTimeout` and the Toast timer.

```csharp
Html.On(plan, t => t
    .Event("export-assessments", p => p
        .Component<NativeLoader>()
            .SetTarget("assessment-grid")
            .SetAutoHide(1000)
            .Show()));
```

### Page-load loader for the initial roster fetch

A loader can bracket a `PageLoad` request just as well as an event-driven one.

```csharp
Html.On(plan, t => t
    .PageLoad(p => p
        .Get("/Sandbox/Residents/Roster", g => g
            .IncludeAll())
        .WhileLoading(loading => loading
            .Component<NativeLoader>()
                .SetTarget("roster-grid")
                .Show())
        .Response(r => r
            .OnSuccess(s => s
                .Component<NativeLoader>()
                    .Hide())
            .OnError(e => e
                .Component<NativeLoader>()
                    .Hide()))));
```

### Loader bracketing an HTTP request — full pattern

`Show` during the in-flight window, `Hide` on every settled outcome.

```csharp
Html.On(plan, t => t
    .Event("recalculate-billing", p => p
        .Post("/Sandbox/Billing/Recalculate", g => g
            .IncludeAll())
        .WhileLoading(loading => loading
            .Component<NativeLoader>()
                .SetTarget("billing-summary-panel")
                .Show())
        .Response(r => r
            .OnSuccess(s => s
                .Component<NativeLoader>()
                    .Hide()
                .Element("billing-summary-panel")
                    .SetText("Billing updated"))
            .OnError(e => e
                .Component<NativeLoader>()
                    .Hide()))));
```

## FusionToast

The corner notification, backed by Syncfusion Toast. One per page; render
`@Html.FusionToast()` once in the layout. You set title/message, pick a severity, tune
display options, then `Show`. `Hide` dismisses programmatically.

### SetTitle

Sets the toast heading.

```csharp
Html.On(plan, t => t
    .Event("resident-admitted", p => p
        .Component<FusionToast>()
            .SetTitle("Admission")
            .SetMessage("Resident admitted to Memory Care")
            .Success()
            .Show()));
```

### SetMessage

Sets the toast body text (the SF `content` prop). Renamed from `SetContent` so
"content" no longer means two things across services.

```csharp
Html.On(plan, t => t
    .Event("assessment-saved", p => p
        .Component<FusionToast>()
            .SetMessage("Care assessment saved")
            .Success()
            .Show()));
```

### Success severity

A completed action. One severity verb per toast.

```csharp
Html.On(plan, t => t
    .Event("resident-saved", p => p
        .Component<FusionToast>()
            .SetTitle("Saved")
            .SetMessage("Resident record saved")
            .Success()
            .Show()));
```

### Warning severity

Needs attention but not blocking.

```csharp
Html.On(plan, t => t
    .Event("care-plan-stale", p => p
        .Component<FusionToast>()
            .SetTitle("Review Due")
            .SetMessage("This care plan is overdue for review")
            .Warning()
            .Show()));
```

### Danger severity

A failure or hard stop.

```csharp
Html.On(plan, t => t
    .Event("billing-failed", p => p
        .Component<FusionToast>()
            .SetTitle("Billing Error")
            .SetMessage("Could not post charges to the resident ledger")
            .Danger()
            .Show()));
```

### Info severity

Neutral status.

```csharp
Html.On(plan, t => t
    .Event("sync-started", p => p
        .Component<FusionToast>()
            .SetTitle("Syncing")
            .SetMessage("Facility roster is syncing in the background")
            .Info()
            .Show()));
```

> The severity verbs are the real severity vocabulary; the orphan `ToastType` enum is
> deleted. Pick exactly one per toast.

### SetDuration

Sets how long the toast stays visible, in milliseconds (the SF `timeOut` prop). Renamed
from `SetTimeout` — it is a display duration, not a scheduler. `0` keeps it up until
dismissed.

```csharp
Html.On(plan, t => t
    .Event("med-pass-reminder", p => p
        .Component<FusionToast>()
            .SetTitle("Reminder")
            .SetMessage("Evening med pass starts in 15 minutes")
            .Info()
            .SetDuration(8000)
            .Show()));
```

### Sticky toast — stays until closed

`SetDuration(0)` with a close button.

```csharp
Html.On(plan, t => t
    .Event("incident-reported", p => p
        .Component<FusionToast>()
            .SetTitle("Incident Logged")
            .SetMessage("Fall incident requires supervisor sign-off")
            .Danger()
            .SetDuration(0)
            .ShowCloseButton()
            .Show()));
```

### ShowCloseButton

Adds the dismiss "×" to the toast. No-argument toggle (sets the SF flag true).

```csharp
Html.On(plan, t => t
    .Event("policy-updated", p => p
        .Component<FusionToast>()
            .SetTitle("Policy")
            .SetMessage("Visitation policy was updated")
            .Info()
            .ShowCloseButton()
            .Show()));
```

### ShowProgressBar

Adds the countdown progress bar to the toast. No-argument toggle.

```csharp
Html.On(plan, t => t
    .Event("auto-logout-warning", p => p
        .Component<FusionToast>()
            .SetTitle("Session")
            .SetMessage("You will be signed out shortly")
            .Warning()
            .SetDuration(10000)
            .ShowProgressBar()
            .Show()));
```

### Show

Binds the configured props (`dataBind`) and displays the toast. Always the terminal call.

```csharp
Html.On(plan, t => t
    .Event("note-added", p => p
        .Component<FusionToast>()
            .SetMessage("Care note added")
            .Success()
            .Show()));
```

### Hide

Programmatically dismisses the visible toast(s).

```csharp
Html.On(plan, t => t
    .Event("dismiss-notifications", p => p
        .Component<FusionToast>()
            .Hide()));
```

### Full toast — every option together

```csharp
Html.On(plan, t => t
    .Event("admission-complete", p => p
        .Component<FusionToast>()
            .SetTitle("Admission Complete")
            .SetMessage("Eleanor Hayes admitted to Assisted Living, Room 214")
            .Success()
            .SetDuration(6000)
            .ShowCloseButton()
            .ShowProgressBar()
            .Show()));
```

### Toast on HTTP success and error

```csharp
Html.On(plan, t => t
    .Event("save-care-plan", p => p
        .Post("/Sandbox/CarePlans/Save", g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Component<FusionToast>()
                    .SetTitle("Saved")
                    .SetMessage("Care plan saved")
                    .Success()
                    .Show())
            .OnError(e => e
                .Component<FusionToast>()
                    .SetTitle("Save failed")
                    .SetMessage("The care plan could not be saved")
                    .Danger()
                    .Show()))));
```

## FusionConfirm

The confirm dialog *service object*, backed by Syncfusion Dialog. One per page; render
`@Html.FusionConfirm()` once in the layout. You set the message and `Show` / `Hide`
the dialog as a service.

> This is distinct from the **`Confirm` guard** (below): `FusionConfirm` is the dialog
> object you imperatively drive; `.Confirm("...")` is the user-decision async guard that
> *gates* a pipeline. They cooperate but are different surfaces.

### SetMessage

Sets the confirmation prompt text (the SF `content` prop, followed by `dataBind`).
Renamed from `SetContent` so "content" no longer means two things across services.

```csharp
Html.On(plan, t => t
    .Event("ask-discharge", p => p
        .Component<FusionConfirm>()
            .SetMessage("Discharge this resident from the facility?")
            .Show()));
```

### Show

Opens the confirm dialog.

```csharp
Html.On(plan, t => t
    .Event("confirm-medication-change", p => p
        .Component<FusionConfirm>()
            .SetMessage("Apply the new medication schedule to this resident?")
            .Show()));
```

### Hide

Closes the confirm dialog programmatically.

```csharp
Html.On(plan, t => t
    .Event("dismiss-confirm", p => p
        .Component<FusionConfirm>()
            .Hide()));
```

### The flat `.Confirm` guard — gating a pipeline (cross-area)

The user-decision async guard `.Confirm(message)` (plan term `ConfirmGuard`, wire
`kind:"confirm"`) pauses the pipeline until the user decides; only on "yes" does the
`.Then(...)` branch run. The finalized form is **flat** — `Html.On(...).Confirm("...").Then(p => ...)`
— not a nested `When(p.Confirm(...))`. Use it to protect destructive operations.

```csharp
Html.On(plan, t => t.DispatchFrom("discharge-resident"))
    .Confirm("Discharge this resident? This cannot be undone.")
    .Then(p => p
        .Set(m => m.ResidentStatus, "Discharged")
        .Dispatch("resident-discharged"));
```

### Confirm guard before a destructive HTTP delete

The guarded `.Then(...)` branch is a full pipeline — request, response scopes, and
app-level toasts all compose inside it.

```csharp
Html.On(plan, t => t.DispatchFrom("delete-care-plan"))
    .Confirm("Delete this care plan permanently?")
    .Then(p => p
        .Delete("/Sandbox/CarePlans/Active", g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Component<FusionToast>()
                    .SetTitle("Deleted")
                    .SetMessage("Care plan deleted")
                    .Warning()
                    .Show())));
```

---

## NativeActionLink

A per-link anchor (`<a>`) that carries a reactive pipeline in a `data-reactive-link`
payload — the row-action / inline-link primitive. Rendered through the
`Html.NativeActionLink(...)` factory, **not** a pipeline `Component<T>()` call. It has
its own generated id; the pipeline you pass fires when the link is clicked. The returned
builder appends presentation via `CssClass` and `Attr`.

### Html.NativeActionLink — link text, url, pipeline

The factory takes the visible text, the `href`, and the reactive pipeline to run.

```csharp
@(Html.NativeActionLink(
    "View Care Plan",
    Url.Action("CarePlan", "Residents", new { id = Model.ResidentId }),
    p => p
        .Component<NativeDrawer>()
            .SetSize(DrawerSize.Lg)
            .Open()))
```

### CssClass

Sets the anchor's `class` attribute. Builder method, chained on the factory result.

```csharp
@(Html.NativeActionLink(
    "Reassign Caregiver",
    Url.Action("Reassign", "Assignments", new { id = Model.AssignmentId }),
    p => p
        .Component<NativeDrawer>()
            .SetSize(DrawerSize.Md)
            .Open())
    .CssClass("text-sm font-medium text-primary hover:underline"))
```

### Attr

Adds an arbitrary HTML attribute to the anchor (ARIA, `data-*`, `title`). Reserved
attributes (`id`, `href`, `data-reactive-link`) are rejected; `class` routes to
`CssClass`. Multiple `Attr` calls chain.

```csharp
@(Html.NativeActionLink(
    "Print Assessment",
    Url.Action("Print", "Assessments", new { id = Model.AssessmentId }),
    p => p
        .Component<NativeLoader>()
            .SetTarget("assessment-grid")
            .SetAutoHide(1500)
            .Show())
    .CssClass("btn-link")
    .Attr("title", "Open the printable care assessment")
    .Attr("aria-label", "Print care assessment")
    .Attr("data-resident-id", Model.ResidentId.ToString()))
```

### NativeActionLink driving an HTTP request — full pattern

The link's pipeline is a full reactive pipeline: gather, request, response scopes, and
app-level service calls all compose inside it.

```csharp
@(Html.NativeActionLink(
    "Recalculate Billing",
    Url.Action("Billing", "Residents", new { id = Model.ResidentId }),
    p => p
        .Post("/Sandbox/Billing/Recalculate", g => g
            .Literal("residentId", Model.ResidentId))
        .WhileLoading(loading => loading
            .Component<NativeLoader>()
                .SetTarget("billing-summary-panel")
                .Show())
        .Response(r => r
            .OnSuccess(s => s
                .Component<NativeLoader>()
                    .Hide()
                .Component<FusionToast>()
                    .SetTitle("Billing")
                    .SetMessage("Ledger recalculated")
                    .Success()
                    .Show())
            .OnError(e => e
                .Component<NativeLoader>()
                    .Hide()
                .Component<FusionToast>()
                    .SetTitle("Billing Error")
                    .SetMessage("Recalculation failed")
                    .Danger()
                    .Show())))
    .CssClass("text-sm text-primary hover:underline"))
```

## Layout renderers (call once, in `_Layout.cshtml`)

Each singleton service ships a one-line layout renderer that emits its hidden host
element. Render once; the reactive pipelines above drive it. Renderer name == type name
for every service (the old `FusionConfirmDialog` spelling is dropped).

```cshtml
@* The slide-out drawer host *@
@Html.NativeDrawer()

@* The loading overlay host *@
@Html.NativeLoader()

@* The corner toast host (Syncfusion Toast, bottom-right) *@
@Html.FusionToast()

@* The confirm dialog host (Syncfusion Dialog) *@
@Html.FusionConfirm()
```

<script type="text/markdown" data-area="plugins">
# plugins

The plugin escape hatch lets a reactive plan reach a browser object the typed
component DSL does not model — `URL`, `localStorage`, a charting library, native
JS array helpers, a slugifier. A plugin is the *intentional* stringly boundary:
the plugin name and member names may be strings, but every argument and every
read stays typed through `TypedSource<T>` and the shared `ValueExpression` spine.

The flow has three parts:

1. **Declare** the plugin's member contract once — `plan.RegisterPlugin`, either
   inline with `PluginTypeBuilder` or as a reusable `Plugin` subclass exposing
   `PluginFunction`/`PluginCommand`/`PluginProperty` descriptors.
2. **Read** a plugin value anywhere a `TypedSource<T>` is allowed — conditions,
   reaction sets, gather payloads/headers/route-params, dispatch payloads, even
   as an `Arg` to another plugin call (nesting). `p.Plugin<T>(...)` returns a
   `PluginReadBuilder<TReturn,TModel>` that implicitly converts to
   `TypedPluginSource<TReturn>`; `p.PluginProperty<T>(...)` returns a
   `TypedPluginPropertySource<T>`.
3. **Call** a void plugin command for its side effect — `p.Plugin(...)` returns a
   `PluginCallBuilder<TModel>`; add args, then `.Fire()` emits the call.

Three member kinds, named by lane:

| Member kind | Returns | Read/Call lane | Descriptor | Source produced |
|-------------|---------|----------------|------------|-----------------|
| `Function` | a typed value | READ | `PluginFunction<TReturn>` | `TypedPluginSource<TReturn>` |
| `Property` | a typed value | READ | `PluginProperty<TValue>` | `TypedPluginPropertySource<TValue>` |
| `Command` | nothing (void) | CALL → `.Fire()` | `PluginCommand` | (none — side effect) |

`PluginMember` is the abstract supertype of `Function`/`Command`/`Property` —
they are all *members* of the plugin object, so the supertype reads as their
honest union. A member may also be the plugin's **root** call (no member name) —
the whole plugin is invoked as one function/command.

`Function`/`Command`/`Property` share one name per concept: value-op is always
`Function`, void-op is always `Command`, read-op is always `Property`. There are
no synonyms (`Method`/`Void` are retired).

Naming note: the read face is `PluginReadBuilder<TReturn,TModel>` (not
`PluginMemberBuilder`) — `Read` names the load-bearing lane, paired against the
void-CALL face `PluginCallBuilder<TModel>`. `Arg` glosses over literal/source/
payload value spines; `ArgValue<TValue>` is the generic-shaped literal variant.

---

## RegisterPlugin — declare the member contract

A plugin must be registered before any `p.Plugin(...)` reference. Three
registration entry points; pick by how the contract is authored.

### RegisterPlugin (inline PluginTypeBuilder)

Declare the members inline with a configure lambda — no separate class.

```csharp
plan.RegisterPlugin("storage", p => p
    .Function<string>("getItem", a => a
        .Arg<string>())
    .Command("setItem", a => a
        .Arg<string>()
        .Arg<string>())
    .Command("removeItem", a => a
        .Arg<string>()));
```

### RegisterPlugin (typed Plugin instance)

Build a `Plugin` subclass, then hand the instance to `RegisterPlugin`.

```csharp
var slugify = new SlugifyPlugin();
plan.RegisterPlugin(slugify);
```

### RegisterPlugin\<TPlugin\> — construct and register

Construct the `Plugin` subclass and register it in one call; the returned
instance exposes the typed descriptors for `p.Plugin(descriptor)` reads.

```csharp
var array = plan.RegisterPlugin<ArrayPlugin>();
var analytics = plan.RegisterPlugin<AnalyticsPlugin>();
var slugify = plan.RegisterPlugin<SlugifyPlugin>();
```

---

## PluginTypeBuilder — inline member declaration

The fluent declarer passed to `plan.RegisterPlugin("name", p => ...)`. Argument
arity is declared once through the args builder (`a => a.Arg<string>()`), never
through arity-specific overloads. Every call returns the builder for chaining.

### Function\<T\>(name) — value method, open args

A method returning a typed value; the shape is inferred from `T`. With no args
contract, arguments are open.

```csharp
plan.RegisterPlugin("careLevel", p => p
    .Function<string>("describe"));
```

### Function\<TReturn\>(name, arguments) — value method, exact args

Declare the exact JS argument contract with the args builder.

```csharp
plan.RegisterPlugin("billing", p => p
    .Function<decimal>("monthlyRate", a => a
        .Arg<string>()
        .Arg<int>()));
```

### Function\<T\>() — root value function, open args

The plugin object itself is callable as a value function (no member name).

```csharp
plan.RegisterPlugin("slugify", p => p
    .Function<string>());
```

### Function\<TReturn\>(arguments) — root value function, exact args

Root function with an exact argument contract.

```csharp
plan.RegisterPlugin("slugify", p => p
    .Function<string>(a => a
        .Arg<string>()));
```

### Property\<T\>(name) — readable object property

A readable property on the plugin object; shape inferred from `T`. Read via
`p.PluginProperty<T>(...)`.

```csharp
plan.RegisterPlugin("session", p => p
    .Property<string>("facilityId")
    .Property<bool>("isAdmin"));
```

### Command(name) — void method, open args

A side-effecting method that returns nothing. `Command` is the only name for
void-ops (the retired `Void` synonym is gone).

```csharp
plan.RegisterPlugin("analytics", p => p
    .Command("track"));
```

### Command(name, arguments) — void method, exact args

Void method with an exact argument contract.

```csharp
plan.RegisterPlugin("analytics", p => p
    .Command("track", a => a
        .Arg<string>()
        .Arg<int>()));
```

### Command() — root void command, open args

The plugin object itself is callable as a void command.

```csharp
plan.RegisterPlugin("refreshWidgets", p => p
    .Command());
```

### Command(arguments) — root void command, exact args

Root command with an exact argument contract.

```csharp
plan.RegisterPlugin("reloadPage", p => p
    .Command(a => a
        .Arg<bool>()));
```

### Mixed members — properties, functions, and commands together

A single builder declares every member kind. A name may not be declared as both
a property and a function on the same plugin.

```csharp
plan.RegisterPlugin("careAnalytics", p => p
    .Property<string>("facilityId")
    .Property<int>("residentCount")
    .Function<decimal>("averageBilling", a => a
        .Arg<string>())
    .Function<bool>("hasCritical", a => a
        .Arg<object>())
    .Command("track", a => a
        .Arg<string>()));
```

---

## Plugin subclass — reusable typed descriptors

Subclass `Plugin`, name it in the base constructor, and declare members in the
body. Each declaration returns a strongly-typed descriptor (`PluginFunction<T>`,
`PluginCommand`, `PluginProperty<T>`) you expose as a property so reads can pass
the descriptor directly (`p.Plugin(array.Count)`) instead of a string pair.

### Function\<TReturn\>(member) + .Arg\<TArg\>() — typed value member

Inside the body, declare a value function and chain `.Arg<T>()` per JS argument.

```csharp
private sealed class ArrayPlugin : Plugin
{
    public ArrayPlugin()
        : base("array")
    {
        Count = Function<int>("count")
            .Arg<object>();
        Pluck = Function<object>("pluck")
            .Arg<object>()
            .Arg<int>()
            .Arg<string>();
        Filter = Function<object>("filter")
            .Arg<object>()
            .Arg<string>()
            .Arg<string>();
        Sum = Function<int>("sum")
            .Arg<object>()
            .Arg<string>();
        Some = Function<bool>("some")
            .Arg<object>()
            .Arg<string>()
            .Arg<string>();
    }

    public PluginFunction<int> Count { get; }
    public PluginFunction<object> Pluck { get; }
    public PluginFunction<object> Filter { get; }
    public PluginFunction<int> Sum { get; }
    public PluginFunction<bool> Some { get; }
}
```

### Function\<TReturn\>(member, arguments) — value member, exact args block

Declare the whole argument contract in one `.Args(...)` block instead of chained
`.Arg<T>()` calls.

```csharp
private sealed class BillingPlugin : Plugin
{
    public BillingPlugin()
        : base("billing")
    {
        MonthlyRate = Function<decimal>("monthlyRate", a => a
            .Arg<string>()
            .Arg<int>());
    }

    public PluginFunction<decimal> MonthlyRate { get; }
}
```

### Function\<TReturn\>() — root value function

The plugin is invoked as a value function with no member name.

```csharp
private sealed class SlugifyPlugin : Plugin
{
    public SlugifyPlugin()
        : base("slugify")
    {
        Slug = Function<string>()
            .Arg<string>();
    }

    public PluginFunction<string> Slug { get; }
}
```

### Command(member) + .Arg\<TArg\>() — typed void member

Declare a side-effecting command; chain `.Arg<T>()` per JS argument.

```csharp
private sealed class AnalyticsPlugin : Plugin
{
    public AnalyticsPlugin()
        : base("analytics")
    {
        Track = Command("track")
            .Arg<string>();
    }

    public PluginCommand Track { get; }
}
```

### Command(member, arguments) — void member, exact args block

The command's argument contract declared in one `.Args(...)` block.

```csharp
private sealed class AuditPlugin : Plugin
{
    public AuditPlugin()
        : base("audit")
    {
        Record = Command("record", a => a
            .Arg<string>()
            .Arg<string>());
    }

    public PluginCommand Record { get; }
}
```

### Command() — root void command

The plugin is invoked as a void command with no member name.

```csharp
private sealed class RefreshPlugin : Plugin
{
    public RefreshPlugin()
        : base("refreshWidgets")
    {
        Refresh = Command();
    }

    public PluginCommand Refresh { get; }
}
```

### Property\<TValue\>(member) — readable object property

A readable property descriptor; pass to `p.Plugin(session.FacilityId)`.

```csharp
private sealed class SessionPlugin : Plugin
{
    public SessionPlugin()
        : base("session")
    {
        FacilityId = Property<string>("facilityId");
        IsAdmin = Property<bool>("isAdmin");
    }

    public PluginProperty<string> FacilityId { get; }
    public PluginProperty<bool> IsAdmin { get; }
}
```

### .Args(arguments) — append exact arg contract to a descriptor

`.Args(...)` (on `PluginFunction`/`PluginCommand`) appends an exact JS argument
contract without an arity-specific overload — the same as the `(member, args)`
form, available as a chained terminal.

```csharp
private sealed class ReportPlugin : Plugin
{
    public ReportPlugin()
        : base("report")
    {
        Generate = Function<string>("generate")
            .Args(a => a
                .Arg<string>()
                .Arg<DateTime>());
    }

    public PluginFunction<string> Generate { get; }
}
```

## PluginReadBuilder — read a plugin value (`p.Plugin<T>` / `.Plugin(descriptor)`)

`p.Plugin<T>(...)` returns `PluginReadBuilder<TReturn,TModel>`. The source *is*
the builder: it implicitly converts to `TypedPluginSource<TReturn>`, so there is
no explicit `Build()` — just assign it to a `TypedPluginSource<T>` or pass it
straight where a source is expected.

### Plugin\<T\>(pluginName, member) — read a named function by strings

The stringly entry: read a plugin function's return value by plugin + member
name. The plugin must be registered first.

```csharp
Html.On(plan, t => t.PageLoad(p =>
    p.Get("/Sandbox/Plugins/Residents")
     .Response(r => r.OnSuccess<ResidentsListResponse>((json, s) =>
     {
         TypedPluginSource<int> total = p.Plugin<int>("array", "count")
             .Arg(json, x => x.Items);
         s.Element("arr-total").SetText(total);
     }))));
```

### Plugin\<T\>(pluginName) — read the root function by string

Read the plugin's root function (no member name).

```csharp
Html.On(plan, t => t.PageLoad(p =>
{
    TypedPluginSource<string> slug = p.Plugin<string>("slugify")
        .Arg("Sunrise Memory Care");
    p.Element("facility-slug").SetText(slug);
}));
```

### Plugin\<T\>(function) — read a declared function descriptor

Pass the typed `PluginFunction<T>` descriptor from a registered `Plugin`
subclass — fully typed, no strings at the call site.

```csharp
var array = plan.RegisterPlugin<ArrayPlugin>();

Html.On(plan, t => t.PageLoad(p =>
    p.Get("/Sandbox/Plugins/Residents")
     .Response(r => r.OnSuccess<ResidentsListResponse>((json, s) =>
     {
         TypedPluginSource<int> total = p.Plugin(array.Count)
             .Arg(json, x => x.Items);
         s.Element("arr-total").SetText(total);
     }))));
```

### PluginProperty\<T\>(pluginName, member) — read a property by strings

Read a plugin object property by plugin + member name; returns
`TypedPluginPropertySource<T>` directly (no args, no builder).

```csharp
Html.On(plan, t => t.PageLoad(p =>
{
    TypedPluginPropertySource<string> facility =
        p.PluginProperty<string>("session", "facilityId");
    p.Element("active-facility").SetText(facility);
}));
```

### Plugin\<T\>(property) — read a declared property descriptor

Pass the typed `PluginProperty<T>` descriptor from a `Plugin` subclass.

```csharp
var session = plan.RegisterPlugin<SessionPlugin>();

Html.On(plan, t => t.PageLoad(p =>
{
    TypedPluginPropertySource<bool> isAdmin = p.Plugin(session.IsAdmin);
    p.When(isAdmin).Truthy()
        .Then(then => then
            .Element("admin-panel").Show());
}));
```

## PluginReadBuilder.Arg — typed arguments to a plugin read

Every `Arg` lowers to a `ValueExpression` over the shared value spine, and is
contract-checked against the declared argument shape. One `Arg` gloss spans
literals, typed sources, response bodies, and event payloads.

### .Arg\<TArg\>(source) — a typed source argument

Pass any `TypedSource<T>` — a component read, URL param, another plugin read.
This is how plugin reads **nest**: the result of one read feeds the next.

```csharp
Html.On(plan, t => t.PageLoad(p =>
    p.Get("/Sandbox/Plugins/Residents")
     .Response(r => r.OnSuccess<ResidentsListResponse>((json, s) =>
     {
         TypedPluginSource<object> active = p.Plugin(array.Filter)
             .Arg(json, x => x.Items)
             .Arg("status")
             .Arg("active");

         TypedPluginSource<int> activeCount = p.Plugin(array.Count)
             .Arg(active);

         s.Element("arr-active-count").SetText(activeCount);
     }))));
```

### .Arg\<TResponse, TProp\>(body, path) — a response-body argument

Read a property off the success/error response body and pass it as an argument;
the source carries the response scope.

```csharp
Html.On(plan, t => t.PageLoad(p =>
    p.Get("/Sandbox/Plugins/Residents")
     .Response(r => r.OnSuccess<ResidentsListResponse>((json, s) =>
     {
         TypedPluginSource<int> sum = p.Plugin(array.Sum)
             .Arg(json, x => x.Items)
             .Arg("age");
         s.Element("arr-total-age").SetText(sum);
     }))));
```

### .Arg\<TArgs, TProp\>(args, path) — an event-payload argument

Read a property off the event args and pass it as an argument.

```csharp
Html.SearchBox(plan, m => m.Query)
    .Reactive(plan, evt => evt.Input, (args, p) =>
    {
        TypedPluginSource<string> slug = p.Plugin(slugify.Slug)
            .Arg(args, e => e.Value);
        p.Element("query-slug").SetText(slug);
    });
```

### .Arg(string) — a string literal argument

A literal string argument.

```csharp
TypedPluginSource<string> slug = p.Plugin(slugify.Slug)
    .Arg("Sunrise Memory Care");
```

### .Arg(int) — an int literal argument

```csharp
TypedPluginSource<object> first = p.Plugin(array.Pluck)
    .Arg(json, x => x.Items)
    .Arg(0)
    .Arg("name");
```

### .Arg(bool) — a bool literal argument

```csharp
TypedPluginSource<string> report = p.Plugin(report.Generate)
    .Arg("billing")
    .Arg(true);
```

### .Arg(long) — a long literal argument

```csharp
TypedPluginSource<string> token = p.Plugin<string>("auth", "signFor")
    .Arg(9007199254740991L);
```

### .Arg(decimal) — a decimal literal argument

```csharp
TypedPluginSource<string> formatted = p.Plugin<string>("currency", "format")
    .Arg(2400.50m);
```

### .Arg(double) — a double literal argument

```csharp
TypedPluginSource<string> pct = p.Plugin<string>("format", "percent")
    .Arg(0.875);
```

### .Arg(DateTime) — a DateTime literal argument

A `DateTime` literal, formatted for browser date comparison.

```csharp
TypedPluginSource<string> report = p.Plugin(report.Generate)
    .Arg("monthly")
    .Arg(new DateTime(2026, 1, 1));
```

### .ArgValue\<TValue\>(value) — a generic-shaped literal argument

The generic literal variant: the plan shape is derived from `TValue`. Use when
the literal type is a type parameter, not one of the concrete overloads.

```csharp
TypedPluginSource<string> code = p.Plugin<string>("careLevel", "encode")
    .ArgValue(CareLevel.MemoryCare);
```

## PluginCallBuilder.Fire — call a void plugin command

`p.Plugin(...)` (no `<T>`) returns `PluginCallBuilder<TModel>` for void commands.
It shares the same `Arg`/`ArgValue` surface as the read face. `.Fire()` is the
terminal — it emits the call reaction into the pipeline. Nothing happens until
`.Fire()`.

### Plugin(pluginName, member).Fire() — call a named command by strings

```csharp
Html.NativeButton("track-btn", "Track")
    .Reactive(plan, evt => evt.Click, (args, p) =>
    {
        p.Plugin("analytics", "track")
            .Arg("array-sent")
            .Fire();
    });
```

### Plugin(pluginName).Fire() — call the root command by string

```csharp
Html.NativeButton("reload-btn", "Reload")
    .Reactive(plan, evt => evt.Click, (args, p) =>
    {
        p.Plugin("reloadPage")
            .Arg(true)
            .Fire();
    });
```

### Plugin(command).Fire() — call a declared command descriptor

Pass the typed `PluginCommand` descriptor from a `Plugin` subclass.

```csharp
var analytics = plan.RegisterPlugin<AnalyticsPlugin>();

Html.NativeButton("filter-btn", "Filter")
    .Reactive(plan, evt => evt.Click, (args, p) =>
    {
        p.Plugin(analytics.Track)
            .Arg("filter-inspect")
            .Fire();
    });
```

### Command call inside a success scope

A void command fired after an HTTP success — the side effect runs once the
response lands.

```csharp
Html.NativeButton("send-btn", "Send")
    .Reactive(plan, evt => evt.Click, (args, p) =>
    {
        p.Get("/Sandbox/Plugins/Echo")
         .Response(r => r.OnSuccess<EchoResponse>((json, s) =>
         {
             s.Element("echo-result").SetText(json, x => x.Received);
             s.Plugin(analytics.Track)
                 .Arg("array-sent")
                 .Fire();
         }));
    });
```

## Plugin source in conditions

A `TypedPluginSource<T>` / `TypedPluginPropertySource<T>` is a first-class
condition source — `When` / `ElseIf` accept it like any other typed source, and
every operator applies.

### When(plugin function) — branch on a plugin function result

```csharp
Html.On(plan, t => t.PageLoad(p =>
    p.Get("/Sandbox/Plugins/Residents")
     .Response(r => r.OnSuccess<ResidentsListResponse>((json, s) =>
     {
         TypedPluginSource<bool> hasCritical = p.Plugin(array.Some)
             .Arg(json, x => x.Items)
             .Arg("status")
             .Arg("critical");

         s.When(hasCritical).Truthy()
             .Then(then => then
                 .Element("arr-has-critical").Show())
             .Else(els => els
                 .Element("arr-no-critical").Show());
     }))));
```

### When(plugin function).Gt — compare a plugin result to a literal

```csharp
TypedPluginSource<int> activeCount = p.Plugin(array.Count)
    .Arg(active);

s.When(activeCount).Gt(10)
    .Then(then => then
        .Element("capacity-warning").Show());
```

### When(plugin property) — branch on a plugin property

```csharp
var session = plan.RegisterPlugin<SessionPlugin>();

Html.On(plan, t => t.PageLoad(p =>
{
    TypedPluginPropertySource<bool> isAdmin = p.Plugin(session.IsAdmin);

    p.When(isAdmin).Truthy()
        .Then(then => then
            .Element("admin-panel").Show())
        .Else(els => els
            .Element("admin-panel").Hide());
}));
```

### ElseIf(plugin function) — chained plugin branches

```csharp
TypedPluginSource<int> count = p.Plugin(array.Count)
    .Arg(json, x => x.Items);

s.When(count).Eq(0)
    .Then(then => then
        .Element("empty-state").Show())
    .ElseIf(count).Gt(50)
        .Then(then => then
            .Element("overflow-state").Show())
    .Else(els => els
        .Element("normal-state").Show());
```

## Plugin source in gather

`Gather.Plugin<T>(source, paramName)` includes a plugin read's value in an HTTP
request payload under `paramName`. The plugin source may carry its own args.

### Gather.Plugin — plugin result into the request payload

```csharp
Html.NativeButton("send-btn", "Send")
    .Reactive(plan, evt => evt.Click, (args, p) =>
    {
        TypedPluginSource<int> count = p.Plugin(array.Count)
            .Arg("items");

        p.Get("/Sandbox/Plugins/PluginEcho")
         .Gather(g => g
             .Plugin(count, "count"))
         .Response(r => r.OnSuccess<PluginEchoResponse>((json, s) =>
         {
             s.Element("echo-count").SetText(json, x => x.ReceivedCount);
         }));
    });
```

### Gather.Header — plugin result into a request header

The same `TypedPluginSource<T>` flows into a header value (header is a value
target reading through the shared spine).

```csharp
Html.NativeButton("send-btn", "Send")
    .Reactive(plan, evt => evt.Click, (args, p) =>
    {
        TypedPluginSource<int> count = p.Plugin(array.Count)
            .Arg("items");

        p.Get("/Sandbox/Plugins/PluginEcho")
         .Gather(g => g
             .Header("X-Array-Count", count)
             .Plugin(count, "count"))
         .Response(r => r.OnSuccess<PluginEchoResponse>((json, s) =>
         {
             s.Element("echo-header").SetText(json, x => x.ReceivedHeader);
         }));
    });
```

## Plugin source in reactions

A plugin read is a `TypedSource<T>` everywhere a reaction takes a source —
`SetText`, `Set`, and `DispatchFrom`.

### SetText(plugin function) — write a plugin result into the DOM

```csharp
Html.On(plan, t => t.PageLoad(p =>
{
    TypedPluginSource<string> slug = p.Plugin(slugify.Slug)
        .Arg("John Doe");
    p.Element("resident-slug").SetText(slug);
}));
```

### Set(model, plugin function) — write a plugin result into a model field

```csharp
Html.On(plan, t => t.PageLoad(p =>
{
    TypedPluginSource<decimal> rate = p.Plugin(billing.MonthlyRate)
        .Arg("MemoryCare")
        .Arg(2);
    p.Set(m => m.EstimatedMonthly, rate);
}));
```

### DispatchFrom(name, plugin function) — dispatch a plugin-derived payload

```csharp
Html.On(plan, t => t.PageLoad(p =>
    p.Get("/Sandbox/Plugins/Residents")
     .Response(r => r.OnSuccess<ResidentsListResponse>((json, s) =>
     {
         TypedPluginSource<int> count = p.Plugin(array.Count)
             .Arg(json, x => x.Items);

         s.DispatchFrom<ResidentCountPayload>("residents-counted", b => b
             .From(d => d.Total, count));
     }))));
```

## Full vertical slice — declare, read, branch, gather, command

One end-to-end slice: a typed `Plugin` subclass registered with the plan, then
exercised across read, nested read, condition, gather, header, and a void
command fired after success.

```csharp
@functions {
    private sealed class ArrayPlugin : Plugin
    {
        public ArrayPlugin()
            : base("array")
        {
            Count = Function<int>("count")
                .Arg<object>();
            Filter = Function<object>("filter")
                .Arg<object>()
                .Arg<string>()
                .Arg<string>();
            Sum = Function<int>("sum")
                .Arg<object>()
                .Arg<string>();
            Some = Function<bool>("some")
                .Arg<object>()
                .Arg<string>()
                .Arg<string>();
        }

        public PluginFunction<int> Count { get; }
        public PluginFunction<object> Filter { get; }
        public PluginFunction<int> Sum { get; }
        public PluginFunction<bool> Some { get; }
    }

    private sealed class AnalyticsPlugin : Plugin
    {
        public AnalyticsPlugin()
            : base("analytics")
        {
            Track = Command("track")
                .Arg<string>();
        }

        public PluginCommand Track { get; }
    }
}

@{
    var array = plan.RegisterPlugin<ArrayPlugin>();
    var analytics = plan.RegisterPlugin<AnalyticsPlugin>();

    Html.NativeButton("inspect-btn", "Inspect Residents")
        .Reactive(plan, evt => evt.Click, (args, p) =>
        {
            p.Get("/Sandbox/Plugins/Residents")
             .Gather(g => g
                 .Header("X-Facility", p.Plugin<string>("session", "facilityId")))
             .Response(r => r.OnSuccess<ResidentsListResponse>((json, s) =>
             {
                 TypedPluginSource<object> active = p.Plugin(array.Filter)
                     .Arg(json, x => x.Items)
                     .Arg("status")
                     .Arg("active");

                 TypedPluginSource<int> activeCount = p.Plugin(array.Count)
                     .Arg(active);
                 s.Element("active-count").SetText(activeCount);

                 TypedPluginSource<int> ageSum = p.Plugin(array.Sum)
                     .Arg(active)
                     .Arg("age");
                 s.Element("active-age-sum").SetText(ageSum);

                 TypedPluginSource<bool> hasCritical = p.Plugin(array.Some)
                     .Arg(json, x => x.Items)
                     .Arg("status")
                     .Arg("critical");

                 s.When(hasCritical).Truthy()
                     .Then(then => then
                         .Element("critical-banner").Show())
                     .Else(els => els
                         .Element("critical-banner").Hide());

                 s.Plugin(analytics.Track)
                     .Arg("residents-inspected")
                     .Fire();
             }));
        });
}
```

</script>
<script>
(function(){
  "use strict";
  var AREA_ORDER = ["triggers","reactions","conditions","value-arrays","http","components","fusion-template","validation","app-level","plugins"];
  var LABELS = {"triggers":"Triggers","reactions":"Reactions","conditions":"Conditions","value-arrays":"Value & Arrays","http":"HTTP","components":"Components","fusion-template":"Fusion Template","validation":"Validation","app-level":"App-level","plugins":"Plugins"};

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  // single-pass C# highlighter — each slice escaped independently, no overlap
  function hl(code){
    var re=/(\/\/[^\n]*)|(@?"(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)*')|\b(var|new|return|true|false|null|async|await|public|private|internal|protected|static|void|class|record|using|if|else|for|foreach|in|switch|case|this|nameof|typeof)\b|\b([A-Z][A-Za-z0-9_]*)\b|\b(\d+\.?\d*[mdfMDF]?)\b/g;
    var out=[],last=0,m;
    while((m=re.exec(code))){
      out.push(esc(code.slice(last,m.index)));
      if(m[1]) out.push('<span class="tok-cmt">'+esc(m[1])+'</span>');
      else if(m[2]||m[3]) out.push('<span class="tok-str">'+esc(m[2]||m[3])+'</span>');
      else if(m[4]) out.push('<span class="tok-kw">'+esc(m[4])+'</span>');
      else if(m[5]) out.push('<span class="tok-type">'+esc(m[5])+'</span>');
      else if(m[6]) out.push('<span class="tok-num">'+esc(m[6])+'</span>');
      last=re.lastIndex;
    }
    out.push(esc(code.slice(last)));
    return out.join("");
  }

  function cleanText(s){ return s.replace(/\*\*/g,"").replace(/`/g,"").trim(); }

  // parse one area's markdown into feature objects
  function parseArea(area, md){
    var feats=[], lines=md.split("\n"), sub="", cur=null, inCode=false, buf=[];
    for(var i=0;i<lines.length;i++){
      var ln=lines[i];
      if(/^\s*```/.test(ln)){
        if(!inCode){inCode=true;buf=[];}
        else{inCode=false; if(cur) cur.codes.push(buf.join("\n"));}
        continue;
      }
      if(inCode){buf.push(ln);continue;}
      if(/^#\s/.test(ln)) continue;                       // area H1 — use data-area
      if(/^##\s/.test(ln)){ sub=cleanText(ln.replace(/^##\s+/,"")); continue; }
      if(/^###\s/.test(ln)){ cur={area:area,sub:sub,name:cleanText(ln.replace(/^###\s+/,"")),summary:"",codes:[]}; feats.push(cur); continue; }
      var t=ln.trim();
      if(/^[-=*_]{3,}$/.test(t)) continue;                // skip markdown horizontal rules
      if(t && cur) cur.summary += (cur.summary?" ":"")+cleanText(t);
    }
    return feats;
  }

  // collect all features from the embedded markdown blocks
  var ALL=[];
  var blocks=document.querySelectorAll('script[type="text/markdown"]');
  for(var b=0;b<blocks.length;b++){
    var area=blocks[b].getAttribute("data-area")||"misc";
    ALL=ALL.concat(parseArea(area, blocks[b].textContent));
  }
  ALL.forEach(function(f){ f.hay=(f.name+" "+f.sub+" "+f.summary+" "+f.codes.join(" ")).toLowerCase(); });

  var cardsEl=document.getElementById("cards"),
      countEl=document.getElementById("count"),
      chipsEl=document.getElementById("chips"),
      searchEl=document.getElementById("search");
  var activeArea="all", query="";

  // chips
  function mkChip(key,label){
    var c=document.createElement("span");
    c.className="chip"+(key===activeArea?" on":"");
    c.textContent=label; c.dataset.k=key;
    c.onclick=function(){activeArea=key;render();};
    return c;
  }
  function buildChips(){
    chipsEl.innerHTML="";
    chipsEl.appendChild(mkChip("all","All "+ALL.length));
    AREA_ORDER.forEach(function(a){
      var n=ALL.filter(function(f){return f.area===a;}).length;
      if(n) chipsEl.appendChild(mkChip(a,(LABELS[a]||a)+" "+n));
    });
  }

  function copyBtn(code){
    var btn=document.createElement("button");
    btn.className="copy"; btn.textContent="Copy";
    btn.onclick=function(){
      navigator.clipboard.writeText(code).then(function(){
        btn.textContent="Copied"; btn.classList.add("done");
        setTimeout(function(){btn.textContent="Copy";btn.classList.remove("done");},1200);
      });
    };
    return btn;
  }

  function render(){
    var list=ALL.filter(function(f){
      if(activeArea!=="all" && f.area!==activeArea) return false;
      if(query && f.hay.indexOf(query)<0) return false;
      return true;
    });
    countEl.innerHTML="<b>"+list.length+"</b> of "+ALL.length+" features";
    Array.prototype.forEach.call(chipsEl.children,function(c){c.classList.toggle("on",c.dataset.k===activeArea);});
    cardsEl.innerHTML="";
    if(!list.length){ cardsEl.innerHTML='<div class="empty">No DSL feature matches “'+esc(query)+'”.</div>'; return; }
    var order=activeArea==="all"?AREA_ORDER:[activeArea];
    order.forEach(function(area){
      var inArea=list.filter(function(f){return f.area===area;});
      if(!inArea.length) return;
      var hd=document.createElement("div"); hd.className="grouphd"; hd.textContent=LABELS[area]||area;
      cardsEl.appendChild(hd);
      var lastSub=null;
      inArea.forEach(function(f){
        if(f.sub && f.sub!==lastSub){ var sh=document.createElement("div");sh.className="subhd";sh.textContent=f.sub;cardsEl.appendChild(sh);lastSub=f.sub; }
        var card=document.createElement("div"); card.className="card";
        var tag=document.createElement("span"); tag.className="area"; tag.textContent=LABELS[f.area]||f.area; card.appendChild(tag);
        var h=document.createElement("h3"); h.textContent=f.name; card.appendChild(h);
        if(f.summary){ var p=document.createElement("p"); p.textContent=f.summary; card.appendChild(p); }
        f.codes.forEach(function(code){
          var pre=document.createElement("pre"); var co=document.createElement("code");
          co.innerHTML=hl(code); pre.appendChild(co); card.appendChild(pre);
        });
        if(f.codes.length) card.appendChild(copyBtn(f.codes.join("\n\n")));
        cardsEl.appendChild(card);
      });
    });
  }

  searchEl.addEventListener("input",function(){query=searchEl.value.trim().toLowerCase();render();});
  buildChips(); render();
})();
</script>
</body>
</html>
