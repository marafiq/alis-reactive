# Triggers

Exhaustive catalog of the **trigger** surface of the Alis.Reactive DSL — every way to
say *"start this reaction when…"*. A trigger is the browser event that opens a
reactive workflow: the page finishing load, a dispatched custom event, a component
firing an event, the server pushing over SSE, or a SignalR hub message.

Every workflow is attached with the same entry verb — `Html.On(plan, t => …)` — and
every trigger is a method on the fluent `TriggerBuilder<TModel>`, except component
events, which are wired through the component's own `.Reactive(…)` extension. Trigger
calls **chain**: each adds one independent workflow to the plan.

```csharp
Html.On(plan, t => t
    .PageLoad(p => p.Element("status").SetText("Ready"))
    .Event("resident-saved", p => p.Element("banner").SetText("Saved"))
    .ServerPush("/sse/census", p => p.Element("census").SetText("Updated")));
```

> Names are the **finalized green-field names** from `09-dsl-naming-sheet.md`:
> `DomReady → PageLoad`, `CustomEvent → Event`. The plan/wire vocabulary
> (`PageLoadTrigger`/`page-load`, `EventTrigger`/`event`) is shown where it helps a
> dev understand the lane. `StartsWhen` is the underlying trigger node these builder
> calls construct.

---

## The attach verb

### On

Attaches one or more triggers to a plan. The single entry point for all trigger
authoring; the lambda receives a `TriggerBuilder<TModel>` whose methods each add an
independent workflow. Reused by `Behavior.On(trigger, reaction)` internally — one
concept, one name.

```csharp
@{
    var plan = Html.ReactivePlan<ResidentIntakeModel>();

    Html.On(plan, t => t
        .PageLoad(p => p
            .Element("intake-status")
            .SetText("Loading resident profile…")));
}
@Html.RenderPlan(plan)
```

Multiple triggers in one `On` — each call chains and registers its own workflow:

```csharp
Html.On(plan, t => t
    .PageLoad(p => p
        .Element("billing-summary")
        .SetText("Calculating monthly charges…"))
    .Event("care-level-changed", p => p
        .Element("billing-summary")
        .SetText("Recalculating…"))
    .SignalR("/hubs/facility", "OccupancyChanged", p => p
        .Element("occupancy-badge")
        .SetText("Bed count updated")));
```

---

## PageLoad

### PageLoad

Fires once when the page finishes loading. The starting point for any workflow that
must run as soon as the resident's view is on screen — no user action required.
Plan term `PageLoadTrigger`, wire `kind: "page-load"`.

```csharp
Html.On(plan, t => t
    .PageLoad(p => p
        .Element("welcome-banner")
        .SetText("Welcome to Maple Grove Senior Living")));
```

A PageLoad workflow can drive a full HTTP fetch to populate the view on arrival:

```csharp
Html.On(plan, t => t
    .PageLoad(p => p
        .Get("/api/residents/{id}/care-plan", g => g
            .RouteParam("id", FromUrl<int>("residentId")))
        .Response(r => r
            .OnSuccess(s => s
                .Set(m => m.CareLevel, s.ResponseBody<CarePlan>().Read(b => b.Level))
                .Element("care-plan-panel").Show()))));
```

---

## Event

The custom-event listener. The exact mirror of the `p.Dispatch(name)` reaction: one
workflow `Dispatch`es an event by name, another `Event`s on that same name. Plan term
`EventTrigger`, wire `kind: "event"`.

### Event

Listens for a named custom event with no typed payload. Reacts whenever any workflow
(or external code) dispatches that event name.

```csharp
Html.On(plan, t => t
    .Event("assessment-completed", p => p
        .Element("assessment-status")
        .SetText("Assessment recorded")
        .Element("next-step-panel").Show()));
```

The emit side that pairs with it — same string, listen with `Event`, emit with
`Dispatch`:

```csharp
Html.On(plan, t => t
    .PageLoad(p => p
        .Element("assessment-status")
        .SetText("Ready")
        .Dispatch("assessment-completed")));
```

### Event&lt;TPayload&gt;

Listens for a named custom event carrying a **typed payload**, giving compile-time
access to the event's data inside the pipeline. The payload object is the first
lambda parameter; its properties feed conditions, sets, and gathers through the value
spine. Pairs with `Dispatch<TPayload>(name, payload)` / `DispatchFrom<TPayload>`.

```csharp
Html.On(plan, t => t
    .Event<CareLevelChangedPayload>("care-level-changed", (args, p) => p
        .Set(m => m.CareLevel, args, a => a.NewLevel)
        .Element("care-level-display")
        .SetText(args, a => a.NewLevel)));
```

Reading a payload property into a condition before reacting:

```csharp
Html.On(plan, t => t
    .Event<BillingRecalculatedPayload>("billing-recalculated", (args, p) => p
        .When(args, a => a.MonthlyTotal).Gt(5000m)
            .Then(then => then
                .Element("high-cost-warning").Show())
        .Else(els => els
            .Element("high-cost-warning").Hide())));
```

---

## ComponentEvent (the `.Reactive()` wiring)

A component firing one of its own browser events is the `ComponentEvent` trigger
(plan term `ComponentEventTrigger`, wire `kind: "component-event"`). It is **never**
authored on `TriggerBuilder` directly — it is wired through the component's typed
`.Reactive(…)` extension, the one shared verb across every Native and Fusion slice:
*"wire this browser event into a reactive pipeline."* The event is chosen with a typed
selector (`evt => evt.Changed`) so the args type flows in compile-checked.

There are **two shapes** of `.Reactive`, split by whether the component already holds
the plan:

### .Reactive — model-bound input components (plan passed in)

Input components are rendered through `Html.InputField(plan, m => m.Prop)`, so their
`.Reactive` takes the `plan` explicitly. The selector picks the event; `(args, p)`
gives the typed event args plus the pipeline. Always the **last** call in the build
callback.

Native input:

```csharp
@(Html.InputField(plan, m => m.ResidentName)
    .NativeTextBox(b => b
        .Placeholder("Enter resident name")
        .Reactive(plan, evt => evt.Changed, (args, p) => p
            .Element("name-preview")
            .SetText(args, a => a.Value))))
```

Fusion input — same shape, vendor-prefixed builder:

```csharp
@(Html.InputField(plan, m => m.Country)
    .FusionDropDownList(b =>
    {
        b.Fields<CountryItem>(t => t.Text, v => v.Value);
        b.Reactive(plan, evt => evt.Changed, (args, p) => p
            .When(args, a => a.Value).Eq("US")
                .Then(then => then
                    .Element("state-field").Show())
            .Else(els => els
                .Element("state-field").Hide()));
    }))
```

Driving an HTTP pipeline straight off a component event:

```csharp
@(Html.InputField(plan, m => m.FacilityId)
    .FusionDropDownList(b =>
    {
        b.Fields<FacilityItem>(t => t.Name, v => v.Id);
        b.Reactive(plan, evt => evt.Changed, (args, p) => p
            .Get("/api/facilities/{id}/available-beds", g => g
                .RouteParam("id", args, a => a.Value))
            .Response(r => r
                .OnSuccess(s => s
                    .Element("bed-count")
                    .SetText(s.ResponseBody<BedAvailability>().Read(x => x.OpenBeds)))));
    }))
```

### .Reactive — display & app-level components (plan held by the builder)

Display/container components (Accordion, ListView, Menu, Sidebar, …) are rendered
through `Html.FusionAccordion(plan, "id", …)`, so the builder already carries the
plan — their `.Reactive` omits the `plan` parameter.

```csharp
@(Html.FusionAccordion(plan, "care-services", b =>
    {
        b.Item("Dining", "Three chef-prepared meals daily");
        b.Item("Wellness", "On-site nursing and therapy");
    })
    .Reactive(evt => evt.Expanded, (args, p) => p
        .Element("services-detail")
        .SetText("Service details expanded")))
```

### .Reactive — buttons (click → dispatch / HTTP)

A button's `.Reactive(plan, evt => evt.Click, …)` is the idiomatic way to start a
workflow from an explicit click.

```csharp
@(Html.NativeButton("save-intake", "Save Intake")
    .CssClass("btn btn-primary")
    .Reactive(plan, evt => evt.Click, (args, p) => p
        .Post("/api/residents/intake", g => g
            .IncludeAll())
        .Response(r => r
            .OnSuccess(s => s
                .Element("save-result").SetText("Intake saved"))
            .OnError(e => e
                .Element("save-result").SetText("Save failed")))))
```

### Reading a component-event payload as an array source

A `.Reactive` event whose payload carries an array (`T[]`) feeds the typed array
pipeline through `p.From(args, e => e.Items)` — the same value spine, array shape.

```csharp
@(Html.FusionListView(plan, "resident-tags", b => b
        .Fields<TagItem>(t => t.Text, v => v.Id))
    .Reactive(evt => evt.Selected, (args, p) => p
        .Set(m => m.SelectedTagCount,
            p.From(args, e => e.SelectedItems)
             .Count()
             .AsArraySource())))
```

---

## ServerPush

Server-Sent Events: *"the server pushes events to me."* The browser opens an SSE
connection to a URL and the workflow runs on each received event. Plan term
`ServerPushTrigger`, wire `kind: "server-push"`. The event filter (`ServerPushEventFilter`)
decides which SSE events match: **any** event, or a **named** event type.

### ServerPush — any event

The two-argument overload listens to **every** event on the stream
(`AnyServerPushEvent`, filter `kind: "any"`).

```csharp
Html.On(plan, t => t
    .ServerPush("/sse/facility-alerts", p => p
        .Element("alert-banner").Show()
        .Element("alert-text").SetText("New facility alert received")));
```

### ServerPush — named event type

The three-argument overload filters to a single SSE event type
(`NamedServerPushEvent`, filter `kind: "named"`). Only that event type runs the
workflow.

```csharp
Html.On(plan, t => t
    .ServerPush("/sse/census", "bed-freed", p => p
        .Element("available-beds").SetText("A bed has opened")
        .Dispatch("refresh-availability")));
```

### ServerPush&lt;TPayload&gt; — named event type with typed payload

The generic overload filters to a named SSE event type **and** delivers a typed
payload, giving compile-time access to the pushed data.

```csharp
Html.On(plan, t => t
    .ServerPush<VitalsReadingPayload>("/sse/resident/{id}/vitals", "vitals-update", (args, p) => p
        .Set(m => m.HeartRate, args, a => a.HeartRate)
        .When(args, a => a.HeartRate).Gt(100)
            .Then(then => then
                .Element("vitals-warning").Show()
                .Dispatch("alert-nursing"))));
```

---

## SignalR

A SignalR hub message: the workflow runs when a named hub method is invoked on the
client. Plan term `SignalRTrigger`, wire `kind: "signalr"`. Proper-noun protocol name,
aligned across every layer.

### SignalR — hub method, untyped

The three-argument overload listens for a hub method by name with no typed payload.

```csharp
Html.On(plan, t => t
    .SignalR("/hubs/facility", "OccupancyChanged", p => p
        .Element("occupancy-badge").SetText("Occupancy updated")
        .Dispatch("refresh-dashboard")));
```

### SignalR&lt;TPayload&gt; — hub method, typed payload

The generic overload delivers a typed payload from the hub method, giving
compile-time access to the message data inside the pipeline.

```csharp
Html.On(plan, t => t
    .SignalR<MedicationDuePayload>("/hubs/care", "MedicationDue", (args, p) => p
        .Element("med-alert").Show()
        .Element("med-resident").SetText(args, a => a.ResidentName)
        .Element("med-name").SetText(args, a => a.MedicationName)
        .When(args, a => a.IsCritical).Truthy
            .Then(then => then
                .Element("med-alert").AddClass("critical"))));
```

---

## Chaining every trigger together

All trigger calls return the `TriggerBuilder`, so a single `On` can register the full
range of triggers for one view — page-load setup, custom-event reactions, server
pushes, and SignalR — each an independent workflow.

```csharp
Html.On(plan, t => t
    .PageLoad(p => p
        .Element("dashboard-status").SetText("Live"))
    .Event("resident-admitted", p => p
        .Element("admit-toast").Show())
    .Event<DischargePayload>("resident-discharged", (args, p) => p
        .Element("discharge-name").SetText(args, a => a.ResidentName))
    .ServerPush("/sse/alerts", p => p
        .Element("alert-feed").SetText("New alert"))
    .ServerPush<CensusPayload>("/sse/census", "census-update", (args, p) => p
        .Set(m => m.OccupiedBeds, args, a => a.Occupied))
    .SignalR("/hubs/facility", "ShiftChanged", p => p
        .Element("shift-banner").SetText("Shift handover"))
    .SignalR<EmergencyPayload>("/hubs/care", "EmergencyRaised", (args, p) => p
        .Element("emergency-banner").Show()
        .Element("emergency-detail").SetText(args, a => a.Description)));
```

# Reactions

The complete reaction surface of the Alis.Reactive DSL: every way to mutate the
browser, dispatch events, branch, parallelize, and read a value source when a
trigger fires. This is the **green-field rewrite** vocabulary — every name on this
page is the finalized one from `09-dsl-naming-sheet.md`. Legacy spellings
(`DomReady`, `CustomEvent`, `DispatchWith`, `ValidationErrors`, `FocusIn`,
`AsSource`, `Finally`) are gone; do not write them.

A reaction is the `Then(p => ...)` body of a trigger. You author it on a
`PipelineBuilder` (the `p` parameter). Reactions run **in declaration order** —
top-to-bottom is execution order. Sync reactions (`Set`, `Call`, `Dispatch`,
`Inject`, `ShowValidationErrors`, branch evaluation) stay synchronous; only HTTP
requests and `Parallel` cross the async boundary. Each reaction carries a
`ReactionTiming` (`sync` / `async`) the runtime routes on — you never set it.

> **Reading orientation.** Every sample is a full fluent chain, one call per line,
> read top-to-bottom. Domain model throughout: residents, care levels, facilities,
> billing, assessments.

---

## On — attaching reactions to a trigger

### On

Adds one or more trigger→reaction workflows to a plan. The entry point for every
reaction on the page. Chain trigger methods on `t`; build the reaction on `p`.

```csharp
@{
    var plan = Html.ReactivePlan<ResidentModel>();
}

@Html.On(plan, t => t
    .PageLoad(p => p
        .Element("intake-banner")
        .SetText("Resident intake open")));

@Html.RenderPlan(plan)
```

### StartsWhen — the trigger surface a reaction hangs off

Each trigger method takes the reaction pipeline as its last argument. The reaction
is identical regardless of trigger; only the entry differs.

```csharp
@Html.On(plan, t => t
    .PageLoad(p => p
        .Element("care-summary")
        .Show())
    .Event("resident-admitted", p => p
        .Element("admit-toast")
        .Show())
    .ServerPush("/sse/billing", p => p
        .Element("billing-ticker")
        .AddClass("pulse"))
    .SignalR("/hubs/assessments", "AssessmentScored", p => p
        .Element("score-badge")
        .AddClass("updated")));
```

A typed-payload trigger (`Event<TPayload>`) hands the reaction a typed `args`
object whose members feed value sources (`SetText(args, ...)`, `When(args, ...)`).

```csharp
@Html.On(plan, t => t
    .Event<AdmissionPayload>("resident-admitted", (args, p) => p
        .Element("admit-name")
        .SetText(args, a => a.ResidentName)));
```

---

## Set — assign a property on an element or component

`Set` writes a property value. On a DOM element it is spelled `SetText` / `SetHtml`
(the two writable element properties) plus `Show` / `Hide`; on a component it is the
vendor `SetValue` / `SetText` / `SetDataSource` member. One verb over distinct
**value-source arities** — literal, event payload, response body, and `TypedSource`.
The arities are deliberately not collapsed.

### SetText

Sets an element's text content. Four value-source overloads.

Literal string:

```csharp
@Html.On(plan, t => t
    .PageLoad(p => p
        .Element("facility-name")
        .SetText("Lakeside Memory Care")));
```

From an event payload property (`Event<TPayload>` `args`):

```csharp
@Html.On(plan, t => t
    .Event<AdmissionPayload>("resident-admitted", (args, p) => p
        .Element("welcome-line")
        .SetText(args, a => a.ResidentName)));
```

From an HTTP response body property (inside `OnSuccess`):

```csharp
@Html.On(plan, t => t
    .Event("load-resident", p => p
        .Get("/api/residents/{id}")
        .RouteParam("id", m => m.ResidentId)
        .Response(r => r
            .OnSuccess<ResidentDto>(ok => ok
                .Element("resident-care-level")
                .SetText(ok.Body, b => b.CareLevel)))));
```

From a `TypedSource` (component read, URL param, plugin read, or array fold).
This overload returns the `ElementBuilder` so element mutations keep chaining:

```csharp
@Html.On(plan, t => t
    .Event("recompute", p => p
        .Element("selected-care-level")
        .SetText(p.Component<FusionDropDownList>(m => m.CareLevel).Value())
        .AddClass("highlight")));
```

### SetHtml

Sets an element's inner HTML. Literal, event-payload, and `TypedSource` overloads
(same value-source family as `SetText`).

Literal HTML:

```csharp
@Html.On(plan, t => t
    .PageLoad(p => p
        .Element("care-plan-panel")
        .SetHtml("<em>No care plan on file.</em>")));
```

From an event payload property:

```csharp
@Html.On(plan, t => t
    .Event<CarePlanPayload>("care-plan-rendered", (args, p) => p
        .Element("care-plan-panel")
        .SetHtml(args, a => a.RenderedHtml)));
```

From a `TypedSource` (returns the `ElementBuilder` for further chaining):

```csharp
@Html.On(plan, t => t
    .Event("refresh-note", p => p
        .Element("clinical-note")
        .SetHtml(p.FromUrl("noteHtml"))
        .RemoveClass("stale")));
```

### Show / Hide

Visibility writes — `Set(hidden=false)` and `Set(hidden=true)`. No arguments.

```csharp
@Html.On(plan, t => t
    .Event("show-billing", p => p
        .Element("billing-section")
        .Show())
    .Event("hide-billing", p => p
        .Element("billing-section")
        .Hide()));
```

### Component SetValue — writing a component property

On a `ComponentRef`, `SetValue` is the typed property write. It carries the same
value-source arities as `SetText`: literal, event payload, response body, and
`TypedSource` (used for `SetDataSource`-style array routing).

Literal:

```csharp
@Html.On(plan, t => t
    .Event("preset-care-level", p => p
        .Component<FusionDropDownList>(m => m.CareLevel)
        .SetValue("memory-care")));
```

From an HTTP response body, feeding a component's data source:

```csharp
@Html.On(plan, t => t
    .Event("load-physicians", p => p
        .Get("/api/facilities/{facilityId}/physicians")
        .RouteParam("facilityId", m => m.FacilityId)
        .Response(r => r
            .OnSuccess<PhysicianListDto>(ok => ok
                .Component<FusionAutoComplete>(m => m.Physician)
                .SetDataSource(ok.Body, b => b.Physicians)
                .DataBind()))));
```

From a typed array source (a client-side `ReactiveArray` fold via
`AsArraySource()` — no HTTP round trip):

```csharp
@Html.On(plan, t => t
    .Event<TagPayload>("tags-changed", (args, p) => p
        .Component<FusionAutoComplete>(m => m.Allergies)
        .SetDataSource(p
            .From(args, a => a.AllTags)
            .Where(tag => tag.IsActive)
            .OrderBy(tag => tag.Label)
            .AsArraySource())
        .DataBind()));
```

---

## Call — invoke a method on an element or component

`Call` invokes a member. On a DOM element the class-mutation verbs lower to a call;
on a component the vendor method verbs (`Focus`, `ShowPopup`, `DataBind`) emit a
`CallReaction`.

### AddClass / RemoveClass / ToggleClass

Direct CSS-class mutation verbs on a live DOM element.

```csharp
@Html.On(plan, t => t
    .Event("flag-overdue", p => p
        .Element("invoice-row")
        .AddClass("overdue")
        .RemoveClass("paid"))
    .Event("toggle-expand", p => p
        .Element("assessment-card")
        .ToggleClass("expanded")));
```

### Focus — move focus to a component

The native DOM `focus` verb on a `ComponentRef`. (Finalized from `FocusIn`, which
lied — `focusin` is a different bubbling event.)

```csharp
@Html.On(plan, t => t
    .Event("start-intake", p => p
        .Component<FusionAutoComplete>(m => m.ResidentName)
        .Focus()));
```

### Component method calls

Vendor method verbs emit a `CallReaction`. They chain with property sets.

```csharp
@Html.On(plan, t => t
    .Event("open-physician-picker", p => p
        .Component<FusionAutoComplete>(m => m.Physician)
        .Enable()
        .ShowPopup()
        .Focus()));
```

---

## Dispatch — emit a custom browser event

`Dispatch` emits a named event that any `Event(name, ...)` trigger listens for.
The emit/listen pair reads consistently: `p.Dispatch("x")` ⇄ `t.Event("x", ...)`.
Three lanes: no payload, **literal** payload, and **source-backed** payload
(`DispatchFrom`).

### Dispatch (no payload)

Fire-and-forget event by name.

```csharp
@Html.On(plan, t => t
    .Event("save-resident", p => p
        .Post("/api/residents")
        .Gather(g => g.IncludeAll())
        .Response(r => r
            .OnSuccess(ok => ok
                .Dispatch("resident-saved")))));
```

### Dispatch (literal payload)

Carries a compile-time literal payload object. Listeners consume it via
`Event<TPayload>`.

```csharp
@Html.On(plan, t => t
    .Event("admit", p => p
        .Dispatch("resident-admitted", new AdmissionPayload
        {
            ResidentName = "Pending",
            CareLevel = "assessment",
            Admitted = false
        })));
```

### DispatchFrom (source-backed payload)

Each payload field comes from a **live** source resolved at dispatch time —
component value, URL param, plugin read, or a literal. The verb name marks the
"from a source" idea (mirrors `FromUrl`, `SetText(source)`). Distinct from the
literal `Dispatch<TPayload>(name, payload)` lane above.

```csharp
@Html.On(plan, t => t
    .Event("publish-care-level", p => p
        .DispatchFrom<CareLevelPayload>("care-level-changed", b => b
            .Set(x => x.CareLevel, p.Component<FusionDropDownList>(m => m.CareLevel).Value())
            .Set(x => x.FacilityId, p.FromUrl<int>("facilityId"))
            .Set(x => x.Source, "intake-form")
            .Set(x => x.Priority, 1)
            .Set(x => x.Confirmed, true))));
```

The `DispatchFrom` payload builder has four `Set` overloads — one source-backed
(`TypedSource<TProp>`) and three literal-typed (`string`, `int`, `bool`) — shown
together in the chain above. Nested payload paths are addressed with dotted
expressions (`x => x.Billing.Amount`).

---

## Inject — put response HTML into an element

`Inject` writes a value into a DOM target. The authored surface is `Into`: it takes
an HTTP success response body and injects it as the element's content. Must follow
a request inside a response scope.

### Into

Injects the whole success response body into an element. The whole-body read lowers
to the `WholeResponseBody` value node (never the old `responseBody` sentinel).

```csharp
@Html.On(plan, t => t
    .Event("load-care-plan", p => p
        .Get("/partials/care-plan/{residentId}")
        .RouteParam("residentId", m => m.ResidentId)
        .Response(r => r
            .OnSuccess(ok => ok
                .Into("care-plan-container")))));
```

`Into` works in an error scope too — inject a server-rendered error fragment:

```csharp
@Html.On(plan, t => t
    .Event("submit-assessment", p => p
        .Post("/api/assessments")
        .Gather(g => g.IncludeAll())
        .Response(r => r
            .OnSuccess(ok => ok
                .Into("assessment-result"))
            .OnError(err => err
                .Into("assessment-errors")))));
```

---

## Component / ComponentRef — typed handle to a component

`Component<TComponent>(...)` resolves a typed `ComponentRef` you can `SetValue` /
`Call` / `Read` on. Four overloads, split on **how you identify the component**.

### Component(model expression)

Bind to a component by the model property it renders (the deterministic-id path).

```csharp
@Html.On(plan, t => t
    .PageLoad(p => p
        .Component<FusionDropDownList>(m => m.CareLevel)
        .SetValue("assisted-living")));
```

### Component(cross-model expression)

Reference a component bound to a **different** model (cross-partial scenarios).

```csharp
@Html.On(plan, t => t
    .Event("sync-facility", p => p
        .Component<FusionDropDownList, FacilityModel>(f => f.FacilityName)
        .SetValue("Lakeside Memory Care")));
```

### Component(explicit id)

Reference a component by an explicit element id.

```csharp
@Html.On(plan, t => t
    .Event("focus-search", p => p
        .Component<FusionAutoComplete>("resident-search-box")
        .Focus()));
```

### Component (layout singleton)

Reference a layout-owned app-level component (Toast, Confirm) by its default id —
no expression, no id argument.

```csharp
@Html.On(plan, t => t
    .Event("save-resident", p => p
        .Post("/api/residents")
        .Gather(g => g.IncludeAll())
        .Response(r => r
            .OnSuccess(ok => ok
                .Component<FusionToast>()
                .SetMessage("Resident saved")
                .Success()
                .Show()))));
```

### ComponentRef.Value() — reading a component as a source

`Value()` (and other vendor reads) returns a `TypedSource` you pass to `When`,
`SetText`, gather, or another component mutation. The read feeds the value spine;
it is not itself a reaction.

```csharp
@Html.On(plan, t => t
    .Event("recompute-billing", p => p
        .When(p.Component<FusionDropDownList>(m => m.CareLevel).Value())
        .Eq("memory-care")
        .Then(p => p
            .Element("billing-amount")
            .SetText("$8,200 / month"))));
```

---

## ShowValidationErrors — render accumulated errors

### ShowValidationErrors

Displays accumulated client-validation errors in a container element. A noun-free
verb (finalized from `ValidationErrors`, which read like a getter). Sync reaction;
typically the failure branch of a validated submit.

```csharp
@Html.On(plan, t => t
    .Event("submit-intake", p => p
        .Post("/api/residents")
        .Validate<ResidentModel>("intake-form")
        .Gather(g => g.IncludeAll())
        .Response(r => r
            .OnError(err => err
                .ShowValidationErrors("intake-form-errors")))));
```

Stand-alone (e.g. surface server-side errors already merged into the plan):

```csharp
@Html.On(plan, t => t
    .Event("reveal-errors", p => p
        .ShowValidationErrors("intake-form-errors")));
```

---

## FromUrl — read a value from the URL

### FromUrl

Reads a URL query parameter as a `TypedSource` for conditions, `SetText`, gather,
or `DispatchFrom`. Two overloads: string (default) and typed.

As a string:

```csharp
@Html.On(plan, t => t
    .PageLoad(p => p
        .Element("active-facility")
        .SetText(p.FromUrl("facility"))));
```

Typed (`int`, `decimal`, `bool`, …) — the type flows into operators and gather:

```csharp
@Html.On(plan, t => t
    .PageLoad(p => p
        .When(p.FromUrl<int>("page"))
        .Gt(1)
        .Then(p => p
            .Element("prev-page-link")
            .Show())));
```

---

## Sequence — ordered reactions

### Sequence (declaration order)

A pipeline body is a sequence: every reaction you add runs in the order written.
There is no explicit `Sequence(...)` verb — the order of the chain **is** the
sequence (it lowers to a `SequenceReaction`).

```csharp
@Html.On(plan, t => t
    .Event("complete-admission", p => p
        .Element("admit-spinner")
        .Show()
        .Element("admit-button")
        .AddClass("disabled")
        .Component<FusionToast>()
        .SetMessage("Admitting resident…")
        .Info()
        .Show()
        .Dispatch("admission-started")));
```

---

## Branch — first-match conditional flow (When / Then / ElseIf / Else)

A branch evaluates guards top-to-bottom and runs the **first** matching case. Author
it with `When(...).<operator>().Then(...)`, chain `ElseIf(...)`, end with `Else(...)`.
Multiple branch blocks may sit between other reactions in one pipeline.

### When + Then

The minimal branch: one guard, one body. `When` has three source overloads —
event payload, response body, and `TypedSource`.

`When(TypedSource)`:

```csharp
@Html.On(plan, t => t
    .Event("evaluate-care", p => p
        .When(p.Component<FusionNumericTextBox>(m => m.AssessmentScore).Value())
        .Gte(40)
        .Then(p => p
            .Element("memory-care-notice")
            .Show())));
```

`When(args, path)` — from an event payload:

```csharp
@Html.On(plan, t => t
    .Event<AdmissionPayload>("resident-admitted", (args, p) => p
        .When(args, a => a.CareLevel)
        .Eq("memory-care")
        .Then(p => p
            .Element("secure-unit-banner")
            .Show())));
```

`When(responseBody, path)` — from an HTTP response body (inside `OnSuccess`):

```csharp
@Html.On(plan, t => t
    .Event("load-resident", p => p
        .Get("/api/residents/{id}")
        .RouteParam("id", m => m.ResidentId)
        .Response(r => r
            .OnSuccess<ResidentDto>(ok => ok
                .When(ok.Body, b => b.OutstandingBalance)
                .Gt(0m)
                .Then(p => p
                    .Element("balance-warning")
                    .Show())))));
```

### When + Then + ElseIf + Else

The full first-match chain. `ElseIf` carries the same three source overloads as
`When`; `Else` is the unguarded default and must come last.

```csharp
@Html.On(plan, t => t
    .Event("classify-care", p => p
        .When(p.Component<FusionNumericTextBox>(m => m.AssessmentScore).Value())
        .Gte(70)
        .Then(p => p
            .Element("care-recommendation")
            .SetText("Memory Care"))
        .ElseIf(p.Component<FusionNumericTextBox>(m => m.AssessmentScore).Value())
        .Gte(40)
        .Then(p => p
            .Element("care-recommendation")
            .SetText("Assisted Living"))
        .Else(p => p
            .Element("care-recommendation")
            .SetText("Independent Living"))));
```

### Compare operators on a guard

`When(source).<op>(...)` — the full deterministic compare surface. Each is a guard
producing a branch.

Equality and ordering (typed operand):

```csharp
@Html.On(plan, t => t
    .Event("billing-check", p => p
        .When(p.Component<FusionNumericTextBox>(m => m.MonthlyRate).Value())
        .Between(2000m, 9000m)
        .Then(p => p
            .Element("rate-ok")
            .Show())));
```

Presence — the six orthogonal poles (`Truthy` / `Falsy` / `IsNull` / `NotNull` /
`IsEmpty` / `NotEmpty`):

```csharp
@Html.On(plan, t => t
    .Event("validate-physician", p => p
        .When(p.Component<FusionAutoComplete>(m => m.Physician).Value())
        .NotNull()
        .Then(p => p
            .Element("physician-ok")
            .Show())));
```

Membership and range (`In` / `NotIn` / `Between`):

```csharp
@Html.On(plan, t => t
    .Event("route-by-level", p => p
        .When(p.Component<FusionDropDownList>(m => m.CareLevel).Value())
        .In("memory-care", "skilled-nursing")
        .Then(p => p
            .Element("clinical-staffing-note")
            .Show())));
```

Text predicates (`Contains` / `StartsWith` / `EndsWith` / `Matches` / `MinLength` /
`MaxLength`):

```csharp
@Html.On(plan, t => t
    .Event<NotePayload>("note-typed", (args, p) => p
        .When(args, a => a.Text)
        .MinLength(10)
        .Then(p => p
            .Element("note-save-button")
            .RemoveClass("disabled"))));
```

Array membership (`ArrayContains`):

```csharp
@Html.On(plan, t => t
    .Event<TagPayload>("tags-changed", (args, p) => p
        .When(args, a => a.Tags)
        .ArrayContains("fall-risk")
        .Then(p => p
            .Element("fall-risk-banner")
            .Show())));
```

### Source-vs-source compare

A guard operator can take another `TypedSource` as its right operand (compare two
live values, not a literal).

```csharp
@Html.On(plan, t => t
    .Event("compare-rates", p => p
        .When(p.Component<FusionNumericTextBox>(m => m.QuotedRate).Value())
        .Gt(p.Component<FusionNumericTextBox>(m => m.BaseRate).Value())
        .Then(p => p
            .Element("upcharge-note")
            .Show())));
```

### And / Or / Not — composing guards

`And` / `Or` have **two** shapes: the flat `TypedSource` shape and the grouped
nested-lambda shape (`(a OR b) AND c`). `Not` inverts.

Flat `And` (event-payload and `TypedSource` overloads both fold through here):

```csharp
@Html.On(plan, t => t
    .Event("eligibility-check", p => p
        .When(p.Component<FusionNumericTextBox>(m => m.Age).Value())
        .Gte(65)
        .And(p.Component<FusionDropDownList>(m => m.CareLevel).Value())
        .Eq("memory-care")
        .Then(p => p
            .Element("eligible-banner")
            .Show())));
```

Grouped `Or` with a nested condition — `(memory-care OR skilled-nursing) AND age >= 65`:

```csharp
@Html.On(plan, t => t
    .Event("staffing-check", p => p
        .When(p.Component<FusionNumericTextBox>(m => m.Age).Value())
        .Gte(65)
        .And(c => c
            .When(p.Component<FusionDropDownList>(m => m.CareLevel).Value())
            .Eq("memory-care")
            .Or(p.Component<FusionDropDownList>(m => m.CareLevel).Value())
            .Eq("skilled-nursing"))
        .Then(p => p
            .Element("clinical-staffing-note")
            .Show())));
```

`Not` — invert a guard:

```csharp
@Html.On(plan, t => t
    .Event("gate-discharge", p => p
        .When(p.Component<FusionCheckBox>(m => m.BillingCleared).Value())
        .Truthy()
        .Not()
        .Then(p => p
            .Element("discharge-blocked")
            .Show())));
```

### Confirm — user-decision guard

`Confirm(message)` is a **user-decision async guard** authored on the same guard
surface, so it composes with `And` and ends with `Then`. The distinct name marks
the async lane (plan term `ConfirmGuard`, wire `confirm`).

```csharp
@Html.On(plan, t => t
    .Event("discharge-resident", p => p
        .Confirm("Discharge this resident? This cannot be undone.")
        .Then(p => p
            .Post("/api/residents/{id}/discharge")
            .RouteParam("id", m => m.ResidentId)
            .Response(r => r
                .OnSuccess(ok => ok
                    .Dispatch("resident-discharged"))))));
```

`Confirm` composed with a data guard via `And`:

```csharp
@Html.On(plan, t => t
    .Event("delete-assessment", p => p
        .Confirm("Permanently delete this assessment?")
        .And(p.Component<FusionCheckBox>(m => m.IsLocked).Value())
        .Falsy()
        .Then(p => p
            .Delete("/api/assessments/{id}")
            .RouteParam("id", m => m.AssessmentId)
            .Response(r => r
                .OnSuccess(ok => ok
                    .Dispatch("assessment-deleted"))))));
```

---

## Parallel — concurrent requests

### Parallel + OnAllSettled

`Parallel(...branches)` starts multiple HTTP requests concurrently; `OnAllSettled`
runs after **every** branch settles (success, error, or network failure — borrows
`Promise.allSettled`). This is the async lane.

```csharp
@Html.On(plan, t => t
    .Event("load-resident-dashboard", p => p
        .Parallel(
            b => b
                .Get("/api/residents/{id}/profile")
                .RouteParam("id", m => m.ResidentId)
                .Response(r => r
                    .OnSuccess(ok => ok
                        .Into("profile-panel"))),
            b => b
                .Get("/api/residents/{id}/billing")
                .RouteParam("id", m => m.ResidentId)
                .Response(r => r
                    .OnSuccess(ok => ok
                        .Into("billing-panel"))),
            b => b
                .Get("/api/residents/{id}/assessments")
                .RouteParam("id", m => m.ResidentId)
                .Response(r => r
                    .OnSuccess(ok => ok
                        .Into("assessments-panel"))))
        .OnAllSettled(done => done
            .Element("dashboard-spinner")
            .Hide())));
```

A `Parallel` block with no completion runs each branch fire-and-forget:

```csharp
@Html.On(plan, t => t
    .Event("prefetch", p => p
        .Parallel(
            b => b
                .Get("/api/facilities/{facilityId}/staff")
                .RouteParam("facilityId", m => m.FacilityId),
            b => b
                .Get("/api/facilities/{facilityId}/rooms")
                .RouteParam("facilityId", m => m.FacilityId))));
```

---

## Mixed pipeline — sets, branch, dispatch, and HTTP together

A single reaction can interleave every lane. Branch blocks, sets, dispatches, and
requests all sit in one ordered pipeline; sync reactions stay sync, the request
crosses the async boundary, and reactions in its response scope resume sync.

```csharp
@Html.On(plan, t => t
    .Event("finalize-intake", p => p
        .Element("finalize-spinner")
        .Show()
        .When(p.Component<FusionNumericTextBox>(m => m.AssessmentScore).Value())
        .Gte(70)
        .Then(p => p
            .Component<FusionDropDownList>(m => m.CareLevel)
            .SetValue("memory-care"))
        .Else(p => p
            .Component<FusionDropDownList>(m => m.CareLevel)
            .SetValue("assisted-living"))
        .Confirm("Submit this intake for review?")
        .Then(p => p
            .Post("/api/residents/intake")
            .Validate<ResidentModel>("intake-form")
            .Gather(g => g.IncludeAll())
            .Response(r => r
                .OnSuccess(ok => ok
                    .Element("finalize-spinner")
                    .Hide()
                    .Component<FusionToast>()
                    .SetMessage("Intake submitted")
                    .Success()
                    .Show()
                    .Dispatch("intake-submitted"))
                .OnError(err => err
                    .Element("finalize-spinner")
                    .Hide()
                    .ShowValidationErrors("intake-form-errors"))))));
```

</script>
<script type="text/markdown" data-area="conditions">
# conditions

Conditional routing in the reactive pipeline. A guard evaluates a deterministic
`ConditionGraph` over a typed value source, then routes execution down the
first matching branch. `When/Then/ElseIf/Else` is the first-match decision form;
`Confirm` is the user-decision async gate.

The surface is a tall fluent chain that reads like a sentence:

```
p.When(SOURCE).OPERATOR [.And/.Or/.Not]
    .Then(t => PIPELINE)
   [.ElseIf(SOURCE).OPERATOR.Then(t => PIPELINE)]   -- repeatable
   [.Else(e => PIPELINE)]                            -- terminal (void)
```

Every operator returns a `GuardBuilder<TModel>`; `.Then(...)` returns a
`BranchBuilder<TModel>` for `ElseIf`/`Else`. `Confirm` is its own guard that
goes straight to `.Then(...)`.

This catalog is exhaustive for: `When/Then/ElseIf/Else`; every compare operator
(`Eq/NotEq/Gt/Gte/Lt/Lte/In/NotIn/Between/Contains/StartsWith/EndsWith/Matches/MinLength/MaxLength/ArrayContains`);
the 6 presence operators (`Truthy/Falsy/IsNull/NotNull/IsEmpty/NotEmpty`);
guard composition (`And`/`Or`/`Not`, flat and nested); source variances
(event args, component read, source-vs-source, URL, plugin); and `Confirm`.

All samples are TALL — one fluent call per line, read top-to-bottom. Senior-living
domain throughout (residents, care levels, facilities, billing, assessments).

> **Source note.** `MaxLength` is the planned condition compare token (`max-length`,
> VO `MaximumTextLength` mirroring `MinimumTextLength`) called for in the redesign
> naming sheet §1.5 to sit beside the existing `MinLength`. It is documented here as
> part of the target surface; every other operator below is present in current source.

---

## Sources — where the value comes from

Three `When` overloads cover every value source. The operator's operand type is
inferred from the source's `TProp`, so comparisons are compile-time typed.

### When(args, x => x.Prop) — event payload

Inside a `.Reactive()` or `Event<T>` handler the event args object is the source.
`TProp` flows from the selected property.

```csharp
Html.On(plan, t => t.Event(m => m.CareLevel, "change"))
    .When(args, x => x.Value)
    .Eq("MemoryCare")
    .Then(p => p
        .Set(m => m.SecuredUnitRequired, true)
        .Dispatch("care-level-elevated"));
```

### When(component.Read()) — component read

Grab a typed component reference, then read one of its members as the source.

```csharp
var budget = p.Component<FusionNumericTextBox>(m => m.MonthlyBudget);

Html.On(plan, t => t.Event(m => m.MonthlyBudget, "change"))
    .When(budget.Value())
    .Gte(8000m)
    .Then(p => p
        .Set(m => m.RecommendedTier, "Premium"));
```

### When(p.FromUrl<T>(...)) — URL query parameter

Read a typed value straight from the browser address bar.

```csharp
Html.On(plan, t => t.PageLoad())
    .When(p.FromUrl<int>("waitlistPosition"))
    .Lte(5)
    .Then(p => p
        .Set(m => m.PriorityIntakeBanner, "visible"));
```

### When(p.Plugin<T>(...)) — plugin member

Read a method return value or property from a registered plugin.

```csharp
Html.On(plan, t => t.PageLoad())
    .When(p.Plugin<string>("geo", "currentRegion"))
    .Eq("Midwest")
    .Then(p => p
        .Set(m => m.RegionalPricingTable, "MidwestRates"));
```

### When(component.Read()).Eq(otherComponent.Read()) — source vs source

The right operand can itself be a typed source, so two live runtime values compare.

```csharp
var assessed = p.Component<FusionNumericTextBox>(m => m.AssessedCareScore);
var baseline = p.Component<FusionNumericTextBox>(m => m.BaselineCareScore);

Html.On(plan, t => t.Event(m => m.AssessedCareScore, "change"))
    .When(assessed.Value())
    .Gt(baseline.Value())
    .Then(p => p
        .Set(m => m.CareLevelIncreasing, true));
```

---

## When / Then / ElseIf / Else

### When ... Then

A single guarded branch. The `Then` pipeline runs when the condition holds.

```csharp
Html.On(plan, t => t.Event(m => m.IsVeteran, "change"))
    .When(args, x => x.Value)
    .Truthy()
    .Then(p => p
        .Set(m => m.VaBenefitsPanel, "visible"));
```

### When ... Then ... Else

Two-way routing. `Else` is terminal and returns void.

```csharp
Html.On(plan, t => t.Event(m => m.IsVeteran, "change"))
    .When(args, x => x.Value)
    .Truthy()
    .Then(p => p
        .Set(m => m.VaBenefitsPanel, "visible"))
    .Else(p => p
        .Set(m => m.VaBenefitsPanel, "hidden"));
```

### When ... ElseIf ... Then

`ElseIf` opens a new guarded branch from a fresh source, then `.Then(...)` again.
Branches evaluate in authored order; first match wins.

```csharp
Html.On(plan, t => t.Event(m => m.MonthlyBudget, "change"))
    .When(args, x => x.Value)
    .Gte(8000m)
    .Then(p => p
        .Set(m => m.RecommendedTier, "Premium"))
    .ElseIf(args, x => x.Value)
    .Gte(5000m)
    .Then(p => p
        .Set(m => m.RecommendedTier, "Standard"));
```

### When ... ElseIf ... Else — full cascade

The complete first-match decision tree with a default tail.

```csharp
Html.On(plan, t => t.Event(m => m.FallRiskScore, "change"))
    .When(args, x => x.Value)
    .Gte(8)
    .Then(p => p
        .Set(m => m.FallPrecautionTier, "High"))
    .ElseIf(args, x => x.Value)
    .Gte(4)
    .Then(p => p
        .Set(m => m.FallPrecautionTier, "Moderate"))
    .Else(p => p
        .Set(m => m.FallPrecautionTier, "Standard"));
```

### ElseIf from a different source

`ElseIf` takes the same overloads as `When` — event args, typed source, or response body.

```csharp
var fundsLeft = p.Component<FusionNumericTextBox>(m => m.RemainingBalance);

Html.On(plan, t => t.Event(m => m.PaymentSource, "change"))
    .When(args, x => x.Value)
    .Eq("Medicaid")
    .Then(p => p
        .Set(m => m.SubsidyWorkflow, "Medicaid"))
    .ElseIf(fundsLeft.Value())
    .Lte(0m)
    .Then(p => p
        .Set(m => m.SubsidyWorkflow, "BalanceReview"))
    .Else(p => p
        .Set(m => m.SubsidyWorkflow, "Private"));
```

---

## Compare operators

### Eq

Equality. Source equals the operand.

```csharp
Html.On(plan, t => t.Event(m => m.Facility, "change"))
    .When(args, x => x.Value)
    .Eq("WillowCreek")
    .Then(p => p
        .Set(m => m.RegionalDirector, "Patel"));
```

### NotEq

Inequality.

```csharp
Html.On(plan, t => t.Event(m => m.PaymentSource, "change"))
    .When(args, x => x.Value)
    .NotEq("Private")
    .Then(p => p
        .Set(m => m.SubsidyFormVisible, true));
```

### Gt

Greater than.

```csharp
Html.On(plan, t => t.Event(m => m.FallRiskScore, "change"))
    .When(args, x => x.Value)
    .Gt(7)
    .Then(p => p
        .Set(m => m.BedAlarmRequired, true));
```

### Gte

Greater than or equal.

```csharp
Html.On(plan, t => t.Event(m => m.AgeYears, "change"))
    .When(args, x => x.Value)
    .Gte(65)
    .Then(p => p
        .Set(m => m.MedicareEligible, true));
```

### Lt

Less than.

```csharp
Html.On(plan, t => t.Event(m => m.BmiValue, "change"))
    .When(args, x => x.Value)
    .Lt(18.5m)
    .Then(p => p
        .Set(m => m.NutritionConsultFlag, true));
```

### Lte

Less than or equal.

```csharp
Html.On(plan, t => t.Event(m => m.RemainingBalance, "change"))
    .When(args, x => x.Value)
    .Lte(0m)
    .Then(p => p
        .Set(m => m.AccountStatus, "PaidInFull"));
```

### In

Membership in a `params` set of literals; operands match `TProp`.

```csharp
Html.On(plan, t => t.Event(m => m.CareLevel, "change"))
    .When(args, x => x.Value)
    .In("AssistedLiving", "MemoryCare", "SkilledNursing")
    .Then(p => p
        .Set(m => m.MedManagementRequired, true));
```

### NotIn

Absence from a `params` set.

```csharp
Html.On(plan, t => t.Event(m => m.RoomType, "change"))
    .When(args, x => x.Value)
    .NotIn("Studio", "Companion")
    .Then(p => p
        .Set(m => m.PrivateRoomFee, 1200m));
```

### Between

Inclusive range with a low and a high operand.

```csharp
Html.On(plan, t => t.Event(m => m.SystolicBp, "change"))
    .When(args, x => x.Value)
    .Between(120, 139)
    .Then(p => p
        .Set(m => m.BpCategory, "Elevated"));
```

### Contains

Substring match for a string source.

```csharp
Html.On(plan, t => t.Event(m => m.Allergies, "change"))
    .When(args, x => x.Value)
    .Contains("Penicillin")
    .Then(p => p
        .Set(m => m.AntibioticWarning, "visible"));
```

### StartsWith

String prefix match.

```csharp
Html.On(plan, t => t.Event(m => m.RoomNumber, "change"))
    .When(args, x => x.Value)
    .StartsWith("3")
    .Then(p => p
        .Set(m => m.Wing, "MemoryCareWing"));
```

### EndsWith

String suffix match.

```csharp
Html.On(plan, t => t.Event(m => m.ContactEmail, "change"))
    .When(args, x => x.Value)
    .EndsWith("@willowcreek.org")
    .Then(p => p
        .Set(m => m.InternalStaffFlag, true));
```

### Matches

Regular-expression test against a string source.

```csharp
Html.On(plan, t => t.Event(m => m.MedicareId, "change"))
    .When(args, x => x.Value)
    .Matches(@"^\d{3}-\d{2}-\d{4}[A-Z]$")
    .Then(p => p
        .Set(m => m.MedicareIdValid, true));
```

### MinLength

String/collection minimum length.

```csharp
Html.On(plan, t => t.Event(m => m.CarePlanNotes, "input"))
    .When(args, x => x.Value)
    .MinLength(20)
    .Then(p => p
        .Set(m => m.NotesSufficient, true));
```

### MaxLength

String/collection maximum length. Planned token mirroring `MinLength` (naming sheet §1.5).

```csharp
Html.On(plan, t => t.Event(m => m.RoomLabel, "input"))
    .When(args, x => x.Value)
    .MaxLength(12)
    .Then(p => p
        .Set(m => m.LabelFitsDoorTag, true));
```

### ArrayContains

Membership of an item inside an array source.

```csharp
Html.On(plan, t => t.Event(m => m.SelectedServices, "change"))
    .When(args, x => x.Items)
    .ArrayContains("PhysicalTherapy")
    .Then(p => p
        .Set(m => m.TherapyScheduleVisible, true));
```

---

## Presence operators

These take no operand — they test the source value's presence/shape.

### Truthy

Present and non-falsy (non-null, non-zero, non-empty, non-false).

```csharp
Html.On(plan, t => t.Event(m => m.PowerOfAttorneyOnFile, "change"))
    .When(args, x => x.Value)
    .Truthy()
    .Then(p => p
        .Set(m => m.LegalReviewComplete, true));
```

### Falsy

Absent or falsy (null, zero, empty, false).

```csharp
Html.On(plan, t => t.Event(m => m.EmergencyContact, "change"))
    .When(args, x => x.Value)
    .Falsy()
    .Then(p => p
        .Set(m => m.IntakeBlockedReason, "MissingEmergencyContact"));
```

### IsNull

Value is null or undefined.

```csharp
Html.On(plan, t => t.Event(m => m.DischargeDate, "change"))
    .When(args, x => x.Value)
    .IsNull()
    .Then(p => p
        .Set(m => m.ResidentStatus, "Active"));
```

### NotNull

Value is not null and not undefined.

```csharp
Html.On(plan, t => t.Event(m => m.DischargeDate, "change"))
    .When(args, x => x.Value)
    .NotNull()
    .Then(p => p
        .Set(m => m.ResidentStatus, "Discharged"));
```

### IsEmpty

Empty string or empty collection.

```csharp
Html.On(plan, t => t.Event(m => m.MedicationList, "change"))
    .When(args, x => x.Items)
    .IsEmpty()
    .Then(p => p
        .Set(m => m.MedReconciliationDue, false));
```

### NotEmpty

Non-empty string or collection.

```csharp
Html.On(plan, t => t.Event(m => m.MedicationList, "change"))
    .When(args, x => x.Items)
    .NotEmpty()
    .Then(p => p
        .Set(m => m.MedReconciliationDue, true));
```

---

## Guard composition

### And (flat)

Chain `.And(source).Operator` directly — produces a flat all-of guard.

```csharp
Html.On(plan, t => t.Event(m => m.CareLevel, "change"))
    .When(args, x => x.Value)
    .Eq("MemoryCare")
    .And(args, x => x.AmbulationStatus)
    .Eq("Wheelchair")
    .Then(p => p
        .Set(m => m.AccessibleRoomRequired, true));
```

### And (flat, repeated)

`.And().And()` flattens into one all-of guard over all terms.

```csharp
Html.On(plan, t => t.Event(m => m.IntakeStep, "change"))
    .When(args, x => x.AssessmentComplete)
    .Truthy()
    .And(args, x => x.PhysicianOrdersSigned)
    .Truthy()
    .And(args, x => x.DepositPaid)
    .Truthy()
    .Then(p => p
        .Set(m => m.ReadyForMoveIn, true));
```

### Or (flat)

Chain `.Or(source).Operator` — produces a flat any-of guard.

```csharp
Html.On(plan, t => t.Event(m => m.PaymentSource, "change"))
    .When(args, x => x.Value)
    .Eq("Medicaid")
    .Or(args, x => x.Value)
    .Eq("VA")
    .Then(p => p
        .Set(m => m.SubsidyWorkflowVisible, true));
```

### And across source kinds

Flat composition mixes source kinds — here event args and a component read.

```csharp
var fundsLeft = p.Component<FusionNumericTextBox>(m => m.RemainingBalance);

Html.On(plan, t => t.Event(m => m.PaymentSource, "change"))
    .When(args, x => x.Value)
    .Eq("Private")
    .And(fundsLeft.Value())
    .Lt(2000m)
    .Then(p => p
        .Set(m => m.LowBalanceReminder, "visible"));
```

### And (nested group)

`.And(cs => cs.When(...).Operator)` opens a grouped sub-condition — needed for
precedence the flat shape cannot express.

```csharp
Html.On(plan, t => t.Event(m => m.CareLevel, "change"))
    .When(args, x => x.IntakeComplete)
    .Truthy()
    .And(cs => cs
        .When(args, x => x.CareLevel)
        .Eq("MemoryCare"))
    .Then(p => p
        .Set(m => m.SecuredUnitRequired, true));
```

### Or (nested group)

A grouped any-of sub-condition.

```csharp
Html.On(plan, t => t.Event(m => m.FallRiskScore, "change"))
    .When(args, x => x.ResidentActive)
    .Truthy()
    .And(cs => cs
        .Or(o => o
            .When(args, x => x.FallRiskScore)
            .Gte(8))))
    .Then(p => p
        .Set(m => m.BedAlarmRequired, true));
```

### Mixed grouping — (a OR b) AND c

The canonical reason nested grouping exists: an OR group AND-ed with another term.

```csharp
Html.On(plan, t => t.Event(m => m.CareLevel, "change"))
    .When(args, x => x.IntakeComplete)
    .Truthy()
    .And(cs => cs
        .When(args, x => x.CareLevel)
        .Eq("MemoryCare")
        .Or(args, x => x.FallRiskScore)
        .Gte(8))
    .Then(p => p
        .Set(m => m.NursePreReviewRequired, true));
```

### Not

Inverts the guard built so far.

```csharp
Html.On(plan, t => t.Event(m => m.BackgroundCheckStatus, "change"))
    .When(args, x => x.Value)
    .Eq("Cleared")
    .Not()
    .Then(p => p
        .Set(m => m.OnboardingBlocked, true));
```

### Not over a nested group

`Not()` inverts the whole composed condition, including grouped sub-conditions.

```csharp
Html.On(plan, t => t.Event(m => m.IntakeStep, "change"))
    .When(args, x => x.DepositPaid)
    .Truthy()
    .And(cs => cs
        .When(args, x => x.PhysicianOrdersSigned)
        .Truthy())
    .Not()
    .Then(p => p
        .Set(m => m.MoveInBlocked, true));
```

---

## Confirm

### Confirm (flat guard)

A user-decision async gate. The pipeline proceeds only when the user accepts.
`Confirm` goes straight to `.Then(...)` — no source, no operator.

```csharp
Html.On(plan, t => t.DispatchFrom("discharge-resident"))
    .Confirm("Discharge this resident? This closes the active care plan.")
    .Then(p => p
        .Set(m => m.ResidentStatus, "Discharged")
        .Dispatch("resident-discharged"));
```

### Confirm before a billing action

Guarding an irreversible billing mutation behind user acceptance.

```csharp
Html.On(plan, t => t.DispatchFrom("post-monthly-charges"))
    .Confirm("Post this month's care charges to all active resident accounts?")
    .Then(p => p
        .Set(m => m.BillingRunStatus, "Posting")
        .Dispatch("billing-run-started"));
```

</script>
<script type="text/markdown" data-area="value-arrays">
# value-arrays

The value + reactive-array DSL: every way to **read a value** and every way to
**transform an array**, the framework can serialize into a plan and execute in the
browser with no server-side rendering.

One concept reads all values: `TypedSource<T>`. It is the single typed authoring
surface for a component member, a plugin member, a URL parameter, an event
payload, a success/error body, a literal, an object, an array, and the scalar
result of an array fold. Anywhere the DSL accepts "a value" — a reaction's right
side, a condition operand, a gather payload, a route param, a header, a dispatch
field, a plugin argument, an array projection — it accepts a `TypedSource<T>`.

`ReactiveArray<T>` is a typed, **deferred** array transform. Its operators capture
authoring intent and compile to plan-JSON `array-op` nodes — nothing runs on the
server. It is deliberately **not** `IEnumerable`/`IQueryable`, so LINQ extension
methods cannot bind (no collision) and lambdas are captured, not invoked. Folds
(`Count`, `Sum`, `Min`, `Max`, `Average`, `Any`, `All`, `FindFirst`) terminate the
chain in a `ReactiveValue<T>`, which is itself a `TypedSource<T>` — so a fold plugs
straight into `SetText`, `When`, a dispatch field, or anywhere a value is read.

The runtime engine is `Alis.Reactive.Assets/runtime/value/array-op-engine.ts`:
eight pure, sync ops (`count·filter·map·sum·any·all·find·orderBy/orderByDescending`,
plus the new numeric folds `min·max·average`). It normalizes array-like browser
values (DOMTokenList, HTMLCollection, NodeList, iterables) to a JS array at the
input boundary, sorts deterministically (numeric when both keys are numbers, else
lexicographic; non-finite keys sort last), and returns `null` on empty for
first/fold ops.

Domain throughout: senior-living — residents, care levels, facilities, billing,
assessments, shift assignments.

> **Names are the finalized green-field names** (`09-dsl-naming-sheet.md`):
> `FindFirst` (was `Find`), `AsArraySource()` (was `AsSource()`), the numeric folds
> `Min`/`Max`/`Average`, the gather literal source `Literal(param, value)` (was
> `Static`), and the `WholeResponseBody` / `WholeElement` value-node kinds (was the
> `responseBody` / `elementValue` sentinels). The per-op verbs
> (`Where/Select/OrderBy/OrderByDescending/Count/Any/All/Sum`) keep their truthful
> names.

---

## TypedSource<T> — the one typed value handle

`TypedSource<T>` is abstract; you never construct it. You obtain one from a typed
factory and the `<T>` flows through every place that reads it, preserving
compile-time safety (a `decimal` source cannot be dropped where a `string` is
expected).

### Read a component member as a source

The `.Value()` (or any value-returning member) of a registered component is a
`TypedSource<T>` — feed it to `SetText`, `When`, a gather `Include`, etc.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("welcome-line")
        .SetText(p
            .Component<FusionTextBox>(m => m.ResidentName)
            .Value()));
```

### Read a URL query parameter as a source

`FromUrl<T>(name)` reads a value from the current URL query string, typed to `T`.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("facility-label")
        .SetText(p.FromUrl<string>("facility")));
```

### Read an event-payload property as a source

Inside a `.Reactive(...)` pipeline, the event args object is a typed payload;
`FromEvent` (the `When(args, x => x.Prop)` / `p.From(args, ...)` family) reads a
property off it.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p.FromUrl<string>("status"))
        .Eq("active")
        .Then(s => s
            .Element("badge")
            .Show()));
```

### Read a success-body property as a source

In a success route, `responseBody.Read(expr)` yields a `TypedSource<TProp>`.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Get("/api/census/summary")
        .Response(r => r
            .OnSuccess<CensusSummary>((json, s) => s
                .Element("occupied-beds")
                .SetText(json.Read(x => x.OccupiedBeds)))));
```

### Read a plugin member as a source

A plugin function return or property is a `TypedSource<T>` at the stringly plugin
boundary.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("slug")
        .SetText(p
            .Plugin<string>("urls", "currentSlug")
            .Value()));
```

---

## Literal — a constant value embedded in the plan

A `Literal` value-node (`kind:"literal"`) carries a JSON-serializable constant and
its inferred `Shape`. You author it implicitly by passing a C# constant where a
source is expected; System.Text.Json serializes it at render time (no reflection).

### Literal string

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("banner")
        .SetText("Welcome to Maple Court"));
```

### Literal int / decimal / double (numeric shape)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Set(m => m.OpenAssessments, 0));
```

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Set(m => m.MonthlyRate, 4250.00m));
```

### Literal bool (boolean shape)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Set(m => m.IsAdmitted, true));
```

### Literal DateTime (date shape, ISO-8601 round-trip "O")

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Set(m => m.AdmissionDate, new DateTime(2026, 1, 1)));
```

### Literal as a condition operand

The right side of a comparison is a literal; the left is the typed source.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p.Component<FusionNumericTextBox>(m => m.Age).Value())
        .Gte(65)
        .Then(s => s
            .Element("senior-flag")
            .Show()));
```

### Literal as a gather payload value

In the HTTP gather scope a fixed value is added with `Literal(param, value)`
(the finalized name for the old `Static`), aligning with the value-spine `Literal`.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Post("/api/admissions")
        .Gather(g => g
            .Literal("source", "kiosk")
            .Include(m => m.ResidentName)));
```

---

## Read — a value pulled from a live source at execution time

A `Read` value-node (`kind:"read"`) names a `Source` (component / plugin / URL /
payload / DOM element), a member, an optional nested path, and a `Shape`. A read
may access a **property** or **invoke a method** (the `property` vs `method`
discriminator).

### Property read off a component

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("care-level-echo")
        .SetText(p
            .Component<FusionDropDownList>(m => m.CareLevel)
            .Value()));
```

### Method-invoke read (member returns a value)

Any member that returns a value can be a source. Method args are themselves
value expressions.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("selected-count")
        .SetText(p
            .Component<FusionGrid>("resident-grid")
            .GetSelectedRecords()
            .AsArraySource()
            ... ));
```

### Nested-path payload read

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Get("/api/residents/active")
        .Response(r => r
            .OnSuccess<ResidentEnvelope>((json, s) => s
                .Element("primary-city")
                .SetText(json.Read(x => x.Resident.Address.City)))));
```

### DOM-element member read

`p.FromDom(elementId, member)` reads an array-like member off a DOM element
resolved by `getElementById` (the member name is stringly at the DOM boundary).

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("class-count")
        .SetText(p
            .FromDom("resident-card", "classList")
            .Count()));
```

---

## ObjectValue — a composite value built from named fields

An `ObjectValue` node (`kind:"object"`) assembles a JSON object from named field
expressions; the object `Shape` is inferred from the fields. You author it through
the dispatch / gather object builders, where each field is itself any value source.

### Object payload on a typed dispatch

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .DispatchFrom<AdmissionEvent>("resident-admitted", o => o
            .Set(e => e.ResidentName, p.Component<FusionTextBox>(m => m.ResidentName).Value())
            .Set(e => e.CareLevel, p.Component<FusionDropDownList>(m => m.CareLevel).Value())
            .Set(e => e.AdmittedOn, p.FromUrl<DateTime>("date"))));
```

### Object value mixing literal and live fields

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .DispatchFrom<BillingNote>("note-created", o => o
            .Set(n => n.Category, "monthly-rate")
            .Set(n => n.Amount, p.Component<FusionNumericTextBox>(m => m.MonthlyRate).Value())));
```

---

## ArrayValue — a composite value built from ordered items

An `ArrayValue` node (`kind:"array"`) assembles a JSON array from ordered item
expressions; the element `Shape` is the shared item shape when all items agree,
otherwise `Any`. Authored where the DSL collects ordered values (e.g. a multi-value
gather field or an array dispatch field).

### Literal array of care levels

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .DispatchFrom<FilterEvent>("filter-set", o => o
            .SetArray(f => f.CareLevels, "independent", "assisted", "memory")));
```

### Array of live component reads

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .DispatchFrom<FacilityEvent>("facilities-chosen", o => o
            .SetArray(f => f.FacilityIds,
                p.Component<FusionDropDownList>(m => m.PrimaryFacility).Value(),
                p.Component<FusionDropDownList>(m => m.BackupFacility).Value())));
```

---

## ReactiveArray<T> — entering the array transform

You enter a deferred array transform with `p.From(...)` (over any array-shaped
source) or `p.FromDom(...)` (over a DOM array-like member). The element type flows
through every operator; the lambdas are captured into plan nodes, never invoked.

### From a component array member

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("tag-count")
        .SetText(p
            .From(p.Component<FusionMultiSelect>(m => m.Tags).Value())
            .Count()));
```

### From an event-payload array (.Reactive event args)

`p.From(args, e => e.Data)` opens a transform over an event-payload `T[]`; the
element type `T` flows through the chain.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(payload, x => x.Selection.Data)
        .Where(c => c.Value == "memory")
        .Count()
        ... );
```

### FromDom — DOM array-like member (string elements)

`p.FromDom(elementId, member)` yields a `ReactiveArray<string>`; array-like
collections (DOMTokenList / HTMLCollection / NodeList) are normalized at the op
boundary.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("has-alert-class")
        .SetText(p
            .FromDom("resident-card", "classList")
            .Any(c => c == "has-alert")));
```

### FromDom<TElement> — DOM array-like member of a declared element type

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("child-count")
        .SetText(p
            .FromDom<ResidentCard>("roster", "children")
            .Count()));
```

---

## Where — keep matching elements (array → array)

`Where(predicate)` filters by a per-element sync predicate (compiled to a
`ConditionGraph` over the element scope). Chains compose; the element type is
unchanged.

### Filter by a numeric comparison

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("high-acuity-count")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Where(r => r.AcuityScore >= 8)
            .Count()));
```

### Filter with logical && and ||

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionMultiSelect>(m => m.Residents).Value())
        .Where(r => r.CareLevel == "memory" && r.Age >= 80)
        .Count()
        ... );
```

### Filter with a string operator (Contains/StartsWith/EndsWith)

String-operator arguments must be constants or captured values, never element
reads.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionGrid>("directory").GetCurrentViewRecords().AsArraySource())
        .Where(r => r.ResidentName.StartsWith("A"))
        .Count()
        ... );
```

### Filter on a boolean member (truthy)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
        .Where(r => r.IsDischargePending)
        .Count()
        ... );
```

---

## Select — project each element (array → array of TResult)

`Select(selector)` projects each element through a per-element value selector,
changing the element type to `TResult` (the result shape flows on).

### Project to a scalar field

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionDropDownList>(m => m.FacilityPicker)
        .SetDataSource(p
            .From(p.Component<FusionGrid>("facilities").GetCurrentViewRecords().AsArraySource())
            .Select(f => f.FacilityName)
            .AsArraySource()));
```

### Project then filter (chained)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionMultiSelect>(m => m.Residents).Value())
        .Where(r => r.AcuityScore >= 8)
        .Select(r => r.ResidentName)
        .AsArraySource()
        ... );
```

### Project a whitelisted pure element method (e.g. ToUpperCase)

Per-element method calls must be pure and whitelisted
(`toUpperCase`/`toLowerCase`/`trim`/date getters/`getAttribute`/`hasAttribute`).

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionMultiSelect>(m => m.Codes).Value())
        .Select(c => c.ToUpperCase())
        .AsArraySource()
        ... );
```

---

## OrderBy — order elements ascending (array → array)

`OrderBy(key)` orders by a per-element key projection. The key **must** project to
a comparable scalar (string/number/date/bool/enum) — a non-scalar key throws at
authoring time (it would silently sort every element as `"[object Object]"`).

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionGrid>("waitlist")
        .SetDataSource(p
            .From(p.Component<FusionGrid>("waitlist").GetCurrentViewRecords().AsArraySource())
            .OrderBy(r => r.AdmissionDate)
            .AsArraySource()));
```

### OrderBy a string key

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionGrid>("directory").GetCurrentViewRecords().AsArraySource())
        .OrderBy(r => r.ResidentName)
        .AsArraySource()
        ... );
```

---

## OrderByDescending — order elements descending (array → array)

`OrderByDescending(key)` is the descending mirror; same scalar-key guard.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
        .OrderByDescending(r => r.AcuityScore)
        .AsArraySource()
        ... );
```

### Filter then order descending (chained)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
        .Where(r => r.CareLevel == "memory")
        .OrderByDescending(r => r.MonthlyRate)
        .AsArraySource()
        ... );
```

---

## Count — number of elements (array → ReactiveValue<int>)

A terminal fold. `Count()` is unconditional length; `Count(predicate)` compiles to
`filter -> count`, so the count node never carries a predicate.

### Count all elements

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("total-residents")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Count()));
```

### Count matching a predicate

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("memory-care-count")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Count(r => r.CareLevel == "memory")));
```

---

## Any — is the array non-empty / does any match (array → ReactiveValue<bool>)

### Any element exists (no predicate)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p
            .From(p.Component<FusionMultiSelect>(m => m.Tags).Value())
            .Any())
        .Then(s => s
            .Element("tags-present")
            .Show()));
```

### Any element matches the predicate

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Any(r => r.IsDischargePending))
        .Then(s => s
            .Element("discharge-banner")
            .Show()));
```

---

## All — do every element match (array → ReactiveValue<bool>)

`All(predicate)` is true when every element matches (vacuously true on empty).

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p
            .From(p.Component<FusionGrid>("assessments").GetCurrentViewRecords().AsArraySource())
            .All(a => a.IsComplete))
        .Then(s => s
            .Element("submit-all")
            .Show()));
```

---

## Sum — add a numeric projection (array → ReactiveValue<number>)

`Sum(selector)` sums a numeric per-element selector; non-finite contributions count
as 0. Three CLR overloads (`int` / `decimal` / `double`) type only the terminal
`ReactiveValue<T>` — all three compile to one `sum` wire node.

### Sum an int selector

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("open-tasks-total")
        .SetText(p
            .From(p.Component<FusionGrid>("care-board").GetCurrentViewRecords().AsArraySource())
            .Sum(r => r.OpenTasks)));
```

### Sum a decimal selector (billing)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("monthly-revenue")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Sum(r => r.MonthlyRate)));
```

### Sum a double selector

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("total-hours")
        .SetText(p
            .From(p.Component<FusionGrid>("shifts").GetCurrentViewRecords().AsArraySource())
            .Sum(r => r.ScheduledHours)));
```

### Filter then sum (chained)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("memory-care-revenue")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Where(r => r.CareLevel == "memory")
            .Sum(r => r.MonthlyRate)));
```

---

## Min — smallest of a numeric projection (array → ReactiveValue<TNum>)

`Min(selector)` returns the smallest projected value; empty input → `null` (same
null-on-empty contract as `FindFirst`).

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("lowest-acuity")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Min(r => r.AcuityScore)));
```

### Min over a filtered set (chained)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("earliest-admission")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Where(r => r.CareLevel == "assisted")
            .Min(r => r.AdmissionDate)));
```

---

## Max — largest of a numeric projection (array → ReactiveValue<TNum>)

`Max(selector)` mirrors `Min`; empty input → `null`.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("highest-rate")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Max(r => r.MonthlyRate)));
```

### Max over a filtered set (chained)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("peak-acuity-memory")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Where(r => r.CareLevel == "memory")
            .Max(r => r.AcuityScore)));
```

---

## Average — mean of a numeric projection (array → ReactiveValue<double>)

`Average(selector)` returns the mean; the terminal type is always `double`
(the mean is non-integral). Empty input → `null`. Spelled in full to match LINQ
and scream intent.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("average-acuity")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Average(r => r.AcuityScore)));
```

### Average over a filtered set (chained)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("avg-memory-rate")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Where(r => r.CareLevel == "memory")
            .Average(r => r.MonthlyRate)));
```

---

## FindFirst — first matching element, or null (array → ReactiveValue<T>)

`FindFirst(predicate)` returns the first element that matches the predicate, or
`null` when none match. (Renamed from `Find`; the name screams the first-match
semantics. Wire token stays `find`.)

### FindFirst the whole element

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .FindFirst(r => r.IsDischargePending))
        .NotNull()
        .Then(s => s
            .Element("pending-alert")
            .Show()));
```

### FindFirst projecting a field (two-arg overload)

`FindFirst(predicate, selector)` returns a per-element field of the first match.

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("first-pending-name")
        .SetText(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .FindFirst(r => r.IsDischargePending, r => r.ResidentName)));
```

---

## AsArraySource — expose a transformed array as TypedSource<T[]>

`AsArraySource()` (renamed from `AsSource()`) ends a `ReactiveArray<T>` chain and
exposes the transformed array as a `TypedSource<T[]>`, so it binds to any
`SetDataSource(TypedSource<T[]>)` overload — no HTTP round-trip. The result type
screams the array shape so the conversion target is unambiguous.

### Bind a filtered+sorted array straight to a component

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionGrid>("memory-census")
        .SetDataSource(p
            .From(p.Component<FusionGrid>("census").GetCurrentViewRecords().AsArraySource())
            .Where(r => r.CareLevel == "memory")
            .OrderByDescending(r => r.AcuityScore)
            .AsArraySource()));
```

### Bind a projected array to a dropdown

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Component<FusionDropDownList>(m => m.FacilityPicker)
        .SetDataSource(p
            .From(p.Component<FusionMultiSelect>(m => m.Facilities).Value())
            .Select(f => f.FacilityName)
            .AsArraySource()));
```

---

## From — open an array transform over any array source

`p.From(TypedSource<T[]>)` is the array-source entry verb. The source can be a
component member, a plugin return, a previous `AsArraySource()`, or any
array-shaped `TypedSource<T[]>` — the same `From` voice as the HTTP pipeline.

### From a plugin array return

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("recent-count")
        .SetText(p
            .From(p.Plugin<string[]>("history", "recentResidents").Value())
            .Count()));
```

### From an event payload array (.Reactive args)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("selected-memory")
        .SetText(p
            .From(payload, e => e.Selection.Data)
            .Count(c => c.Value == "memory")));
```

---

## FromDom — open an array transform over a DOM array-like member

`p.FromDom(elementId, member)` opens a transform over a DOM element's array-like
member (resolved by `getElementById`); DOMTokenList / HTMLCollection / NodeList are
normalized at the op boundary. The string overload yields `ReactiveArray<string>`;
the generic overload declares the element type.

### FromDom over classList (string elements)

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .When(p
            .FromDom("resident-card", "classList")
            .Any(c => c == "high-risk"))
        .Then(s => s
            .Element("risk-badge")
            .Show()));
```

### FromDom<TElement> over child elements

```csharp
Html.On(plan, t => t.PageLoad())
    .Then(p => p
        .Element("row-count")
        .SetText(p
            .FromDom<RosterRow>("roster", "children")
            .Count()));
```

---

## ReactiveValue<T> — the scalar terminal of a fold

Every fold (`Count`, `Sum`, `Min`, `Max`, `Average`, `Any`, `All`, `FindFirst`)
returns a `ReactiveValue<T>`, which **is** a `TypedSource<T>`. So a fold needs no
